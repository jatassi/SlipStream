<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlipStream Startup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=block">
<link rel="stylesheet" href="stage.css">
<style>
html, body { margin: 0; height: 100%; background: hsl(214 7% 5%); overflow: hidden; }
.startup-stage { font-family: Geist, "Helvetica Neue", sans-serif; }
</style>
</head>
<body>
<div class="startup-stage" role="img" aria-label="SlipStream"></div>
<script type="module">
import { DURATION, STILL, build, render } from "./sequence.js";

const stage = document.querySelector(".startup-stage");
await build(stage);
render(0, stage);
window.SLIPSTREAM = { render: (t) => render(t, stage), DURATION };
window.READY = true;
if (!new URLSearchParams(location.search).has("still")) {
  let t0;
  const loop = (now) => {
    t0 ??= now;
    const t = (now - t0) / 1000;
    render(Math.min(t, DURATION), stage);
    if (t >= DURATION + 1) t0 = undefined;
    requestAnimationFrame(loop);
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) render(STILL, stage);
  else requestAnimationFrame(loop);
}
</script>
</body>
</html>
