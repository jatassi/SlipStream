<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlipStream Startup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=block">
<style>
:root { --h: 214; --s: 14%; }
html, body { margin: 0; height: 100%; background: hsl(214 7% 5%); overflow: hidden; }
#stage { position: fixed; inset: 0; background: hsl(var(--h) calc(var(--s) * .5) 5%); }
#ambient {
  position: absolute; inset: 0; opacity: 0;
  background:
    radial-gradient(60% 70% at 30% 62%, hsl(var(--h) 60% 26% / .55), transparent 70%),
    radial-gradient(55% 60% at 72% 34%, hsl(var(--h) 60% 22% / .45), transparent 70%),
    linear-gradient(hsl(var(--h) 20% 5% / 0), hsl(var(--h) 20% 4% / .9));
}
#grid {
  position: absolute; inset: -22px; opacity: 0;
  background-image: radial-gradient(circle at 1px 1px, hsl(var(--h) 40% 88% / .16) 1px, transparent 1.4px);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(42% 48% at 50% 50%, #000 0%, transparent 100%);
  mask-image: radial-gradient(42% 48% at 50% 50%, #000 0%, transparent 100%);
}
svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#word { font-family: Geist, "Helvetica Neue", sans-serif; letter-spacing: -0.03em; font-kerning: normal; }
#grain { position: absolute; inset: 0; opacity: .05; background: url(grain.png) 0 0 / 256px 256px; mix-blend-mode: overlay; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="ambient"></div>
  <div id="grid"></div>
  <svg id="svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="SlipStream" role="img">
    <defs>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="softer" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4.5"/></filter>
      <linearGradient id="wipe" gradientUnits="userSpaceOnUse" x1="0" x2="1920" y1="0" y2="0">
        <stop id="w0" offset="0" stop-color="#fff"/>
        <stop id="w1" offset="0" stop-color="#000"/>
      </linearGradient>
      <mask id="wordMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
        <rect width="1920" height="1080" fill="url(#wipe)"/>
      </mask>
    </defs>
    <g id="lockup">
      <g id="mark">
        <path id="E" d="M52 14H25a9 9 0 0 0 0 18h14a9 9 0 0 1 0 18H12" fill="none" stroke="none"/>
        <path id="S" d="M40 14H25a9 9 0 0 0 0 18h14a9 9 0 0 1 0 18H24" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="draft" fill="none" stroke-linecap="round"></g>
        <g id="trailGlow" filter="url(#softer)" style="mix-blend-mode: screen"></g>
        <g id="trailCore" style="mix-blend-mode: screen"></g>
        <circle id="ringA" cx="52" cy="14" r="5.5" fill="none"/>
        <circle id="ringB" cx="12" cy="50" r="5.5" fill="none"/>
        <circle id="ringB2" cx="12" cy="50" r="5.5" fill="none"/>
        <circle id="ringA2" cx="52" cy="14" r="5.5" fill="none"/>
        <circle id="haloA" cx="52" cy="14" r="5.5" filter="url(#softer)"/>
        <circle id="haloB" cx="12" cy="50" r="5.5" filter="url(#softer)"/>
        <circle id="dotA" cx="52" cy="14" r="5.5"/>
        <circle id="dotB" cx="12" cy="50" r="5.5"/>
        <path id="ackGlow" d="M12 50H39a9 9 0 0 0 0-18H25a9 9 0 0 1 0-18H52" fill="none" stroke-width="12" stroke-linecap="round" filter="url(#softer)" style="mix-blend-mode: screen"/>
        <path id="ackCore" d="M12 50H39a9 9 0 0 0 0-18H25a9 9 0 0 1 0-18H52" fill="none" stroke-width="5" stroke-linecap="round" filter="url(#soft)" style="mix-blend-mode: screen"/>
        <circle id="headGlow" r="9" filter="url(#softer)"/>
        <circle id="head" r="4" fill="#fff"/>
      </g>
      <g id="word" mask="url(#wordMask)">
        <text id="wordText" x="0" y="0"><tspan font-weight="600">Slip</tspan><tspan font-weight="400">Stream</tspan></text>
      </g>
    </g>
  </svg>
  <div id="grain"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const DURATION = 4.4;

function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t;
  const sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const e = sx(t) - x;
      if (Math.abs(e) < 1e-6) break;
      const d = dx(t);
      if (Math.abs(d) < 1e-6) break;
      t -= e / d;
    }
    let lo = 0, hi = 1;
    for (let i = 0; i < 30 && Math.abs(sx(t) - x) > 1e-6; i++) {
      if (sx(t) < x) lo = t; else hi = t;
      t = (lo + hi) / 2;
    }
    return sy(t);
  };
}
const standard = bezier(.16, 1, .3, 1);
const spring = bezier(.32, .72, 0, 1);
const travel = bezier(.62, 0, .18, 1);
const clamp01 = x => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;

function bounce(t, { stiffness = 260, damping = 16 } = {}) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(stiffness), z = damping / (2 * w0);
  if (z >= 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
}

const $ = id => document.getElementById(id);
const ambient = $("ambient"), grid = $("grid");
const E = $("E"), S = $("S");
const LE = E.getTotalLength(), LS = S.getTotalLength();
const S_START = 12, S_END = S_START + LS;
const TRAIL_N = 16;
const trailGlow = [], trailCore = [];
const NS = "http://www.w3.org/2000/svg";
for (let i = 0; i < TRAIL_N; i++) {
  for (const [list, parent] of [[trailGlow, $("trailGlow")], [trailCore, $("trailCore")]]) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", E.getAttribute("d"));
    p.setAttribute("fill", "none");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    parent.appendChild(p);
    list.push(p);
  }
}

const STEP = .25;
const samples = [];
for (let l = 0; l <= LE + STEP; l += STEP) {
  const a = E.getPointAtLength(Math.max(0, l - .5)), b = E.getPointAtLength(Math.min(LE, l + .5)), p = E.getPointAtLength(Math.min(LE, l));
  const dx = b.x - a.x, dy = b.y - a.y, n = Math.hypot(dx, dy) || 1;
  samples.push({ x: p.x, y: p.y, nx: -dy / n, ny: dx / n });
}
const DRAFT = [8, -8, 12, -12];
const DRAFT_SEG = 14;
const ARC = 9 * Math.PI;
const ARCS = [[27, 27 + ARC], [41 + ARC, 41 + 2 * ARC]];
function straightness(l) {
  let k = 1;
  for (const [a, b] of ARCS) {
    if (l > a - 3 && l < b + 3) k = Math.min(k, l < a + 2 ? clamp01((a + 2 - l) / 5) : l > b - 2 ? clamp01((l - b + 2) / 5) : 0);
  }
  return k * k * (3 - 2 * k);
}
const draftLines = DRAFT.map(() => Array.from({ length: DRAFT_SEG }, () => {
  const el = document.createElementNS(NS, "polyline");
  $("draft").appendChild(el);
  return el;
}));
function offsetPoints(a, b, off) {
  const pts = [];
  for (let i = Math.floor(a / STEP); i <= Math.ceil(b / STEP) && i < samples.length; i++) {
    const q = samples[i];
    pts.push(`${(q.x + q.nx * off).toFixed(3)},${(q.y + q.ny * off).toFixed(3)}`);
  }
  return pts.join(" ");
}

const CENTER = { x: 960, y: 540 };
const BIG = 300 / 64, SMALL = 152 / 64;
let layout;
function measure() {
  const text = $("wordText");
  const fontSize = 91;
  text.setAttribute("font-size", fontSize);
  const c = document.createElement("canvas").getContext("2d");
  c.font = `600 ${fontSize}px Geist`;
  const cap = c.measureText("H").actualBoundingBoxAscent;
  const scale = (64 / 2) / cap;
  const fs = fontSize * (SMALL * scale);
  text.setAttribute("font-size", fs);
  const textW = text.getComputedTextLength();
  const box = 64 * SMALL, gap = box / 3;
  const total = box + gap + textW;
  const left = CENTER.x - total / 2;
  layout = {
    markEnd: { x: left + box / 2, y: CENTER.y },
    textX: left + box + gap,
    baseline: CENTER.y + (cap * SMALL * scale) / 2,
    textW,
  };
  text.setAttribute("x", layout.textX);
  text.setAttribute("y", layout.baseline);
}

function setMark(x, y, k) {
  $("mark").setAttribute("transform", `translate(${x} ${y}) scale(${k}) translate(-32 -32)`);
}
function ring(el, t, start, dur, grow, color, width) {
  const k = span(t, start, start + dur);
  const e = standard(k);
  el.setAttribute("r", 5.5 + grow * e);
  el.setAttribute("stroke", color);
  el.setAttribute("stroke-width", width * (1 - e * .7));
  el.setAttribute("opacity", k <= 0 || k >= 1 ? 0 : (1 - e) * .75);
}
function dot(el, halo, t, popAt, cx, cy, extraScale, haloBoost, glow) {
  const k = bounce(t - popAt, { stiffness: 320, damping: 15 });
  const s = Math.max(0, k) * extraScale;
  const tf = `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`;
  el.setAttribute("transform", tf);
  el.setAttribute("fill", glow);
  halo.setAttribute("transform", `translate(${cx} ${cy}) scale(${s * (1.25 + haloBoost * .9)}) translate(${-cx} ${-cy})`);
  halo.setAttribute("fill", glow);
  halo.setAttribute("opacity", (0.35 + haloBoost * .65) * clamp01(k));
}

const T = {
  gridIn: [0, .7],
  popA: .14, popB: .3,
  launch: .66,
  depart: .70, arrive: 1.56,
  tau: .17,
  bloom: [1.56, 2.66],
  ack: [1.66, 2.04],
  lockup: [2.02, 2.92],
  wipe: [2.24, 3.08],
  exit: [3.96, 4.36],
};
function cometAt(t) {
  return LE * travel(span(t, T.depart, T.arrive));
}

const glow = "hsl(214 95% 72%)";
const ink = "hsl(214 25% 96%)";
const hot = "hsl(214 100% 88%)";

function render(t) {
  grid.style.opacity = standard(span(t, ...T.gridIn)) * (1 - .65 * standard(span(t, ...T.lockup)));
  grid.style.transform = `translate3d(${-t * 6}px, ${t * 3}px, 0)`;
  ambient.style.opacity = standard(span(t, ...T.bloom));

  const m = spring(span(t, ...T.lockup));
  const lift = 1 - standard(span(t, 0, 1.4));
  const markX = lerp(CENTER.x, layout.markEnd.x, m);
  setMark(markX, lerp(CENTER.y, layout.markEnd.y, m) + lift * 10, lerp(BIG, SMALL, m) * (1 - lift * .03));

  const d = cometAt(t), tail = cometAt(t - T.tau);
  const moving = t >= T.depart && t < T.arrive + T.tau + .05;

  const drawn = clamp01((d - S_START) / LS) * LS;
  S.setAttribute("stroke", ink);
  S.setAttribute("stroke-dasharray", `${drawn} ${LS + 20}`);
  S.setAttribute("opacity", drawn > 0.01 ? 1 : 0);

  for (let i = 0; i < TRAIL_N; i++) {
    const f = i / (TRAIL_N - 1);
    const from = lerp(d, tail, f);
    const len = Math.max(0, d - from);
    for (const [p, w, o, c] of [[trailGlow[i], 10 * (1 - f) + 2, .5, glow], [trailCore[i], 6.5 * (1 - f * .9), .22, hot]]) {
      p.setAttribute("stroke", c);
      p.setAttribute("stroke-width", w);
      p.setAttribute("stroke-dasharray", `${len} ${LE * 2}`);
      p.setAttribute("stroke-dashoffset", -from);
      p.setAttribute("opacity", moving && len > .05 ? o : 0);
    }
  }

  const dTail = cometAt(t - T.tau * 1.25), dLead = Math.max(dTail, d - 4);
  DRAFT.forEach((off, j) => {
    const far = Math.abs(off) > 10;
    for (let i = 0; i < DRAFT_SEG; i++) {
      const el = draftLines[j][i];
      const f0 = i / DRAFT_SEG, f1 = (i + 1) / DRAFT_SEG;
      const a = lerp(dLead, dTail, f1), b = lerp(dLead, dTail, f0);
      const vis = moving && b - a > .05;
      el.setAttribute("points", vis ? offsetPoints(a, b, off) : "");
      el.setAttribute("stroke", glow);
      el.setAttribute("stroke-width", far ? .45 : .7);
      el.setAttribute("opacity", vis ? (1 - f0) * (far ? .4 : .65) * straightness((a + b) / 2) : 0);
    }
  });

  const head = E.getPointAtLength(d);
  const headVisible = t >= T.depart && t < T.arrive;
  const headIn = standard(span(t, T.depart, T.depart + .12));
  for (const id of ["head", "headGlow"]) {
    $(id).setAttribute("cx", head.x);
    $(id).setAttribute("cy", head.y);
  }
  $("head").setAttribute("opacity", headVisible ? headIn : 0);
  $("headGlow").setAttribute("fill", glow);
  $("headGlow").setAttribute("opacity", headVisible ? headIn : 0);

  const recoil = t < T.launch ? 1 : 1 - .2 * Math.sin(Math.PI * span(t, T.launch, T.launch + .22));
  const flare = t < T.arrive ? 0 : Math.exp(-(t - T.arrive) * 6);
  const reply = t < T.ack[1] ? 0 : Math.exp(-(t - T.ack[1]) * 7);
  const charge = Math.sin(Math.PI * span(t, .42, T.launch + .06)) ** 2;
  const settle = 1 - standard(span(t, 2.6, 3.6));
  dot($("dotA"), $("haloA"), t, T.popA, 52, 14, recoil * (1 + .22 * reply), (t < .9 ? .6 : 0) * settle + reply * .8 + charge * .9 + .25 * settle, glow);
  dot($("dotB"), $("haloB"), t, T.popB, 12, 50, 1 + .38 * flare, (t < .9 ? .6 : 0) * settle + flare + .25 * settle, glow);
  ring($("ringA"), t, T.popA, .8, 9, glow, 1.4);
  ring($("ringB"), t, T.popB, .8, 9, glow, 1.4);
  ring($("ringB2"), t, T.arrive, .95, 18, glow, 2);
  ring($("ringA2"), t, T.ack[1], .85, 12, glow, 1.4);

  const ak = span(t, ...T.ack);
  const ad = LE * bezier(.4, 0, .2, 1)(ak);
  const seg = 16;
  for (const [id, o] of [["ackGlow", .9], ["ackCore", .55]]) {
    const el = $(id);
    el.setAttribute("stroke", glow);
    el.setAttribute("stroke-dasharray", `${seg} ${LE * 2}`);
    el.setAttribute("stroke-dashoffset", -(ad - seg));
    el.setAttribute("opacity", ak > 0 && ak < 1 ? o * Math.sin(Math.PI * ak) ** .4 : 0);
  }

  const w = standard(span(t, ...T.wipe));
  const edge = lerp(layout.textX - 60, layout.textX + layout.textW + 80, w);
  $("w0").setAttribute("offset", (edge - 70) / 1920);
  $("w1").setAttribute("offset", edge / 1920);
  $("word").setAttribute("transform", `translate(${markX - layout.markEnd.x + lerp(-24, 0, w)} 0)`);
  $("wordText").setAttribute("fill", ink);

  const x = standard(span(t, ...T.exit));
  $("lockup").setAttribute("opacity", 1 - x);
  $("lockup").setAttribute("transform", `translate(960 540) scale(${1 + x * .025}) translate(-960 -540)`);
}

window.SLIPSTREAM = { render, DURATION };
Promise.all([document.fonts.load("600 91px Geist"), document.fonts.load("400 91px Geist")]).then(() => {
  measure();
  render(0);
  window.READY = true;
  if (!params.has("still")) {
    let t0;
    const loop = now => {
      t0 ??= now;
      const t = (now - t0) / 1000;
      render(Math.min(t, DURATION));
      if (t < DURATION + 1) requestAnimationFrame(loop);
      else { t0 = undefined; requestAnimationFrame(loop); }
    };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) render(3.6);
    else requestAnimationFrame(loop);
  }
});
</script>
</body>
</html>
