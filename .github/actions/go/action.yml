name: go
description: Install go.mod's Go and restore the Go caches saved by pushes to main
inputs:
  cache:
    description: Cache key prefix; the key adds the commit
    required: true
outputs:
  cache-key:
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    # Any Go in the runner's tool cache switches to go.mod's version, which
    # it downloads into GOMODCACHE, so the Go cache restores the toolchain
    # faster than setup-go installs go.mod's version. The temp drive is the
    # fast one on Windows.
    - name: Install a Go to bootstrap go.mod's toolchain
      uses: actions/setup-go@v7
      with:
        go-version: ">=1.21"
        cache: false
    - name: Point the Go toolchain and caches at the temp drive
      shell: bash
      run: |
        echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_ENV"
        echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
        echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
        echo "SLIPSTREAM_NATIVE_CACHE=$RUNNER_TEMP/slipstream-native" >> "$GITHUB_ENV"
        echo "GOLANGCI_LINT_CACHE=$RUNNER_TEMP/golangci-lint" >> "$GITHUB_ENV"
    # Go's caches are content-addressed, so an older cache is never wrong,
    # only less complete.
    - name: Restore the Go caches
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ runner.temp }}/go-build
          ${{ runner.temp }}/go-mod
        key: ${{ inputs.cache }}-${{ github.sha }}
        restore-keys: ${{ inputs.cache }}-
