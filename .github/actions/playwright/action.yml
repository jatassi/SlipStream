name: playwright
description: Install the Playwright browsers and their system packages, with the packages' .deb files restored from the cache pushes to main save
inputs:
  browsers:
    description: The browsers to install; empty installs every browser the target's Playwright projects run
    default: ""
  cache:
    description: Cache key prefix for the .deb files, one per set of browsers on one architecture
    required: true
  save:
    description: Whether a push to main saves the .deb files when they differ from the restored ones
    default: "true"
runs:
  using: composite
  steps:
    # The key names the .deb files it holds, so the newest entry under the
    # prefix is the closest to what apt needs now, and apt downloads only what
    # changed since.
    - name: Restore the browsers' system packages
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/playwright-debs
        key: ${{ inputs.cache }}-${{ github.sha }}
        restore-keys: ${{ inputs.cache }}-
    # The runner's first apt mirror can serve at under 100 kB/s, which apt
    # never treats as a failure. An attempt that runs out of time is retried
    # without that mirror. The timeout's signal doesn't reach apt-get under
    # sudo, which would keep apt's locks, so the retry stops apt-get first.
    - name: Install the Playwright browsers and their system packages
      id: install
      shell: bash
      working-directory: web
      env:
        BROWSERS: ${{ inputs.browsers }}
        CACHE: ${{ inputs.cache }}
        DEBS: ${{ runner.temp }}/playwright-debs
      run: |
        mkdir -p "$DEBS"
        find "$DEBS" -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +
        bun install --frozen-lockfile
        install() {
          if [ -z "$BROWSERS" ]; then
            timeout -k 10s "$1" bun run e2e:install --with-deps
          else
            timeout -k 10s "$1" bun x playwright install --with-deps $BROWSERS
          fi
        }
        status=0
        install 3m || status=$?
        if [ "$status" = 124 ]; then
          echo "::warning::The Playwright install ran out of time on the first apt mirror. Retrying without azure.archive.ubuntu.com."
          sudo pkill -x apt-get || true
          while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do sleep 1; done
          sudo dpkg --configure -a
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          status=0
          install 6m || status=$?
        fi
        if [ "$status" != 0 ]; then
          [ "$status" = 124 ] && echo "::error::The Playwright install ran out of time on every apt mirror."
          exit "$status"
        fi
        sudo apt-get autoclean -qq
        rm -f "$DEBS"/*.deb
        cp /var/cache/apt/archives/*.deb "$DEBS"
        echo "key=$CACHE-$(ls "$DEBS" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Save the browsers' system packages
      if: inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.install.outputs.key != steps.restore.outputs.cache-matched-key
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/playwright-debs
        key: ${{ steps.install.outputs.key }}
