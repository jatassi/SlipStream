name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new commit on a pull request makes the run for the old one moot.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # A draft pull request runs no checks until it's marked ready for review.
  # A feature's draft final PR still gets the train's checks on its head.
  plan:
    name: Plan
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - name: Scope the change against the base branch
        id: scope
        run: go run ./cmd/release scope -explain -base "origin/$BASE" -head HEAD
        env:
          BASE: ${{ github.base_ref }}
      # A pull request into main is the merge check; one into a feature
      # branch is a wave.
      - name: Plan the run
        id: plan
        run: go run ./cmd/release plan -kind "$KIND" -scope "$SCOPE" -package="$PACKAGE" -diagram="$DIAGRAM" -targets "$TARGETS" -timings "$RUNNER_TEMP/timings" -fetch-timings
        env:
          KIND: >-
            ${{ github.base_ref == 'main' && 'merge' || 'wave' }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          PACKAGE: ${{ steps.scope.outputs.package }}
          DIAGRAM: ${{ steps.scope.outputs.diagram }}
          TARGETS: ${{ github.base_ref != 'main' && 'linux-amd64' || '' }}
          GH_TOKEN: ${{ github.token }}
      - name: Check that shipped migrations are unchanged
        run: go run ./cmd/release migrations-frozen -base "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
      - name: Check that shipped protos are unchanged
        run: go run ./cmd/release proto-frozen -base "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}

  tests:
    name: Tests
    needs: plan
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/tests.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}

  # Outside the gate, so a quarantined test's failure fails no required check.
  quarantine:
    name: Quarantine
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/quarantine.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}

  # The ruleset requires this check by its name. A skipped required check
  # counts as passed, so the gate runs only to fail, when the plan or a lane
  # it planned didn't pass. Waiting for a runner held each passing run back
  # minutes.
  gate:
    name: All required checks passed
    needs: [plan, tests]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report each job's result
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
        env:
          NEEDS: ${{ toJSON(needs) }}
