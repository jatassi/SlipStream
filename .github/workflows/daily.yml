name: Daily checks

# The online conformance and link throughput tests run every day. The full
# matrix runs too when no daily check has passed it on main's tree, or the
# last one that did is 7 or more days old, and saves each target's Go cache
# for main. A failure opens or updates an issue, and so does a flaky test
# to quarantine or an expired quarantine row.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      kind: ${{ steps.daily.outputs.kind }}
      since: ${{ steps.daily.outputs.since }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        id: go
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - name: Choose whether to run the full matrix
        id: daily
        run: go run ./cmd/release daily
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Plan the run
        id: plan
        run: go run ./cmd/release plan -kind "$KIND" -timings "$RUNNER_TEMP/timings" -fetch-timings
        env:
          KIND: ${{ steps.daily.outputs.kind }}
          GH_TOKEN: ${{ github.token }}
      - name: Save Go cache
        uses: actions/cache/save@v6
        with:
          path: |
            ../../_temp/go-build
            ../../_temp/go-mod
          key: ${{ steps.go.outputs.cache-key }}
      - name: Delete older Go caches
        uses: ./.github/actions/prune-cache
        with:
          prefix: go-plan-

  tests:
    name: Tests
    needs: plan
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/tests.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      record-timings: ${{ needs.plan.outputs.kind == 'schedule' }}
      save-caches: true
    secrets:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
      SUBSOURCE_API_KEY: ${{ secrets.SUBSOURCE_API_KEY }}

  # Outside the gate, so a quarantined test's failure fails no daily check.
  quarantine:
    name: Quarantine
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/quarantine.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}

  # One link stream measured between two network namespaces, per spec S07's
  # yamux measurement. The table lands in the step summary and the log, and
  # a failure opens or comments on its own issue.
  link-measure:
    name: Link throughput test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/go
        with:
          cache: go-link-measure
      # netem ships in the extra modules on some runner kernels.
      - name: Load the netem kernel module
        run: sudo modprobe sch_netem || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; }
      - name: Run the link throughput test
        run: |
          go test -c -o "$RUNNER_TEMP/mux.test" ./internal/link/internal/mux
          sudo env TEST_LINK_MEASURE=1 GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            "$RUNNER_TEMP/mux.test" -test.run '^TestMeasureStream$' -test.v -test.timeout 30m
      - name: Open or comment on the failure issue
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          title="link-measure failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The daily yamux measurement failed again: $url"
          else
            gh issue create --title "$title" --body "The daily yamux measurement failed: $url"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # On a failure the issue names the failed jobs and the squash commits
  # since the last full-matrix run that passed, each of which is one
  # feature's merge. Online drift opens or updates one issue per service.
  # Every run also proposes quarantine rows for the tests labeled flaky
  # twice in 7 days, lists the quarantined tests that passed for 14, and
  # fails while a row of ci/quarantine.tsv has expired.
  issues:
    name: Report the failures and the quarantine
    needs: [plan, tests]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: ./.github/actions/go
        with:
          cache: go-plan
      # A daily check with no failed test uploaded no artifact, and the
      # quarantine issues still need the week's runs.
      - name: Download the failed tests
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: failures-*
          path: ${{ runner.temp }}/failures
      - name: Open or update the issues
        run: go run ./cmd/release daily-issues -failures "$RUNNER_TEMP/failures" -since "$SINCE"
        env:
          SINCE: ${{ needs.plan.outputs.since }}
          GH_TOKEN: ${{ github.token }}
