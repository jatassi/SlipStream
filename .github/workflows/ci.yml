name: ci

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  schedule:
    - cron: "23 4 * * *"
  release:
    types: [published]

permissions:
  contents: read

# A new commit on a pull request makes the run for the old one moot. Every
# other run gets its own group, so no push waits on or cancels another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: go
        uses: ./.github/actions/go
        with:
          cache: go-plan
      # A push to a branch other than main is unmerged work, so it is planned
      # like a pull request into main.
      - id: scope
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: go run ./cmd/release scope -explain -base "origin/$BASE" -head HEAD
        env:
          BASE: ${{ github.base_ref || 'main' }}
      - id: plan
        run: go run ./cmd/release plan -event "$EVENT" -scope "${SCOPE:-native}"
        env:
          EVENT: ${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'release' && 'release' || github.ref == 'refs/heads/main' && 'push' || 'pr' }}
          SCOPE: ${{ steps.scope.outputs.scope }}
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: go run ./cmd/release migrations-frozen -base "$BASE"
        env:
          BASE: ${{ github.ref == 'refs/heads/main' && 'HEAD^1' || format('origin/{0}', github.base_ref || 'main') }}
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: go run ./cmd/release proto-frozen -base "$BASE"
        env:
          BASE: ${{ github.ref == 'refs/heads/main' && 'HEAD^1' || format('origin/{0}', github.base_ref || 'main') }}
      - if: github.event_name == 'push' && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
            ${{ runner.temp }}/golangci-lint
          key: ${{ steps.go.outputs.cache-key }}

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      - id: go
        uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      # Vitest and Playwright run under Node through bun run.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ matrix.target }}-${{ hashFiles('web/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      - run: go run ./cmd/release build
      # The end-to-end tier's Nodes bind 127.0.0.2 and up, which macOS
      # answers only once aliased. The second run must change nothing.
      - if: matrix.goos == 'darwin'
        run: |
          eval "$(go run ./cmd/release deps env)"
          go build -o "$RUNNER_TEMP/fakeworld" ./cmd/fakeworld
          sudo "$RUNNER_TEMP/fakeworld" setup-loopback
          second="$(sudo "$RUNNER_TEMP/fakeworld" setup-loopback)"
          echo "$second"
          test "$second" = "loopback aliases already set up"
      # The browsers' system libraries are not in the cache, so Linux
      # installs them on every run.
      - if: runner.os == 'Linux'
        working-directory: web
        run: bun run e2e:install --with-deps
      - run: go run ./cmd/release test
        env:
          TEST_SLIPSTREAM_BINARY: ${{ github.workspace }}/dist/slipstream${{ matrix.goos == 'windows' && '.exe' || '' }}
          TEST_SLIPSTREAM_E2E_BINARY: ${{ github.workspace }}/dist/slipstream-e2e${{ matrix.goos == 'windows' && '.exe' || '' }}
          TEST_FAKEWORLD_RUNS: ${{ runner.temp }}/fakeworld-runs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fakeworld-runs-${{ matrix.target }}
          path: ${{ runner.temp }}/fakeworld-runs
          if-no-files-found: ignore
      # Lint runs on every target so gofmt, line endings and the cgo type
      # check are proven on each OS, and runs even when a test fails.
      - if: ${{ !cancelled() }}
        run: go run ./cmd/release lint
      # Pushes save the cache that pull requests restore. Pull requests do not
      # save, because a pull request's cache is visible to that pull request
      # alone.
      - if: ${{ !cancelled() && github.event_name == 'push' && steps.go.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
            ${{ runner.temp }}/golangci-lint
          key: ${{ steps.go.outputs.cache-key }}

  # One link stream measured between two network namespaces, per spec S07's
  # yamux measurement: nightly, and on pull requests that touch the link.
  # It is not a required check. The table lands in the step summary and the
  # log; a nightly failure opens or comments on an issue.
  link-measure:
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        run: |
          if [ "$EVENT" = schedule ] || ! git diff --quiet "origin/$BASE...HEAD" -- internal/link/; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
      - if: steps.scope.outputs.measure == 'true'
        uses: ./.github/actions/go
        with:
          cache: go-link-measure
      # netem ships in the extra modules on some runner kernels.
      - if: steps.scope.outputs.measure == 'true'
        run: sudo modprobe sch_netem || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; }
      - if: steps.scope.outputs.measure == 'true'
        run: |
          go test -c -o "$RUNNER_TEMP/mux.test" ./internal/link/internal/mux
          sudo env TEST_LINK_MEASURE=1 GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            "$RUNNER_TEMP/mux.test" -test.run '^TestMeasureStream$' -test.v -test.timeout 30m
      - if: failure() && github.event_name == 'schedule'
        run: |
          title="link-measure failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The nightly yamux measurement failed again: $url"
          else
            gh issue create --title "$title" --body "The nightly yamux measurement failed: $url"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  native-gate:
    if: always()
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      # A docs-only change plans no builds, so the build job is skipped and
      # this gate still reports.
      - run: |
          test "$PLAN" = success
          if [ "$PLANNED" = true ]; then test "$BUILD" = success; else test "$BUILD" = skipped; fi
        env:
          PLAN: ${{ needs.plan.result }}
          PLANNED: ${{ needs.plan.outputs.build }}
          BUILD: ${{ needs.build.result }}
