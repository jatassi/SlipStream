name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated targets to run, such as linux-amd64,windows-amd64; empty runs every target
        type: string
        default: ""
      tier:
        description: Lanes to run
        type: choice
        options: [all, go, e2e, browser, component, lint]
        default: all
      filter:
        description: Run only the tests that match, as go test -run and playwright --grep
        type: string
        default: ""
      repeat:
        description: Run each test this many times, as go test -count and playwright --repeat-each
        type: number
        default: 1
      update-shapes:
        description: Rewrite each conformance suite's shape.json from the real services and upload them
        type: boolean
        default: false

permissions:
  contents: read

# A new commit on a pull request makes the run for the old one moot, as a
# new dispatch on a ref does the last one. Every other run gets its own
# group, so no push waits on or cancels another.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.event_name, github.ref) || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan CI lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      planned: ${{ steps.plan.outputs.planned }}
      target: ${{ steps.plan.outputs.target }}
      lint: ${{ steps.plan.outputs.lint }}
      lint-repo: ${{ steps.plan.outputs.lint-repo }}
      go: ${{ steps.plan.outputs.go }}
      component: ${{ steps.plan.outputs.component }}
      diagram: ${{ steps.plan.outputs.diagram }}
      package: ${{ steps.plan.outputs.package }}
      online: ${{ steps.scope.outputs.online }}
      link: ${{ steps.scope.outputs.link }}
      timings: ${{ steps.timings.outputs.cache-matched-key && 'split-timings' || '' }}
      record-timings: >-
        ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' &&
          inputs.tier == 'all' && inputs.targets == '' && inputs.filter == '' && inputs.repeat == 1)) }}
      image: ${{ steps.tag.outputs.image }}
      image-tags: ${{ steps.tag.outputs.image-tags }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go and restore the Go caches
        id: go
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - name: Scope the change against the base branch
        id: scope
        if: github.event_name == 'pull_request'
        run: go run ./cmd/release scope -explain -base "origin/$BASE" -head HEAD
        env:
          BASE: ${{ github.base_ref }}
      - name: Read the release tag
        id: tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: go run ./cmd/release tag "$GITHUB_REF_NAME"
      # A pull request into another pull request's branch is stacked: it
      # runs linux-amd64 alone unless labelled ci: full.
      - name: Plan the lanes and matrices
        id: plan
        run: go run ./cmd/release plan -event "$EVENT" -scope "${SCOPE:-native}" -package="${PACKAGE:-false}" -diagram="${DIAGRAM:-false}" -targets "$TARGETS" -tier "$TIER"
        env:
          EVENT: >-
            ${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && 'dispatch' ||
              startsWith(github.ref, 'refs/tags/') && 'tag' || github.event_name == 'push' && 'push' ||
              github.base_ref != 'main' && !contains(github.event.pull_request.labels.*.name, 'ci: full') && 'stacked' || 'pr' }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          PACKAGE: ${{ steps.scope.outputs.package }}
          DIAGRAM: ${{ steps.scope.outputs.diagram }}
          TARGETS: ${{ inputs.targets }}
          TIER: ${{ inputs.tier || 'all' }}
      # Every go, e2e and browser shard splits its tier by the same timings,
      # so each downloads the set this restores. The artifact lasts the whole
      # run, and the cache entry can be evicted before a shard starts.
      - name: Restore the test timings to split by
        id: timings
        uses: actions/cache/restore@v6
        with:
          path: .timings
          key: go-timings-${{ github.sha }}
          restore-keys: go-timings-
          enableCrossOsArchive: true
      - name: Upload the test timings for the shards
        if: steps.timings.outputs.cache-matched-key != ''
        uses: actions/upload-artifact@v7
        with:
          name: split-timings
          path: .timings
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Check that shipped migrations are unchanged
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: go run ./cmd/release migrations-frozen -base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
      - name: Check that shipped protos are unchanged
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: go run ./cmd/release proto-frozen -base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
      - name: Save the plan job's Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: ${{ steps.go.outputs.cache-key }}
      - name: Delete the plan job's older Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/prune-cache
        with:
          prefix: go-plan-

  # GitHub starts a job only when every matrix leg of each job it needs has
  # ended, so each target's build and the lanes on its dist/ share one call and
  # its tests wait for no other target's build.
  target:
    name: ${{ matrix.target }}
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['target']
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.target) }}
    uses: ./.github/workflows/target.yml
    with:
      build: ${{ toJSON(matrix.build) }}
      e2e: ${{ toJSON(matrix.e2e) }}
      browser: ${{ toJSON(matrix.browser) }}
      package: ${{ needs.plan.outputs.package }}
      timings: ${{ needs.plan.outputs.timings }}
      record-timings: ${{ needs.plan.outputs.record-timings }}
      filter: ${{ inputs.filter }}
      repeat: ${{ inputs.repeat || '1' }}
    secrets:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

  # Lint runs once per OS so gofmt, line endings and the cgo type check
  # are proven on each.
  lint:
    name: Lint Go (${{ matrix.target }})
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['lint']
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.lint) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Select Xcode
        if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Set up Go and restore the Go caches
        uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - name: Restore the golangci-lint cache
        id: lint-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: lint-${{ matrix.target }}-${{ github.sha }}
          restore-keys: lint-${{ matrix.target }}-
      - name: Restore the native layers cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      - name: Lint Go for this target
        run: go run ./cmd/release lint -part target
      - name: Save the golangci-lint cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}
      - name: Delete the older golangci-lint caches
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/prune-cache
        with:
          prefix: lint-${{ matrix.target }}-

  lint-repo:
    name: Lint repo-wide checks
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['lint-repo']
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.lint-repo) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Go and restore the Go caches
        uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: Cache Bun's install cache
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Run the repo-wide lint checks
        run: go run ./cmd/release lint -part repo
      - name: Restore the native layers cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      - name: Check each port's provenance against Prowlarr's history
        run: |
          scripts/native-deps fetch > /dev/null
          eval "$(scripts/native-deps env)"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/Prowlarr/Prowlarr "$RUNNER_TEMP/prowlarr"
          go run ./cmd/prowlarr-sync check --prowlarr "$RUNNER_TEMP/prowlarr"

  go:
    name: Go tests (${{ matrix.target }}${{ matrix.shards > 1 && format(', shard {0} of {1}', matrix.shard, matrix.shards) || '' }})
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['go']
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.go) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      FILTER: ${{ inputs.filter }}
      REPEAT: ${{ inputs.repeat || 1 }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Select Xcode
        if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Set up Go and restore the Go caches
        uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - name: Restore the native layers cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      # The worlds encode each catalog Scenario's release payloads and
      # library files once per machine, into the user cache dir.
      - name: Restore the fixture cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\slipstream-fixtures' || runner.os == 'macOS' && '~/Library/Caches/slipstream-fixtures' || '~/.cache/slipstream-fixtures' }}
          key: fixtures-${{ matrix.target }}-${{ hashFiles('native/lock.json', 'fakes/internal/mediafix/recipe.go', 'fakes/internal/releases/releases.go', 'fakes/scenario/catalog/*.yaml') }}
      - name: Download the test timings the plan job restored
        if: needs.plan.outputs.timings != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.timings }}
          path: .timings
      # Windows runners keep TEMP on C:, which is far slower than D:, and the
      # tests' temp dirs live under TEMP.
      - name: Point TEMP at the fast drive
        if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # TestTheListenerFollowsTheDefaultRoute moves a listener to 127.0.0.2,
      # which macOS answers only once aliased.
      - name: Alias a second loopback address
        if: matrix.goos == 'darwin'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      # With one address besides loopback a host announces once whatever the
      # engine does, so TestEachTorrentAnnouncesStartedOnce needs a second.
      - name: Add a second IPv4 address to the default interface
        if: matrix.goos == 'linux'
        run: sudo ip addr add 198.51.100.7/32 dev "$(ip -4 route show default | awk '{print $5; exit}')"
      - name: Run Go test shard
        run: go run ./cmd/release test -tier go -shard "$SHARD" -filter "$FILTER" -repeat "$REPEAT" -timings .timings -record "$RUNNER_TEMP/timings/${{ matrix.target }}-go-${{ matrix.shard }}.json"
      - name: Upload this shard's test timings
        if: ${{ !cancelled() && needs.plan.outputs.record-timings == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.target }}-go-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          retention-days: 1
          if-no-files-found: ignore

  component:
    name: Component tests (Vitest)
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['component']
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.component) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The tier builds no Go but the release tool, which plan's cache holds.
      - name: Set up Go and restore the Go caches
        uses: ./.github/actions/go
        with:
          cache: go-plan
      # Vitest runs under Node through bun run.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: Cache Bun's install cache
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Keep Playwright browsers in the runner temp dir
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      # Chromium alone, so its own key: the browser jobs' cache holds every
      # engine their target runs.
      - name: Cache the Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-chromium-${{ matrix.target }}-${{ hashFiles('web/bun.lock') }}
      - name: Install Chromium and its system libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/playwright
        with:
          browsers: chromium
          cache: playwright-debs-chromium-${{ matrix.target }}
      - name: Run the component tests
        run: go run ./cmd/release test -tier component

  # A pull request runs the Diagram check only when its scope touches what
  # the check reads; every other event runs it.
  diagram:
    name: Diagram check (harness, anatomy audit, frame budget)
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['diagram']
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.diagram) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The tier builds no Go but the release tool, which plan's cache holds.
      - name: Set up Go and restore the Go caches
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: Cache Bun's install cache
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Keep Playwright browsers in the runner temp dir
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: Cache the Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-chromium-${{ matrix.target }}-${{ hashFiles('web/bun.lock') }}
      - name: Install Chromium and its system libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/playwright
        with:
          browsers: chromium
          cache: playwright-debs-chromium-${{ matrix.target }}
          save: false
      - name: Run the Diagram check
        run: go run ./cmd/release test -tier diagram
      - name: Upload the Diagram close-ups
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagram-close-ups
          path: .verify/diagram
          if-no-files-found: ignore

  # A push to main runs no tests, so main's nightly run records the timings
  # the next runs' go, e2e and browser shards split their tiers by.
  timings:
    name: Save test timings
    needs: [plan, go, target]
    if: ${{ !cancelled() && needs.plan.outputs.record-timings == 'true' && needs.go.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download every shard's test timings
        uses: actions/download-artifact@v8
        with:
          pattern: timings-*
          merge-multiple: true
          path: .timings
      - name: Save the merged test timings
        uses: actions/cache/save@v6
        with:
          path: .timings
          key: go-timings-${{ github.sha }}
          enableCrossOsArchive: true

  # One link stream measured between two network namespaces, per spec S07's
  # yamux measurement: nightly, and on pull requests that touch the link.
  # It is not a required check. The table lands in the step summary and the
  # log; a nightly failure opens or comments on an issue.
  link-measure:
    name: Measure link throughput
    needs: plan
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.plan.outputs.link == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Go and restore the Go caches
        uses: ./.github/actions/go
        with:
          cache: go-link-measure
      # netem ships in the extra modules on some runner kernels.
      - name: Load the netem kernel module
        run: sudo modprobe sch_netem || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; }
      - name: Measure link stream throughput
        run: |
          go test -c -o "$RUNNER_TEMP/mux.test" ./internal/link/internal/mux
          sudo env TEST_LINK_MEASURE=1 GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            "$RUNNER_TEMP/mux.test" -test.run '^TestMeasureStream$' -test.v -test.timeout 30m
      - name: Open or comment on the failure issue
        if: failure() && github.event_name == 'schedule'
        run: |
          title="link-measure failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The nightly yamux measurement failed again: $url"
          else
            gh issue create --title "$title" --body "The nightly yamux measurement failed: $url"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The conformance suites against the real TMDB, TVDB, OMDb, TMDB's image
  # host and MusicBrainz (spec #135, Online runs): nightly, by hand, on a release
  # tag, and on pull requests whose scope touches a fake, client or suite
  # the job checks. It is not a required check. A fork's pull request gets
  # no secrets, so it never runs the job. A run without the TMDB key fails
  # rather than skips; the OMDb and TVDB suites skip without their key.
  online:
    name: Online conformance suites
    needs: plan
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.online == 'true')
      ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Go and restore the Go caches
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - name: Run the online conformance suites
        run: go run ./cmd/release test -tier online ${{ inputs.update-shapes && '-update' || '' }}
        env:
          TEST_ONLINE_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          TEST_ONLINE_TVDB_KEY: ${{ secrets.TVDB_API_KEY }}
          TEST_ONLINE_OMDB_KEY: ${{ secrets.OMDB_API_KEY }}
      - name: Upload the updated shape.json files
        if: inputs.update-shapes
        uses: actions/upload-artifact@v7
        with:
          name: shapes
          path: conformance/*/shape.json

  # The required check: every lane the plan runs passes, and every lane it
  # leaves out is skipped.
  # A skipped required check counts as passed, so the gate skips when every
  # lane ended as planned and takes a runner only to fail and say which
  # lane didn't. Waiting for a runner held each passing run back minutes.
  gate:
    name: All required checks passed
    if: ${{ always() && (needs.plan.result != 'success' || needs.target.result != (fromJSON(needs.plan.outputs.planned)['target'] && 'success' || 'skipped') || needs.lint.result != (fromJSON(needs.plan.outputs.planned)['lint'] && 'success' || 'skipped') || needs.lint-repo.result != (fromJSON(needs.plan.outputs.planned)['lint-repo'] && 'success' || 'skipped') || needs.go.result != (fromJSON(needs.plan.outputs.planned)['go'] && 'success' || 'skipped') || needs.component.result != (fromJSON(needs.plan.outputs.planned)['component'] && 'success' || 'skipped') || needs.diagram.result != (fromJSON(needs.plan.outputs.planned)['diagram'] && 'success' || 'skipped')) }}
    needs: [plan, target, lint, lint-repo, go, component, diagram]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every planned lane passed and the rest skipped
        run: |
          test "$PLAN" = success
          status=0
          for lane in $(jq -r 'keys[] | select(. != "plan")' <<< "$NEEDS"); do
            want=skipped
            if jq -e --arg lane "$lane" '.[$lane]' <<< "$PLANNED" > /dev/null; then want=success; fi
            result="$(jq -r --arg lane "$lane" '.[$lane].result' <<< "$NEEDS")"
            echo "$lane: $result, want $want"
            if [ "$result" != "$want" ]; then status=1; fi
          done
          exit "$status"
        env:
          PLAN: ${{ needs.plan.result }}
          PLANNED: ${{ needs.plan.outputs.planned }}
          NEEDS: ${{ toJSON(needs) }}

  image:
    name: Build Docker image (${{ matrix.target }})
    needs: [plan, target]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-24.04, platform: linux/amd64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the Docker context
        uses: actions/download-artifact@v8
        with:
          name: docker-context-${{ matrix.target }}
          path: ${{ runner.temp }}
      - name: Unpack the Docker context
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/docker-context.tar"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/docker
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the image digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - name: Upload the image digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  docker-manifest:
    name: Publish the multi-arch Docker manifest
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create and inspect the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          for t in $TAGS; do tags+=(-t "$t"); done
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          for t in $TAGS; do docker buildx imagetools inspect "$t"; done
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          TAGS: ${{ needs.plan.outputs.image-tags }}

  sign-windows:
    name: Sign the Windows packages
    needs: target
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_PROJECT_SLUG != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the Windows packages
        uses: actions/download-artifact@v8
        with:
          name: packages-windows-amd64
          path: out
      - name: Upload the signing request
        id: request
        uses: actions/upload-artifact@v7
        with:
          name: signpath-request
          path: out/signpath
          if-no-files-found: error
      - name: Sign through SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.request.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload the signed Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows
          path: signed
          if-no-files-found: error

  # A release publishes only from a run whose every lane passed.
  publish:
    name: Publish the GitHub release
    needs: [plan, target, gate, docker-manifest, sign-windows]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
        needs.target.result == 'success' && needs.gate.result == 'success' && needs.docker-manifest.result == 'success' &&
        (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Go and restore the Go caches
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - name: Download every target's packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/packages
      - name: Download the signed Windows packages
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: signed-windows
          path: ${{ runner.temp }}/signed
      - name: Write the release notes
        run: go run ./cmd/release tag -notes "$RUNNER_TEMP/notes.md" "$GITHUB_REF_NAME"
      - name: Create, upload and publish the release
        run: |
          assets=()
          for manifest in "$RUNNER_TEMP"/packages/*/packages.json; do
            dir="$(dirname "$manifest")"
            while IFS= read -r asset; do
              signed="$RUNNER_TEMP/signed/$(basename "$asset")"
              if [ -f "$signed" ]; then assets+=("$signed"); else assets+=("$dir/$asset"); fi
            done < <(jq -r '.assets[]' "$manifest")
          done
          flags=(--draft --verify-tag --title "SlipStream $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          # Updates and rollback (#182) uploads the signed manifest and its signature here, before the release goes public.
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
