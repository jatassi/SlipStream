name: ci

on:
  pull_request:
  push:
    branches: [main, "feature/**", "claude/**"]
  schedule:
    - cron: "23 4 * * *"
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # A push to a branch other than main is unmerged work, so it is planned
      # like a pull request into main.
      - id: touch
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: go run ./cmd/release touches-native -explain -base "origin/$BASE" -head HEAD
        env:
          BASE: ${{ github.base_ref || 'main' }}
      - id: plan
        run: go run ./cmd/release plan -event "$EVENT" -native="${NATIVE:-false}"
        env:
          EVENT: ${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'release' && 'release' || github.ref == 'refs/heads/main' && 'push' || 'pr' }}
          NATIVE: ${{ steps.touch.outputs.native }}

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - run: go run ./cmd/release lint

  build:
    needs: plan
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      - run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: go-${{ matrix.target }}-${{ hashFiles('go.mod') }}-${{ github.sha }}
          restore-keys: go-${{ matrix.target }}-${{ hashFiles('go.mod') }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/slipstream-native
            ~/Library/Caches/slipstream-native
            ~/AppData/Local/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      - run: scripts/native-deps fetch
      - run: go run ./cmd/release build
      - name: imports and link trace (temporary)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/imports.go" <<'GO'
            package main

            import (
            	"debug/macho"
            	"debug/pe"
            	"fmt"
            	"os"
            	"sort"
            	"strings"
            )

            func main() {
            	path := os.Args[1]
            	if f, err := pe.Open(path); err == nil {
            		syms, _ := f.ImportedSymbols()
            		seen := map[string]bool{}
            		for _, s := range syms {
            			seen[strings.ToLower(s[strings.LastIndex(s, ":")+1:])] = true
            		}
            		var dlls []string
            		for d := range seen {
            			dlls = append(dlls, d)
            		}
            		sort.Strings(dlls)
            		fmt.Println("IMPORTS", strings.Join(dlls, " "))
            		return
            	}
            	f, err := macho.Open(path)
            	if err != nil {
            		panic(err)
            	}
            	libs, _ := f.ImportedLibraries()
            	fmt.Println("IMPORTS", strings.Join(libs, " "))
            	for _, l := range f.Loads {
            		raw := l.Raw()
            		if cmd := f.ByteOrder.Uint32(raw); cmd == 0x32 {
            			v := f.ByteOrder.Uint32(raw[12:])
            			fmt.Printf("MINOS %d.%d\n", v>>16, (v>>8)&0xff)
            		}
            	}
            }
          GO
          bin=$(ls "$GITHUB_WORKSPACE"/dist/slipstream*)
          (cd "$RUNNER_TEMP" && go run imports.go "$bin")
          if [ "$RUNNER_OS" = Windows ]; then trace=-Wl,--verbose; else trace=-Wl,-t; fi
          if [ "$RUNNER_OS" = macOS ] && [ "$GOARCH" = amd64 ]; then
            env -u GOARCH go build -o "$RUNNER_TEMP/release-native" ./cmd/release
            file "$RUNNER_TEMP/release-native"
            start=$(date +%s); go run ./cmd/release build >/dev/null 2>&1; echo "TIMING go run (translated tool): $(( $(date +%s) - start ))s"
            start=$(date +%s); "$RUNNER_TEMP/release-native" build >/dev/null 2>&1; echo "TIMING native tool: $(( $(date +%s) - start ))s"
          fi
          eval "$(scripts/native-deps env)"
          go build -x -tags release -o "$RUNNER_TEMP/trace-bin" -ldflags="-extldflags=$trace" ./cmd/slipstream > "$RUNNER_TEMP/trace.txt" 2>&1 || echo "BUILD FAILED"
          grep -oiE '[^ /\\"]+\.(a|tbd|dylib|o|obj)\b' "$RUNNER_TEMP/trace.txt" | sort | uniq -c | sort -rn | head -80
          grep -iE 'winpthread|unwind|libc\+\+|clang_rt|builtins|error' "$RUNNER_TEMP/trace.txt" | grep -v '^TERM\|^packagefile\|^modinfo\|-o \$WORK' | head -60
      - run: eval "$(scripts/native-deps env)" && go test -race -shuffle=on ./...

  native-gate:
    if: always()
    needs: [plan, lint, build]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for result in "$PLAN" "$LINT" "$BUILD"; do
            test "$result" = success
          done
        env:
          PLAN: ${{ needs.plan.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
