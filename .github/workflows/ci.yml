name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated targets to run, such as linux-amd64,windows-amd64; empty runs every target
        type: string
        default: ""
      tier:
        description: Lanes to run
        type: choice
        options: [all, go, e2e, browser, component, lint]
        default: all
      filter:
        description: Run only the tests that match, as go test -run and playwright --grep
        type: string
        default: ""
      repeat:
        description: Run each test this many times, as go test -count and playwright --repeat-each
        type: number
        default: 1
      update-shapes:
        description: Rewrite each conformance suite's shape.json from the real services and upload them
        type: boolean
        default: false

permissions:
  contents: read

# A new commit on a pull request makes the run for the old one moot, as a
# new dispatch on a ref does the last one. Every other run gets its own
# group, so no push waits on or cancels another.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.event_name, github.ref) || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      planned: ${{ steps.plan.outputs.planned }}
      build: ${{ steps.plan.outputs.build }}
      lint: ${{ steps.plan.outputs.lint }}
      lint-repo: ${{ steps.plan.outputs.lint-repo }}
      go: ${{ steps.plan.outputs.go }}
      e2e: ${{ steps.plan.outputs.e2e }}
      browser: ${{ steps.plan.outputs.browser }}
      component: ${{ steps.plan.outputs.component }}
      package: ${{ steps.plan.outputs.package }}
      online: ${{ steps.scope.outputs.online }}
      link: ${{ steps.scope.outputs.link }}
      timings: ${{ steps.timings.outputs.cache-matched-key }}
      image: ${{ steps.tag.outputs.image }}
      image-tags: ${{ steps.tag.outputs.image-tags }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: go
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - id: scope
        if: github.event_name == 'pull_request'
        run: go run ./cmd/release scope -explain -base "origin/$BASE" -head HEAD
        env:
          BASE: ${{ github.base_ref }}
      - id: tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: go run ./cmd/release tag "$GITHUB_REF_NAME"
      # A pull request into another pull request's branch is stacked: it
      # runs linux-amd64 alone unless labelled ci: full.
      - id: plan
        run: go run ./cmd/release plan -event "$EVENT" -scope "${SCOPE:-native}" -package="${PACKAGE:-false}" -targets "$TARGETS" -tier "$TIER"
        env:
          EVENT: >-
            ${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && 'dispatch' ||
              startsWith(github.ref, 'refs/tags/') && 'tag' || github.event_name == 'push' && 'push' ||
              github.base_ref != 'main' && !contains(github.event.pull_request.labels.*.name, 'ci: full') && 'stacked' || 'pr' }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          PACKAGE: ${{ steps.scope.outputs.package }}
          TARGETS: ${{ inputs.targets }}
          TIER: ${{ inputs.tier || 'all' }}
      # Every go and e2e shard splits its tier by the same timings, so each
      # restores the one entry this finds rather than the newest it sees.
      - id: timings
        uses: actions/cache/restore@v6
        with:
          path: .timings
          key: go-timings-${{ github.sha }}
          restore-keys: go-timings-
          lookup-only: true
          enableCrossOsArchive: true
      - if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: go run ./cmd/release migrations-frozen -base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
      - if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: go run ./cmd/release proto-frozen -base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: ${{ steps.go.outputs.cache-key }}

  build:
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['build']
    name: build (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      - id: go
        uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      # Bun installs faster on Windows than its cache restores there.
      - if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      # The e2e and browser jobs run fakeworld and the release tool from
      # dist/, so no job after this one builds anything.
      - run: |
          go run ./cmd/release build
          eval "$(go run ./cmd/release deps env)"
          go build -o dist/ ./cmd/fakeworld ./cmd/release
      # The build test checks that the binary embeds web/dist/index.html.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist
            web/dist/index.html
            !dist/slipstream-app*
          retention-days: 3
          if-no-files-found: error
      # The AppImage smoke mounts the image through FUSE.
      - if: needs.plan.outputs.package == 'true' && runner.os == 'Linux'
        run: sudo apt-get install -y fuse3
      - if: needs.plan.outputs.package == 'true'
        run: |
          args=(-o out)
          if [ "$TAG" = true ]; then args+=(-tag "$GITHUB_REF_NAME"); fi
          if [ "$TARGET" = linux-amd64 ]; then args+=(-source); fi
          if [ "$TAG" = true ] && [ "$TARGET" = windows-amd64 ] && [ -n "$SIGNPATH" ]; then args+=(-sign signpath); fi
          go run ./cmd/release package "${args[@]}"
        env:
          TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          TARGET: ${{ matrix.target }}
          SIGNPATH: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      - if: needs.plan.outputs.package == 'true'
        run: go run ./cmd/release smoke -from out -disposable
      - if: needs.plan.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: |
            out
            !out/docker
          if-no-files-found: error
      # The context links ffmpeg to where the image's package installs it,
      # a link an artifact cannot hold, so it goes up as a tar.
      - if: needs.plan.outputs.package == 'true' && runner.os == 'Linux'
        run: tar -C out -cf "$RUNNER_TEMP/docker-context.tar" docker
      - if: needs.plan.outputs.package == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: docker-context-${{ matrix.target }}
          path: ${{ runner.temp }}/docker-context.tar
          if-no-files-found: error
      # Only main saves, one cache per target, and every other ref restores
      # main's newest. A save per branch push or per job evicts main's
      # caches from the repo's 10 GB. So this job also compiles what the
      # lint, go and e2e jobs compile but do not save: the race builds of
      # the tests and the tools the lint jobs run.
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          eval "$(go run ./cmd/release deps env)"
          go test -race -count=1 -run '^$' ./...
          go tool -modfile=tools/go.mod golangci-lint version
          go tool -modfile=tools/go.mod buf --version
          go tool -modfile=tools/go.mod sqlc version
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: ${{ steps.go.outputs.cache-key }}

  # Lint runs on every target so gofmt, line endings and the cgo type check
  # are proven on each OS.
  lint:
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['lint']
    name: lint (${{ matrix.target }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.lint) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - id: lint-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: lint-${{ matrix.target }}-${{ github.sha }}
          restore-keys: lint-${{ matrix.target }}-
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      - run: go run ./cmd/release lint -part target
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  lint-repo:
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['lint-repo']
    name: lint-repo (${{ matrix.target }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.lint-repo) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: go run ./cmd/release lint -part repo

  go:
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['go']
    name: go (${{ matrix.target }}, ${{ matrix.shard }}/${{ matrix.shards }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.go) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      FILTER: ${{ inputs.filter }}
      REPEAT: ${{ inputs.repeat || 1 }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      - if: needs.plan.outputs.timings != ''
        uses: actions/cache/restore@v6
        with:
          path: .timings
          key: ${{ needs.plan.outputs.timings }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # Windows runners keep TEMP on C:, which is far slower than D:, and the
      # tests' temp dirs live under TEMP.
      - if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: go run ./cmd/release test -tier go -shard "$SHARD" -filter "$FILTER" -repeat "$REPEAT" -timings .timings -record "$RUNNER_TEMP/timings/${{ matrix.target }}-go-${{ matrix.shard }}.json"
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.target }}-go-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          retention-days: 1
          if-no-files-found: ignore

  e2e:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.planned)['e2e']
    name: e2e (${{ matrix.target }}, ${{ matrix.shard }}/${{ matrix.shards }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.e2e) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      FILTER: ${{ inputs.filter }}
      REPEAT: ${{ inputs.repeat || 1 }}
      EXE: ${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.target }}
      # An artifact does not keep the executable bit.
      - run: chmod +x dist/*
      - if: needs.plan.outputs.timings != ''
        uses: actions/cache/restore@v6
        with:
          path: .timings
          key: ${{ needs.plan.outputs.timings }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # The tier's Nodes bind 127.0.0.2 and up, which macOS answers only
      # once aliased. The second run must change nothing.
      - if: matrix.goos == 'darwin'
        run: |
          sudo dist/fakeworld setup-loopback
          second="$(sudo dist/fakeworld setup-loopback)"
          echo "$second"
          test "$second" = "loopback aliases already set up"
      - if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - id: test
        run: go run ./cmd/release test -tier e2e -shard "$SHARD" -filter "$FILTER" -repeat "$REPEAT" -timings .timings -record "$RUNNER_TEMP/timings/${{ matrix.target }}-e2e-${{ matrix.shard }}.json"
        env:
          TEST_SLIPSTREAM_BINARY: ${{ github.workspace }}/dist/slipstream${{ env.EXE }}
          TEST_SLIPSTREAM_E2E_BINARY: ${{ github.workspace }}/dist/slipstream-e2e${{ env.EXE }}
          TEST_FAKEWORLD_BINARY: ${{ github.workspace }}/dist/fakeworld${{ env.EXE }}
          TEST_FAKEWORLD_RUNS: ${{ runner.temp }}/fakeworld-runs
      # Each failed run dir is a replay bundle. The run's copies of the
      # binaries stay out of it; fakeworld replay --binary takes them from
      # the dist artifact.
      - if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fakeworld-runs-e2e-${{ matrix.target }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/fakeworld-runs
            !${{ runner.temp }}/fakeworld-runs/**/bin/**
          if-no-files-found: ignore
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.target }}-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          retention-days: 1
          if-no-files-found: ignore

  # The browser tier runs the build job's dist/ and needs no Go.
  browser:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.planned)['browser']
    name: browser (${{ matrix.target }}, ${{ matrix.shard }}/${{ matrix.shards }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser) }}
    runs-on: ${{ matrix.runner }}
    env:
      SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      FILTER: ${{ inputs.filter }}
      REPEAT: ${{ inputs.repeat || 1 }}
      EXE: ${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.target }}
      - run: chmod +x dist/*
      # Playwright runs under Node through bun run.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ matrix.target }}-${{ hashFiles('web/bun.lock') }}
      - if: matrix.goos == 'darwin'
        run: sudo dist/fakeworld setup-loopback
      # The browsers' system libraries are not in the cache, so Linux
      # installs them on every run.
      - if: runner.os == 'Linux'
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run e2e:install --with-deps
      - if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - id: test
        run: |
          "dist/release$EXE" test -tier browser -shard "$SHARD" -filter "$FILTER" -repeat "$REPEAT"
        env:
          TEST_SLIPSTREAM_BINARY: ${{ github.workspace }}/dist/slipstream${{ env.EXE }}
          TEST_FAKEWORLD_BINARY: ${{ github.workspace }}/dist/fakeworld${{ env.EXE }}
          TEST_FAKEWORLD_RUNS: ${{ runner.temp }}/fakeworld-runs
      - if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fakeworld-runs-browser-${{ matrix.target }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/fakeworld-runs
            !${{ runner.temp }}/fakeworld-runs/**/bin/**
          if-no-files-found: ignore

  component:
    needs: plan
    if: fromJSON(needs.plan.outputs.planned)['component']
    name: component (${{ matrix.target }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.component) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # The tier builds no Go but the release tool, which plan's cache holds.
      - uses: ./.github/actions/go
        with:
          cache: go-plan
      # Vitest runs under Node through bun run.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      # Chromium alone, so its own key: the browser jobs' cache holds every
      # engine their target runs.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-chromium-${{ matrix.target }}-${{ hashFiles('web/bun.lock') }}
      - if: runner.os == 'Linux'
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun x playwright install --with-deps chromium
      - run: go run ./cmd/release test -tier component

  # Main's go and e2e shards each upload the timings of the packages they
  # ran, and the next run's shards split their tiers by them.
  timings:
    needs: [go, e2e]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.go.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: timings-*
          merge-multiple: true
          path: .timings
      - uses: actions/cache/save@v6
        with:
          path: .timings
          key: go-timings-${{ github.sha }}
          enableCrossOsArchive: true

  # One link stream measured between two network namespaces, per spec S07's
  # yamux measurement: nightly, and on pull requests that touch the link.
  # It is not a required check. The table lands in the step summary and the
  # log; a nightly failure opens or comments on an issue.
  link-measure:
    needs: plan
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.plan.outputs.link == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/go
        with:
          cache: go-link-measure
      # netem ships in the extra modules on some runner kernels.
      - run: sudo modprobe sch_netem || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; }
      - run: |
          go test -c -o "$RUNNER_TEMP/mux.test" ./internal/link/internal/mux
          sudo env TEST_LINK_MEASURE=1 GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            "$RUNNER_TEMP/mux.test" -test.run '^TestMeasureStream$' -test.v -test.timeout 30m
      - if: failure() && github.event_name == 'schedule'
        run: |
          title="link-measure failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The nightly yamux measurement failed again: $url"
          else
            gh issue create --title "$title" --body "The nightly yamux measurement failed: $url"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The conformance suites against the real TMDB and MusicBrainz (spec #135,
  # Online runs): nightly, by hand, on a release tag, and on pull
  # requests whose scope touches a fake, client or suite the job checks. It
  # is not a required check. A fork's pull request gets no secrets, so it
  # never runs the job, and a run without the key fails rather than skips.
  online:
    needs: plan
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.online == 'true')
      ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/go
        with:
          cache: go-plan
      - run: go run ./cmd/release test -tier online ${{ inputs.update-shapes && '-update' || '' }}
        env:
          TEST_ONLINE_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
      - if: inputs.update-shapes
        uses: actions/upload-artifact@v7
        with:
          name: shapes
          path: conformance/*/shape.json

  # The required check: every lane the plan runs passes, and every lane it
  # leaves out is skipped.
  gate:
    if: always()
    needs: [plan, build, lint, lint-repo, go, e2e, browser, component]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          test "$PLAN" = success
          status=0
          for lane in $(jq -r 'keys[] | select(. != "plan")' <<< "$NEEDS"); do
            want=skipped
            if jq -e --arg lane "$lane" '.[$lane]' <<< "$PLANNED" > /dev/null; then want=success; fi
            result="$(jq -r --arg lane "$lane" '.[$lane].result' <<< "$NEEDS")"
            echo "$lane: $result, want $want"
            if [ "$result" != "$want" ]; then status=1; fi
          done
          exit "$status"
        env:
          PLAN: ${{ needs.plan.result }}
          PLANNED: ${{ needs.plan.outputs.planned }}
          NEEDS: ${{ toJSON(needs) }}

  image:
    needs: [plan, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-24.04, platform: linux/amd64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docker-context-${{ matrix.target }}
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/docker-context.tar"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/docker
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  docker-manifest:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          for t in $TAGS; do tags+=(-t "$t"); done
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          for t in $TAGS; do docker buildx imagetools inspect "$t"; done
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          TAGS: ${{ needs.plan.outputs.image-tags }}

  sign-windows:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_PROJECT_SLUG != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages-windows-amd64
          path: out
      - id: request
        uses: actions/upload-artifact@v7
        with:
          name: signpath-request
          path: out/signpath
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.request.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@v7
        with:
          name: signed-windows
          path: signed
          if-no-files-found: error

  # A release publishes only from a run whose every lane passed.
  publish:
    needs: [plan, build, gate, docker-manifest, sign-windows]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
        needs.build.result == 'success' && needs.gate.result == 'success' && needs.docker-manifest.result == 'success' &&
        (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/go
        with:
          cache: go-plan
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/packages
      - if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: signed-windows
          path: ${{ runner.temp }}/signed
      - run: go run ./cmd/release tag -notes "$RUNNER_TEMP/notes.md" "$GITHUB_REF_NAME"
      - run: |
          assets=()
          for manifest in "$RUNNER_TEMP"/packages/*/packages.json; do
            dir="$(dirname "$manifest")"
            while IFS= read -r asset; do
              signed="$RUNNER_TEMP/signed/$(basename "$asset")"
              if [ -f "$signed" ]; then assets+=("$signed"); else assets+=("$dir/$asset"); fi
            done < <(jq -r '.assets[]' "$manifest")
          done
          flags=(--draft --verify-tag --title "SlipStream $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          # Updates and rollback (#182) uploads the signed manifest and its signature here, before the release goes public.
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
