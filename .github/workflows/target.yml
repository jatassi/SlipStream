name: target

on:
  workflow_call:
    inputs:
      build:
        description: The build matrix for this target, as JSON
        type: string
        required: true
      e2e:
        description: The e2e matrix for this target, as JSON
        type: string
        required: true
      browser:
        description: The browser matrix for this target, as JSON
        type: string
        required: true
      package:
        description: Whether to build the release packages
        type: boolean
        required: true
      record-timings:
        description: Whether the e2e and browser shards upload the timings of what they ran
        type: boolean
        default: false
      filter:
        description: Run only the tests that match, as go test -run and playwright --grep
        type: string
      repeat:
        description: Run each test this many times, as go test -count and playwright --repeat-each
        type: string
        default: "1"
    secrets:
      TMDB_API_KEY:
      TVDB_API_KEY:
      OMDB_API_KEY:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.target }})
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: Restore the Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Restore native libraries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      # The e2e and browser jobs run fakeworld and the release tool from
      # dist/, so no job after this one builds anything.
      # Only a tag build carries SlipStream's metadata keys, and only into
      # cmd/slipstream; its e2e jobs still reach nothing but fakes. Until the
      # repository has the secrets, a release is keyless and status says so;
      # with some but not all three, the build refuses.
      - name: Build release binaries
        run: |
          args=()
          if [ "$TAG" = true ] && [ -n "$SLIPSTREAM_TMDB_KEY$SLIPSTREAM_TVDB_KEY$SLIPSTREAM_OMDB_KEY" ]; then args+=(-bundle-keys); fi
          go run ./cmd/release build "${args[@]}"
          eval "$(go run ./cmd/release deps env)"
          go build -o dist/ ./cmd/fakeworld ./cmd/release
        env:
          TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          SLIPSTREAM_TMDB_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && secrets.TMDB_API_KEY || '' }}
          SLIPSTREAM_TVDB_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && secrets.TVDB_API_KEY || '' }}
          SLIPSTREAM_OMDB_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && secrets.OMDB_API_KEY || '' }}
      # The build test checks that the binary embeds web/dist/index.html.
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist
            web/dist/index.html
            !dist/slipstream-app*
          retention-days: 3
          if-no-files-found: error
      # The AppImage smoke mounts the image through FUSE.
      - name: Install FUSE for the AppImage smoke test
        if: inputs.package && runner.os == 'Linux'
        run: sudo apt-get install -y fuse3
      - name: Build the release packages
        if: inputs.package
        run: |
          args=(-o out)
          if [ "$TAG" = true ]; then args+=(-tag "$GITHUB_REF_NAME"); fi
          if [ "$TARGET" = linux-amd64 ]; then args+=(-source); fi
          if [ "$TAG" = true ] && [ "$TARGET" = windows-amd64 ] && [ -n "$SIGNPATH" ]; then args+=(-sign signpath); fi
          go run ./cmd/release package "${args[@]}"
        env:
          TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          TARGET: ${{ matrix.target }}
          SIGNPATH: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      - name: Smoke-test the release packages
        if: inputs.package
        run: go run ./cmd/release smoke -from out -disposable
      - name: Upload the release packages
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: |
            out
            !out/docker
          if-no-files-found: error
      # The context links ffmpeg to where the image's package installs it,
      # a link an artifact cannot hold, so it goes up as a tar.
      - name: Pack the Docker context as a tar
        if: inputs.package && runner.os == 'Linux'
        run: tar -C out -cf "$RUNNER_TEMP/docker-context.tar" docker
      - name: Upload the Docker context
        if: inputs.package && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: docker-context-${{ matrix.target }}
          path: ${{ runner.temp }}/docker-context.tar
          if-no-files-found: error

  e2e:
    name: End-to-end tests (${{ matrix.target }}${{ matrix.shards > 1 && format(', shard {0} of {1}', matrix.shard, matrix.shards) || '' }})
    needs: build
    if: fromJSON(inputs.e2e).include[0]
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.e2e) }}
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
      SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      FILTER: ${{ inputs.filter }}
      REPEAT: ${{ inputs.repeat }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/go
        with:
          cache: go-${{ matrix.target }}
      - name: Restore native libraries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/slipstream-native
          key: native-${{ matrix.target }}-${{ hashFiles('native/lock.json') }}
      # The worlds encode each catalog Scenario's release payloads and
      # library files once per machine, into the user cache dir.
      - name: Restore fixtures
        uses: actions/cache@v6
        with:
          path: ${{ matrix.fixtures }}
          key: fixtures-${{ matrix.target }}-${{ hashFiles('native/lock.json', 'fakes/internal/mediafix/recipe.go', 'fakes/internal/releases/releases.go', 'fakes/scenario/catalog/*.yaml') }}
          restore-keys: fixtures-${{ matrix.target }}-
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.target }}
      # The plan names the newest run that recorded this lane on this target.
      - name: Download test timings
        if: matrix.timings
        uses: actions/download-artifact@v8
        with:
          pattern: timings-*
          merge-multiple: true
          run-id: ${{ matrix.timings }}
          github-token: ${{ github.token }}
          path: .timings
      # On CI the tier first restores the executable bits an artifact drops,
      # readies the runner for its worlds and encodes the fixtures the cache
      # lacks.
      - name: Run end-to-end tests
        id: test
        run: go run ./cmd/release test -tier e2e -shard "$SHARD" -filter "$FILTER" -repeat "$REPEAT" -timings .timings -record "$RUNNER_TEMP/timings/${{ matrix.target }}-e2e-${{ matrix.shard }}.json" -failures "$RUNNER_TEMP/failures/${{ matrix.target }}-e2e-${{ matrix.shard }}.json"
        env:
          TEST_SLIPSTREAM_BINARY: ${{ github.workspace }}/dist/slipstream${{ matrix.exe }}
          TEST_SLIPSTREAM_E2E_BINARY: ${{ github.workspace }}/dist/slipstream-e2e${{ matrix.exe }}
          TEST_FAKEWORLD_BINARY: ${{ github.workspace }}/dist/fakeworld${{ matrix.exe }}
          TEST_FAKEWORLD_RUNS: ${{ runner.temp }}/fakeworld-runs
      # Each failed run dir is a replay bundle. The run's copies of the
      # binaries stay out of it; fakeworld replay --binary takes them from
      # the dist artifact.
      - name: Upload fakeworld replay bundles on failure
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fakeworld-runs-e2e-${{ matrix.target }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/fakeworld-runs
            !${{ runner.temp }}/fakeworld-runs/**/bin/**
          if-no-files-found: ignore
      - name: Upload this shard's test timings
        if: ${{ !cancelled() && inputs.record-timings }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.target }}-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload this shard's failed tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.target }}-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/failures
          if-no-files-found: ignore

  # The browser tier runs the build job's dist/ and needs no Go.
  browser:
    name: Browser tests (${{ matrix.target }}${{ matrix.shards > 1 && format(', shard {0} of {1}', matrix.shard, matrix.shards) || '' }})
    needs: build
    if: fromJSON(inputs.browser).include[0]
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.browser) }}
    runs-on: ${{ matrix.runner }}
    # On Linux the plan names Playwright's container, which ships the
    # browsers and their system libraries; elsewhere the image is empty and
    # the job runs on the runner. User 1001 is the runner's own, so files the
    # job writes to the workspace stay the runner's. Playwright's Docker
    # guide asks for the host's IPC namespace, since a browser can run out of
    # the 64 MB of shared memory Docker gives a container.
    container:
      image: ${{ matrix.container }}
      options: --user 1001 --ipc=host
    env:
      SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
      FILTER: ${{ inputs.filter }}
      REPEAT: ${{ inputs.repeat }}
      EXE: ${{ matrix.exe }}
      # A cache entry holds its paths relative to the workspace, and the
      # container's home sits elsewhere from it than the runner's, so an
      # entry restores only where it was saved.
      CACHE_SIDE: ${{ matrix.container && 'container-' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.target }}
      # The worlds encode each catalog Scenario's release payloads and
      # library files once per machine, into the user cache dir. A file's
      # name hashes what made it, so an older cache's files still hold, and
      # without them a cold home launch encodes past its 2 min limit.
      - name: Restore fixtures
        uses: actions/cache@v6
        with:
          path: ${{ matrix.fixtures }}
          key: fixtures-${{ env.CACHE_SIDE }}${{ matrix.target }}-${{ hashFiles('native/lock.json', 'fakes/internal/mediafix/recipe.go', 'fakes/internal/releases/releases.go', 'fakes/scenario/catalog/*.yaml') }}
          restore-keys: fixtures-${{ env.CACHE_SIDE }}${{ matrix.target }}-
      # Playwright runs under Node through bun run. The container has its own.
      - name: Set up Node
        if: ${{ !matrix.container }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Bun
        if: ${{ !matrix.container }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: Set up Bun in the container
        if: matrix.container
        uses: ./.github/actions/bun
      - name: Restore the Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ env.CACHE_SIDE }}${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Keep Playwright browsers in the runner temp dir
        if: ${{ !matrix.container }}
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: Cache the Playwright browsers
        if: ${{ !matrix.container }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ matrix.target }}-${{ hashFiles('web/bun.lock') }}
      # The plan names the newest run that recorded this lane on this target.
      - name: Download test timings
        if: matrix.timings
        uses: actions/download-artifact@v8
        with:
          pattern: timings-*
          merge-multiple: true
          run-id: ${{ matrix.timings }}
          github-token: ${{ github.token }}
          path: .timings
      # An artifact keeps no executable bits, so the step restores the
      # release tool's, and on CI the tier restores the rest, readies the
      # runner for its worlds and encodes the fixtures the cache lacks. It
      # ends its Playwright runs 40 minutes after it starts, inside the job's
      # limit, so a shard that runs long still reports and records timings.
      - name: Run browser tests
        id: test
        run: |
          chmod +x "dist/release$EXE"
          "dist/release$EXE" test -tier browser -shard "$SHARD" -filter "$FILTER" -repeat "$REPEAT" -timings .timings -record "$RUNNER_TEMP/timings/${{ matrix.target }}-browser-${{ matrix.shard }}.json" -deadline 40m -failures "$RUNNER_TEMP/failures/${{ matrix.target }}-browser-${{ matrix.shard }}.json"
        env:
          TEST_SLIPSTREAM_BINARY: ${{ github.workspace }}/dist/slipstream${{ matrix.exe }}
          TEST_FAKEWORLD_BINARY: ${{ github.workspace }}/dist/fakeworld${{ matrix.exe }}
          TEST_FAKEWORLD_RUNS: ${{ github.workspace }}/fakeworld-runs
      # The runs sit in the workspace because the runner maps a host path in
      # a step's input to the container's only when the path starts the
      # input, and the second line here must match too.
      - name: Upload fakeworld replay bundles on failure
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fakeworld-runs-browser-${{ matrix.target }}-${{ matrix.shard }}
          path: |
            fakeworld-runs
            !fakeworld-runs/**/bin/**
          if-no-files-found: ignore
      - name: Upload this shard's test timings
        if: ${{ !cancelled() && inputs.record-timings }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.target }}-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload this shard's failed tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.target }}-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/failures
          if-no-files-found: ignore
