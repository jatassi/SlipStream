name: Run tests

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated targets to run, such as linux-amd64,windows-amd64; empty runs every target
        type: string
        default: ""
      tier:
        description: Lanes to run
        type: choice
        options: [all, go, e2e, browser, component, lint, platform, online]
        default: all
      filter:
        description: Run only the tests that match, as go test -run and playwright --grep
        type: string
        default: ""
      repeat:
        description: Run each test this many times, as go test -count and playwright --repeat-each
        type: number
        default: 1
      update-shapes:
        description: Rewrite each conformance suite's shape.json from the real services and upload them
        type: boolean
        default: false

permissions:
  contents: read

# A new dispatch on a ref makes the last one moot.
concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - name: Plan the run
        id: plan
        run: go run ./cmd/release plan -kind dispatch -targets "$TARGETS" -tier "$TIER" -timings "$RUNNER_TEMP/timings" -fetch-timings
        env:
          TARGETS: ${{ inputs.targets }}
          TIER: ${{ inputs.tier }}
          GH_TOKEN: ${{ github.token }}

  # A run of every lane on every target on main records the timings the
  # next runs split their shards by.
  tests:
    name: Tests
    needs: plan
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/tests.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      record-timings: ${{ github.ref == 'refs/heads/main' && inputs.tier == 'all' && inputs.targets == '' && inputs.filter == '' && inputs.repeat == 1 }}
      filter: ${{ inputs.filter }}
      repeat: ${{ inputs.repeat }}
      update-shapes: ${{ inputs.update-shapes }}
    secrets:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
      SUBSOURCE_API_KEY: ${{ secrets.SUBSOURCE_API_KEY }}
