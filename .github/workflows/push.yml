name: Push checks

# The train: each push to a feature branch, which a wave's merge makes, runs
# the e2e and browser lanes its waves skip, records their timings, and
# saves the Go cache the branch's waves restore. Its checks land on the
# branch tip, the head of the feature's draft final PR.
on:
  push:
    branches: ["feature/**"]

permissions:
  contents: read

# One train runs per branch. A newer push waits for it, and replaces any
# push already waiting, so each train runs to the end.
concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/go
        with:
          cache: go-plan
      - name: Plan the run
        id: plan
        run: go run ./cmd/release plan -kind train -timings "$RUNNER_TEMP/timings" -fetch-timings
        env:
          GH_TOKEN: ${{ github.token }}

  tests:
    name: Tests
    needs: plan
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/tests.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
      record-timings: true

  # Outside the gate, so a quarantined test's failure fails no push check.
  quarantine:
    name: Quarantine
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/quarantine.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}

  # A skipped check counts as passed, so the gate runs only to fail.
  gate:
    name: All push checks passed
    needs: [plan, tests]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report each job's result
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
        env:
          NEEDS: ${{ toJSON(needs) }}
