<!doctype html>
<!-- PROTOTYPE, throwaway. Work page at scale on direction C: three matrix layouts behind ?mx=, for ?work= (avatar|tlou),
     on ?device= (wide|phone), plus Home's resting colour behind ?home= (first|important|band|important-band). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SlipStream v2 · Work page at scale</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="variants/lit-console/style.css">
<link rel="stylesheet" href="scale/scale.css">
<style>
  html, body { margin: 0; background: #08090a; min-height: 100%; }
  body.device-phone { display: grid; place-items: center; min-height: 100vh; padding: 32px 0 96px; box-sizing: border-box; }
  #frame { position: relative; }
  body.device-wide #frame { min-height: 100vh; }
  body.device-phone #frame { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 10px #1c1d20, 0 0 0 11px #2c2d31, 0 40px 80px rgba(0,0,0,.6); transform: translateZ(0); }
  body.device-phone #app { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  @media (max-width: 500px) {
    body.device-phone { display: block; padding: 0; background: none; }
    body.device-phone #frame { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  #proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: #fde047; color: #111; font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.45); user-select: none; white-space: nowrap; }
  #proto-bar[hidden] { display: none; }
  #proto-bar button { all: unset; cursor: pointer; padding: 7px 9px; border-radius: 999px; }
  #proto-bar button:hover { background: rgba(0,0,0,.1); }
  #proto-bar button[aria-pressed="true"] { background: #111; color: #fde047; }
  #proto-bar button:focus-visible { outline: 2px solid #111; outline-offset: 1px; }
  #proto-bar .label { padding: 0 6px; min-width: 170px; text-align: center; }
  #proto-bar .sep { width: 1px; height: 18px; background: rgba(0,0,0,.25); margin: 0 2px; }
  #proto-bar .dim { opacity: .45; }
  @media (max-width: 500px) { #proto-bar { bottom: auto; top: 8px; font-size: 11px; flex-wrap: wrap; justify-content: center; border-radius: 18px; max-width: 96vw; } #proto-bar .label { min-width: 0; } }
</style>
</head>
<body>
<div id="frame"><div id="app"></div></div>
<nav id="proto-bar" aria-label="Prototype switcher"></nav>
<script type="module">
import * as data from './data.js';
import { startLive, onTick, format } from './live.js';
import { render } from './variants/lit-console/variant.js';
import { contentTypes } from './scale/descriptors.js';
import { works, jobs } from './scale/fixture.js';
import { headWide, headPhone } from './scale/head.js';

const MX = {
  A: { file: 'grid', name: 'Grid' },
  B: { file: 'inspector', name: 'Inspector' },
  C: { file: 'triage', name: 'Exceptions first' },
};
const HOME = { first: 'First job', important: 'Most important', band: 'Band', 'important-band': 'Both' };
const keys = Object.keys(MX);
const params = new URLSearchParams(location.search);
const pick = (k, allowed, d) => (allowed.includes(params.get(k)) ? params.get(k) : d);
const state = {
  mx: pick('mx', keys, 'A'),
  work: pick('work', Object.keys(works), 'avatar'),
  device: pick('device', ['wide', 'phone'], 'wide'),
  screen: pick('screen', ['work', 'home'], 'work'),
  home: pick('home', Object.keys(HOME), 'important'),
};
document.body.classList.add(`device-${state.device}`, 'surface-admin');
const navigate = (patch) => { location.search = new URLSearchParams({ ...state, ...patch }).toString(); };

const bar = document.getElementById('proto-bar');
const btn = (label, on, pressed, cls) => { const b = document.createElement('button'); b.textContent = label; b.onclick = on; if (pressed !== undefined) b.setAttribute('aria-pressed', pressed); if (cls) b.className = cls; return b; };
const sep = () => Object.assign(document.createElement('span'), { className: 'sep' });
const cycle = (d) => navigate({ mx: keys[(keys.indexOf(state.mx) + d + keys.length) % keys.length], screen: 'work' });
const onWork = state.screen === 'work';
bar.append(
  btn('←', () => cycle(-1)),
  Object.assign(document.createElement('span'), { className: `label${onWork ? '' : ' dim'}`, textContent: `${state.mx} · ${MX[state.mx].name}` }),
  btn('→', () => cycle(1)), sep(),
  btn('Movie', () => navigate({ work: 'avatar', screen: 'work' }), onWork && state.work === 'avatar'),
  btn('Series', () => navigate({ work: 'tlou', screen: 'work' }), onWork && state.work === 'tlou'), sep(),
  btn('Wide', () => navigate({ device: 'wide' }), state.device === 'wide'),
  btn('Phone', () => navigate({ device: 'phone' }), state.device === 'phone'), sep(),
  ...Object.entries(HOME).map(([k, l]) => btn(l, () => navigate({ home: k, screen: 'home' }), !onWork && state.home === k, onWork ? 'dim' : '')),
);
addEventListener('keydown', (e) => {
  const t = e.target; if (t.closest && t.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' && !e.metaKey && !e.ctrlKey) cycle(-1);
  if (e.key === 'ArrowRight' && !e.metaKey && !e.ctrlKey) cycle(1);
  if (e.key === '\\') bar.hidden = !bar.hidden;
});

const work = works[state.work];
const desc = contentTypes[work.contentType];
data.works[work.id] = work;
let workPage = null;
if (onWork) {
  data.jobs.push(...jobs.map((j) => ({ ...j, work: work.id, item: '', target: '' })));
  const css = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: `scale/variants/${MX[state.mx].file}.css` });
  document.head.append(css);
  await new Promise((r) => { css.onload = r; css.onerror = r; });
  const v = await import(`./scale/variants/${MX[state.mx].file}.js`);
  const vctx = { work, desc, data, format, onTick };
  workPage = {
    workId: work.id,
    title: work.title,
    nav: desc.nav,
    crumbs: `<button class="crumb" data-nav="library" data-label="Library">Library</button><i data-lucide="chevron-right" class="ic crumb-sep"></i><button class="crumb" data-nav="${desc.nav}" data-label="${desc.crumb}">${desc.crumb}</button><i data-lucide="chevron-right" class="ic crumb-sep"></i><span class="crumb cur">${work.title}</span>`,
    wide: () => `<div class="sx sx-${state.mx}">${headWide(work, desc)}${v.wide(vctx)}</div>`,
    phone: () => `<div class="sx sx-${state.mx}">${headPhone(work, desc)}${v.phone(vctx)}</div><nav class="tabs" aria-label="Tabs">${[['house', 'Home'], ['library', 'Library', 1], ['activity', 'Activity'], ['search', 'Search'], ['menu', 'More']].map(([ic, l, on]) => `<button class="tab${on ? ' on' : ''}" data-tab="${l.toLowerCase()}" data-label="${l}"><i data-lucide="${ic}" class="ic"></i><span>${l}</span></button>`).join('')}</nav>`,
    wire: (root) => v.wire && v.wire(root, vctx),
  };
}

const root = document.getElementById('app');
document.documentElement.classList.add('lc-doc');
render({
  root, data, format, onTick,
  surface: 'admin', device: state.device, screen: state.screen,
  home: state.home, workPage,
  go: (screen) => navigate({ screen }),
  icons: () => window.lucide && window.lucide.createIcons(),
});
window.lucide && window.lucide.createIcons();
startLive(root);
</script>
</body>
</html>
