<!doctype html>
<!--
  PROTOTYPE, throwaway. The Conversion queue and the backfill dialog, on the settled Lit console direction (prototype/ui-direction, variant C).
  Three structurally different variants behind ?variant=A|B|C. Each draws both the queue and the dialog.
  Controls: ?screen=queue|backfill  ?device=wide|phone  ?match=1 (backfill: an existing Profile already matches Cinema without 720p mobile)
  Served from prototypes/ so it can load Lit console's stylesheet. Everything is in memory; people, Nodes and numbers are invented.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Conversion queue · prototype</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../ui-direction/variants/lit-console/style.css">
<link rel="stylesheet" href="shared.css">
<style>
  html, body { margin: 0; background: #08090a; min-height: 100%; }
  body.device-phone { display: grid; place-items: center; min-height: 100vh; padding: 32px 0 96px; box-sizing: border-box; background: radial-gradient(120% 80% at 50% 0%, #17181b, #08090a); }
  #frame { position: relative; }
  body.device-wide #frame { min-height: 100vh; }
  body.device-phone #frame {
    width: 390px; height: 844px; border-radius: 48px; overflow: hidden;
    box-shadow: 0 0 0 10px #1c1d20, 0 0 0 11px #2c2d31, 0 40px 80px rgba(0,0,0,.6);
    transform: translateZ(0); /* pins the variant's position:fixed chrome to the frame */
  }
  body.device-phone #app { height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  @media (max-width: 500px) {
    body.device-phone { display: block; padding: 0; background: none; }
    body.device-phone #frame { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  #proto-bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2147483647;
    display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px;
    background: #fde047; color: #111; font: 600 12px/1 ui-sans-serif, system-ui, sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); user-select: none; white-space: nowrap;
  }
  #proto-bar[hidden] { display: none; }
  #proto-bar button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 999px; }
  #proto-bar button:hover { background: rgba(0,0,0,.1); }
  #proto-bar button[aria-pressed="true"] { background: #111; color: #fde047; }
  #proto-bar button:focus-visible { outline: 2px solid #111; outline-offset: 1px; }
  #proto-bar .label { padding: 0 6px; min-width: 170px; text-align: center; }
  #proto-bar .sep { width: 1px; height: 18px; background: rgba(0,0,0,.25); margin: 0 2px; }
  @media (max-width: 500px) { #proto-bar { bottom: auto; top: 8px; font-size: 11px; } #proto-bar .label { min-width: 0; } }
</style>
</head>
<body>
<div id="frame"><div id="app"></div></div>
<nav id="proto-bar" aria-label="Prototype switcher"></nav>
<script type="module">
import * as data from './data.js';
import * as S from './shell.js';
import { profilePage } from './profile.js';

const VARIANTS = { A: { file: 'a', name: 'Lanes' }, B: { file: 'b', name: 'Ledger' }, C: { file: 'c', name: 'Timeline' } };
const keys = Object.keys(VARIANTS);
const params = new URLSearchParams(location.search);
const state = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'A',
  device: params.get('device') === 'phone' ? 'phone' : 'wide',
  screen: params.get('screen') === 'backfill' ? 'backfill' : 'queue',
  match: params.get('match') === '1' ? '1' : '0',
};
const v = VARIANTS[state.variant];
document.body.classList.add(`device-${state.device}`);

function navigate(patch) { location.search = new URLSearchParams({ ...state, ...patch }).toString(); }

const bar = document.getElementById('proto-bar');
const btn = (label, on, pressed) => { const b = document.createElement('button'); b.textContent = label; b.onclick = on; if (pressed !== undefined) b.setAttribute('aria-pressed', pressed); return b; };
const sep = () => Object.assign(document.createElement('span'), { className: 'sep' });
const cycle = (d) => navigate({ variant: keys[(keys.indexOf(state.variant) + d + keys.length) % keys.length] });
bar.append(
  btn('←', () => cycle(-1)),
  Object.assign(document.createElement('span'), { className: 'label', textContent: `${state.variant} · ${v.name}` }),
  btn('→', () => cycle(1)), sep(),
  btn('Queue', () => navigate({ screen: 'queue' }), state.screen === 'queue'),
  btn('Backfill', () => navigate({ screen: 'backfill' }), state.screen === 'backfill'), sep(),
  btn('Wide', () => navigate({ device: 'wide' }), state.device === 'wide'),
  btn('Phone', () => navigate({ device: 'phone' }), state.device === 'phone'),
  ...(state.screen === 'backfill' ? [sep(), btn('Match exists', () => navigate({ match: state.match === '1' ? '0' : '1' }), state.match === '1')] : []),
);
addEventListener('keydown', (e) => {
  const t = e.target; if (t.closest && t.closest('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (e.key === 'ArrowLeft' && !e.metaKey && !e.ctrlKey) cycle(-1);
  if (e.key === 'ArrowRight' && !e.metaKey && !e.ctrlKey) cycle(1);
  if (e.key === '\\') bar.hidden = !bar.hidden;
});

if (state.match === '1') {
  data.profiles.push({ id: 'cinema-classic', name: 'Cinema Classic', contentType: 'movie', isDefault: false, targets: ['2160p-hdr', '1080p-sdr'], works: 9 });
  data.backfillAsk.existingMatch = 'cinema-classic';
}

const link = document.createElement('link');
link.rel = 'stylesheet'; link.href = `variants/${v.file}.css`;
document.head.append(link);
await new Promise((r) => { link.onload = r; link.onerror = r; });

const root = document.getElementById('app');
const ctx = { root, data, device: state.device, screen: state.screen, go: (screen) => navigate({ screen }) };
const shell = S.init(ctx);
const mod = await import(`./variants/${v.file}.js`);
const api = { ...S, D: data, isPhone: state.device === 'phone' };

document.title = `${state.screen === 'queue' ? 'Conversions' : 'Cinema · Profiles'} · SlipStream`;
if (state.screen === 'queue') {
  S.page({ nav: 'conversions', crumbs: ['Activity', 'Conversions'], back: 'Activity', title: 'Conversions', tab: 'activity', body: mod.queue(api) });
} else {
  S.page({ nav: 'profiles', crumbs: ['Settings', 'Profiles', 'Cinema'], back: 'Profiles', title: 'Cinema', tab: 'more', body: profilePage(api), overlay: mod.dialog(api) });
}
window.lucide && window.lucide.createIcons();
mod.wire(api, state.screen);
shell.startLive();
</script>
</body>
</html>
