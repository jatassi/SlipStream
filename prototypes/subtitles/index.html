<!doctype html>
<!-- PROTOTYPE, throwaway. Subtitle Provider setup and subtitle screens (#69), three variants behind ?variant=,
     across ?screen= (providers|profile|movie|series), ?device= (wide|phone) and ?scenario= (fresh|running|strained). -->
<html lang="en" class="lc-doc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Subtitles · SlipStream prototype</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../ui-direction/variants/lit-console/style.css">
<style>
  html, body { margin: 0; background: #08090a; min-height: 100%; }
  body.device-phone { display: grid; place-items: center; min-height: 100vh; padding: 32px 0 96px; box-sizing: border-box; background: radial-gradient(120% 80% at 50% 0%, #17181b, #08090a); }
  #frame { position: relative; }
  body.device-wide #frame { min-height: 100vh; }
  body.device-phone #frame { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; box-shadow: 0 0 0 10px #1c1d20, 0 0 0 11px #2c2d31, 0 40px 80px rgba(0,0,0,.6); transform: translateZ(0); }
  body.device-phone #app { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  @media (max-width: 500px) {
    body.device-phone { display: block; padding: 0; background: none; }
    body.device-phone #frame { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  #proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: #fde047; color: #111; font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.45); user-select: none; white-space: nowrap; }
  #proto-bar[hidden] { display: none; }
  #proto-bar button { all: unset; cursor: pointer; padding: 7px 9px; border-radius: 999px; }
  #proto-bar button:hover { background: rgba(0,0,0,.1); }
  #proto-bar button[aria-pressed="true"] { background: #111; color: #fde047; }
  #proto-bar button:focus-visible { outline: 2px solid #111; outline-offset: 1px; }
  #proto-bar .label { padding: 0 6px; min-width: 150px; text-align: center; }
  #proto-bar .sep { width: 1px; height: 18px; background: rgba(0,0,0,.25); margin: 0 2px; }
  @media (max-width: 900px) { #proto-bar { bottom: auto; top: 8px; font-size: 11px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); border-radius: 18px; } #proto-bar .label { min-width: 0; } }
  .lc .ph-main { display: flex; flex-direction: column; gap: 20px; padding: 4px 0 24px; }
</style>
</head>
<body>
<div id="frame"><div id="app"></div></div>
<nav id="proto-bar" aria-label="Prototype switcher"></nav>
<script type="module">
import * as data from './data.js';
import * as shell from './shell.js';

const VARIANTS = {
  A: { dir: 'a-cards', name: 'Provider cards' },
  B: { dir: 'b-ranked', name: 'Ranked list, guided sheet' },
  C: { dir: 'c-coverage', name: 'Coverage first' },
};
const SCREENS = { providers: 'Providers', profile: 'Profile', movie: 'Movie file', series: 'Episodes' };
const keys = Object.keys(VARIANTS);
const p = new URLSearchParams(location.search);
const pick = (k, list, d) => (list.includes(p.get(k)) ? p.get(k) : d);
const state = {
  variant: pick('variant', keys, 'A'),
  screen: pick('screen', Object.keys(SCREENS), 'providers'),
  device: pick('device', ['wide', 'phone'], 'wide'),
  scenario: pick('scenario', Object.keys(data.scenarios), 'running'),
};
const v = VARIANTS[state.variant];
document.body.classList.add(`device-${state.device}`);
const navigate = (patch) => { location.search = new URLSearchParams({ ...state, ...patch }).toString(); };

const bar = document.getElementById('proto-bar');
const btn = (label, on, pressed) => { const b = document.createElement('button'); b.textContent = label; b.onclick = on; if (pressed !== undefined) b.setAttribute('aria-pressed', pressed); return b; };
const sep = () => Object.assign(document.createElement('span'), { className: 'sep' });
const cycle = (d) => navigate({ variant: keys[(keys.indexOf(state.variant) + d + keys.length) % keys.length] });
bar.append(
  btn('←', () => cycle(-1)),
  Object.assign(document.createElement('span'), { className: 'label', textContent: `${state.variant} · ${v.name}` }),
  btn('→', () => cycle(1)), sep(),
  ...Object.entries(SCREENS).map(([k, l]) => btn(l, () => navigate({ screen: k }), state.screen === k)), sep(),
  ...Object.entries(data.scenarios).map(([k, s]) => btn(s.label, () => navigate({ scenario: k }), state.scenario === k)), sep(),
  btn('Wide', () => navigate({ device: 'wide' }), state.device === 'wide'),
  btn('Phone', () => navigate({ device: 'phone' }), state.device === 'phone'),
);
addEventListener('keydown', (e) => {
  const t = e.target; if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' && !e.metaKey && !e.ctrlKey) cycle(-1);
  if (e.key === 'ArrowRight' && !e.metaKey && !e.ctrlKey) cycle(1);
  if (e.key === '\\') bar.hidden = !bar.hidden;
});

const link = document.createElement('link');
link.rel = 'stylesheet'; link.href = `variants/${v.dir}/style.css`;
document.head.append(link);
await new Promise((r) => { link.onload = r; link.onerror = r; });

const root = document.getElementById('app');
root.classList.add('lc', `lc-${state.device}`);
const mod = await import(`./variants/${v.dir}/variant.js`);
const icons = () => window.lucide && window.lucide.createIcons();
mod.render({
  root, data, shell, icons,
  screen: state.screen, device: state.device, phone: state.device === 'phone',
  scenario: structuredClone(data.scenarios[state.scenario]), scenarioId: state.scenario,
  go: (screen) => navigate({ screen }),
});
icons();
root.addEventListener('click', (e) => { const t = e.target.closest('[data-toast]'); if (t) shell.toast(root, t.dataset.toast); });
</script>
</body>
</html>
