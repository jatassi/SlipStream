// The Storage Role: the roots a Node holds, their states and volumes, and
// the one service every filesystem act on a root goes through. The
// Controller names roots by id and files by root-relative '/' paths, and
// names an absolute path only where the Admin chooses a folder.
syntax = "proto3";

package slipstream.storage.v1;

import "slipstream/node/v1/options.proto";

// Intent is every root the Node holds, by id, and how often to sample.
message Intent {
  repeated Root roots = 1;
  int64 sample_every_seconds = 2;
}

message Root {
  bytes id = 1;
  string path = 2;
  // adopt: the Controller hasn't seen this root's marker at this place, so
  // the Node writes it if the folder is there, writable and holds a proof.
  bool adopt = 3;
  // place counts the root's re-homes, so facts about an earlier folder
  // can't confirm this one.
  int64 place = 4;
  // proof is up to three recorded root-relative file paths, empty while the
  // root has no files. Adoption needs one of them under the folder.
  repeated string proof = 5;
}

message Facts {
  // roots are in intent order.
  repeated RootFacts roots = 1;
  // volumes are by id.
  repeated Volume volumes = 2;
  // passed_at_unix_ms is when the pass that judged these began, on the
  // Node's clock. It rises with every pass, and Sample's answer names it.
  int64 passed_at_unix_ms = 3;
  // path_limit is the longest absolute path, in bytes, the Node writes: 259
  // on Windows unless long paths are enabled, then 32767; 1024 on macOS;
  // 4096 on Linux; or the Node's storage.path_limit setting.
  int64 path_limit = 4;
}

message RootFacts {
  bytes id = 1;
  // place is the intent's place this verdict judged.
  int64 place = 2;
  RootState state = 3;
  // volume_id is empty while unknown.
  string volume_id = 4;
  // detail is the OS error text, for the row's Details.
  string detail = 5;
}

enum RootState {
  ROOT_STATE_UNSPECIFIED = 0;
  ROOT_STATE_READY = 1;
  ROOT_STATE_MISSING = 2;
  ROOT_STATE_UNMOUNTED = 3;
  ROOT_STATE_FOREIGN = 4;
  ROOT_STATE_UNWRITABLE = 5;
  ROOT_STATE_UNRESPONSIVE = 6;
}

message Volume {
  // id is the fsid on Unix, or the volume serial on Windows.
  string id = 1;
  // name reads "D: (Media)", "/mnt/media", "/Volumes/Archive" or "\\nas\media".
  string name = 2;
  string mount = 3;
  VolumeKind kind = 4;
  int64 total = 5;
  // free is what SlipStream may use: f_bavail, or the bytes available to
  // the caller on Windows.
  int64 free = 6;
  int64 sampled_at_unix_ms = 7;
}

enum VolumeKind {
  VOLUME_KIND_UNSPECIFIED = 0;
  VOLUME_KIND_LOCAL = 1;
  VOLUME_KIND_REMOVABLE = 2;
  VOLUME_KIND_NETWORK = 3;
}

// Result is never sent: Storage reports by facts.
message Result {}

service StorageService {
  option (slipstream.node.v1.served_by) = {role: "storage"};
  // Verify checks one batch of recorded files under a root, or at a
  // proposed folder for a re-home.
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // Place puts a finished download's file at a root-relative holding path.
  rpc Place(PlaceRequest) returns (PlaceResponse);
  // Move renames within a root and converges on a repeat. With carry it
  // moves the file's companions after it, every call, so a retry finishes
  // what a crash left.
  rpc Move(MoveRequest) returns (MoveResponse);
  // Survey answers, for each planned rename under a root, the files at its
  // target and, when asked, its source's companions, listing each folder
  // once.
  rpc Survey(SurveyRequest) returns (SurveyResponse);
  // Prune removes a folder and each parent below the root while it is
  // empty, never a held folder, a kept folder or a parent of one.
  rpc Prune(PruneRequest) returns (PruneResponse);
  // Remove removes a root-relative file; a missing one is
  // FOLDER_ERROR_KIND_NOT_FOUND. A recursive Remove removes a folder and
  // everything in it, and a missing one is already removed.
  rpc Remove(RemoveRequest) returns (RemoveResponse);
  // List names the files in a root's holding or staging folder.
  rpc List(ListRequest) returns (ListResponse);
  // Sample judges every root and samples its volume now, sets the facts,
  // and answers their pass time.
  rpc Sample(SampleRequest) returns (SampleResponse);
  // Walk lists one page of a root's video files.
  rpc Walk(WalkRequest) returns (WalkResponse);
  // Probe reads one root file's media record with the bundled ffprobe. A
  // file ffprobe can't read is FAILED_PRECONDITION with an Unprobed detail.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}

// FolderService is the folder ops every Node serves, Storage or not, so an
// Admin can choose a folder on any Node.
service FolderService {
  option (slipstream.node.v1.served_by) = {every_node: true};
  // Browse lists a folder, or the Node's places for an empty path.
  rpc Browse(BrowseRequest) returns (BrowseResponse);
  // Suggest lists up to 25 folders completing typed text, in its separators.
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  // MakeFolder makes name in an existing parent, joined by the Node.
  rpc MakeFolder(MakeFolderRequest) returns (MakeFolderResponse);
  // Check judges a folder for a purpose on this Node.
  rpc Check(CheckRequest) returns (CheckResponse);
}

message BrowseRequest {
  string path = 1;
  bool show_hidden = 2;
}

message BrowseResponse {
  // path is cleaned, and empty for places.
  string path = 1;
  // parent is empty at a drive, a share or "/".
  string parent = 2;
  // segments name a drive "C:\" or a share "\\server\share" as one segment.
  repeated Segment segments = 3;
  Volume volume = 4;
  // folders are in natural, case-insensitive order.
  repeated Folder folders = 5;
  int64 hidden = 6;
  // places are only for an empty path.
  repeated Place places = 7;
  // service: SlipStream runs as a Windows service.
  bool service = 8;
}

message Segment {
  string name = 1;
  string path = 2;
}

message Folder {
  string name = 1;
  string path = 2;
  bool readable = 3;
}

message Place {
  string name = 1;
  string path = 2;
  VolumeKind kind = 3;
  int64 free = 4;
  int64 total = 5;
  // root_id is set when the place is a root this Node holds.
  bytes root_id = 6;
}

message SuggestRequest {
  string text = 1;
}

message SuggestResponse {
  repeated string paths = 1;
}

message MakeFolderRequest {
  string parent = 1;
  string name = 2;
}

message MakeFolderResponse {
  string path = 1;
}

message CheckRequest {
  string path = 1;
  // others is, for PURPOSE_ROOT, every root on this Node the folder must
  // not overlap. The Controller sends them, so a root it just saved counts
  // before the Node's intent catches up, and a re-homing root leaves itself
  // out. PURPOSE_DOWNLOADS reads the roots the Node holds instead.
  repeated Other others = 2;
  Purpose purpose = 3;
}

// Purpose is what a folder is for, which decides the rules it is judged by.
enum Purpose {
  PURPOSE_UNSPECIFIED = 0;
  // ROOT: a library root, apart from other roots and the Node's data and
  // downloads folders.
  PURPOSE_ROOT = 1;
  // DOWNLOADS: where the Node downloads, writable, on no network share,
  // and apart from every root it holds.
  PURPOSE_DOWNLOADS = 2;
  // CLIENT_FOLDER: an external Download Client's download folder as its
  // Node sees it: readable, on any volume, and apart from every root the
  // Node holds. It is never written.
  PURPOSE_CLIENT_FOLDER = 3;
}

message Other {
  bytes id = 1;
  string path = 2;
}

message CheckResponse {
  string path = 1;
  Volume volume = 2;
  // refusal is REASON_UNSPECIFIED when the folder is usable.
  Reason refusal = 3;
  // root_id is the root the folder overlaps.
  bytes root_id = 4;
  // marker is the root id the folder's marker names, if any.
  bytes marker = 5;
}

enum Reason {
  REASON_UNSPECIFIED = 0;
  REASON_NOT_ABSOLUTE = 1;
  REASON_NOT_FOUND = 2;
  REASON_NOT_A_FOLDER = 3;
  REASON_UNWRITABLE = 4;
  REASON_INSIDE_ROOT = 5;
  REASON_CONTAINS_ROOT = 6;
  REASON_INSIDE_DATA = 7;
  REASON_CONTAINS_DATA = 8;
  REASON_INSIDE_DOWNLOADS = 9;
  REASON_CONTAINS_DOWNLOADS = 10;
  REASON_UNRESPONSIVE = 11;
  REASON_NETWORK_SHARE = 12;
}

message VerifyRequest {
  oneof at {
    // path is a proposed folder for a re-home.
    string path = 1;
    // root_id is a root the Node holds, its marker read again first, so a
    // root unmounted since a walk is NotReady and never every file missing.
    bytes root_id = 3;
  }
  repeated Recorded files = 2;
}

// Recorded is a file's bytes at path, or, while the disk queue moves them,
// at next: the queue renames them before it records the rename.
message Recorded {
  string path = 1;
  int64 size = 2;
  string next = 3;
}

message VerifyResponse {
  repeated Missing missing = 1;
}

message Missing {
  // index is into the request's files.
  int64 index = 1;
  MissingReason reason = 2;
}

enum MissingReason {
  MISSING_REASON_UNSPECIFIED = 0;
  MISSING_REASON_MISSING = 1;
  MISSING_REASON_SIZE_DIFFERS = 2;
}

message PlaceRequest {
  bytes root_id = 1;
  bytes info_hash = 2;
  int64 file_index = 3;
  string to = 4;
}

message PlaceResponse {
  int64 size = 1;
  bool linked = 2;
  Identity identity = 3;
}

message MoveRequest {
  bytes root_id = 1;
  string from = 2;
  string to = 3;
  // carry moves each companion of from, a file in its folder named from's
  // stem, ".", and a tail, to to's stem, ".", and the same tail.
  bool carry = 4;
}

message MoveResponse {
  int64 size = 1;
  Identity identity = 2;
  // left are the companions that didn't take their new name because
  // another file holds it, each where it now lies: still at its old name,
  // or, moved out of the holding folder, at "<new stem>.<8 hex of the
  // file id>.<tail>" beside the file.
  repeated string left = 3;
}

message SurveyRequest {
  bytes root_id = 1;
  // planned is at most 2000 renames.
  repeated Planned planned = 2;
  bool companions = 3;
}

message Planned {
  string from = 1;
  string to = 2;
}

message SurveyResponse {
  // surveyed is in request order.
  repeated Surveyed surveyed = 1;
}

message Surveyed {
  // occupants are the entries in to's folder whose names equal to's
  // without case, as the Node spells them; a missing folder holds none.
  repeated Occupant occupants = 1;
  // companions are from's companions, when asked.
  repeated string companions = 2;
}

message Occupant {
  string path = 1;
  Identity identity = 2;
}

message PruneRequest {
  bytes root_id = 1;
  string folder = 2;
  // keep are folders Prune removes neither of nor any parent of.
  repeated string keep = 3;
}

message PruneResponse {
  // removed are the folders removed, innermost first.
  repeated string removed = 1;
}

// Identity is what a walk reads of a file besides its size, so a placed
// file records what the next scan compares.
message Identity {
  int64 modified_unix_ms = 1;
  // file_id is empty where the volume keeps no ids across mounts.
  bytes file_id = 2;
  // volume_id names the volume file_id is unique on. It is not Volume.id.
  string volume_id = 3;
}

message RemoveRequest {
  bytes root_id = 1;
  string path = 2;
  bool recursive = 3;
}

message RemoveResponse {}

message ListRequest {
  bytes root_id = 1;
  HeldFolder folder = 2;
}

enum HeldFolder {
  HELD_FOLDER_UNSPECIFIED = 0;
  HELD_FOLDER_HOLDING = 1;
  HELD_FOLDER_STAGING = 2;
}

message ListResponse {
  repeated string names = 1;
}

message SampleRequest {}

message SampleResponse {
  int64 passed_at_unix_ms = 1;
}

message WalkRequest {
  bytes root_id = 1;
  // after is the last page's next, empty for the first page.
  bytes after = 2;
  // limit is at most 1000 entries.
  int32 limit = 3;
}

message WalkResponse {
  // entries are video files, depth first, each folder's names in byte
  // order.
  repeated Walked entries = 1;
  repeated Unread unread = 2;
  // next is opaque to the Controller, and empty once the walk is done.
  bytes next = 3;
  // case_insensitive: the root resolves names ignoring case.
  bool case_insensitive = 4;
}

message Walked {
  // path is root-relative, '/' separated, spelled as the Node spells it.
  string path = 1;
  int64 size = 2;
  Identity identity = 3;
}

// Unread is a name a walk couldn't list.
message Unread {
  // path is for people: invalid bytes read as U+FFFD.
  string path = 1;
  UnreadReason reason = 2;
}

enum UnreadReason {
  UNREAD_REASON_UNSPECIFIED = 0;
  UNREAD_REASON_NOT_UTF8 = 1;
  UNREAD_REASON_REFUSED = 2;
  UNREAD_REASON_DENIED = 3;
}

message ProbeRequest {
  bytes root_id = 1;
  string path = 2;
}

message ProbeResponse {
  // record is media.Record as JSON, the shape files_file.probe keeps.
  bytes record = 1;
}

// Unprobed details a Probe of a file ffprobe can't read.
message Unprobed {
  // line is the first line of ffprobe's error output.
  string line = 1;
}

// FolderError details a folder op's error.
message FolderError {
  FolderErrorKind kind = 1;
  string os_text = 2;
  // account is the account SlipStream runs as, for DENIED.
  string account = 3;
}

enum FolderErrorKind {
  FOLDER_ERROR_KIND_UNSPECIFIED = 0;
  FOLDER_ERROR_KIND_NOT_FOUND = 1;
  FOLDER_ERROR_KIND_NOT_A_FOLDER = 2;
  FOLDER_ERROR_KIND_DENIED = 3;
  FOLDER_ERROR_KIND_UNRESPONSIVE = 4;
  FOLDER_ERROR_KIND_IO = 5;
}

// NotReady details a root op's error on a root that may not take writes now.
message NotReady {
  // state is the marker's verdict at the instant of the write.
  RootState state = 1;
  // draining: the Node drains Storage and takes no new imports.
  bool draining = 2;
  // unknown: the root isn't in this Node's intent yet.
  bool unknown = 3;
}
