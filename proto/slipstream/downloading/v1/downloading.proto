// The Downloading Role's messages: what each Node's built-in client and
// external Download Clients hold and how, what it reports of each torrent
// and client, and what it asks the Controller for a torrent it holds no
// data for and for a client's secrets.
syntax = "proto3";

package slipstream.downloading.v1;

import "slipstream/node/v1/options.proto";

// Intent is what the Node acts on every pass and nothing more: a pause
// changes a few bytes of it, and it carries no metainfo and no totals.
message Intent {
  // torrents are in added order.
  repeated Torrent torrents = 1;
  // discards are the removed Torrents the Node has not yet confirmed, in
  // added order.
  repeated Discard discards = 2;
  Settings settings = 3;
  // hold_downloads is the disk guard holding new downloads.
  bool hold_downloads = 4;
  Thresholds thresholds = 5;
  // sample_every_seconds is how often the Node samples its downloads
  // volume: Storage's cadence.
  int64 sample_every_seconds = 6;
  // clients are the Node's external Download Clients, on or off, in id
  // order. They carry no secret: the intent is cached in plain bytes on
  // the Worker.
  repeated Client clients = 7;
}

message Torrent {
  bytes id = 1;
  bytes info_hash = 2;
  Wanted wanted = 3;
  int64 order = 4;
  // client_id is the external client that holds it, empty for the
  // built-in client.
  bytes client_id = 5;
  // retry_at_unix_ms is the Admin's Retry of a failed torrent while it is
  // pending, 0 for none: the Node clears its failure and checks its files,
  // and wanted is paused in the same intent.
  int64 retry_at_unix_ms = 6;
}

enum Wanted {
  WANTED_UNSPECIFIED = 0;
  WANTED_STARTED = 1;
  WANTED_PAUSED = 2;
}

message Discard {
  bytes id = 1;
  bytes info_hash = 2;
  bool delete_files = 3;
  // client_id is the external client that holds it, empty for the
  // built-in client.
  bytes client_id = 4;
}

// Client is one external Download Client with every setting but its
// secrets.
message Client {
  bytes id = 1;
  Kind kind = 2;
  string name = 3;
  // address is the whole parsed URL.
  string address = 4;
  string username = 5;
  string label = 6;
  // folder is the download folder as the client sees it, empty for the
  // client's default.
  string folder = 7;
  repeated ClientFolder client_folders = 8;
  // daemon is Deluge's chosen daemon, absent for the only one.
  Daemon daemon = 9;
  int64 check_every_seconds = 10;
  int64 import_delay_seconds = 11;
  bool on = 12;
  // settings_version changes on every edit. The Node fetches the client's
  // secrets again when it does.
  int64 settings_version = 13;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_QBITTORRENT = 1;
  KIND_TRANSMISSION = 2;
  KIND_DELUGE = 3;
  KIND_RTORRENT = 4;
}

// ClientFolder pairs a folder as the client reports it with the path of
// the same folder on the client's Node.
message ClientFolder {
  string client = 1;
  string node = 2;
}

message Daemon {
  string host = 1;
  int32 port = 2;
}

message Secrets {
  string password = 1;
  string api_key = 2;
}

// Settings are the Node's client settings with every default applied.
message Settings {
  // download_limit and upload_limit are bytes a second, 0 for none.
  int64 download_limit = 1;
  int64 upload_limit = 2;
  // active_downloads is 0 for no limit.
  int32 active_downloads = 3;
  int32 active_checks = 4;
  int32 connections = 5;
  bool utp = 6;
  int64 stalled_after_seconds = 7;
  // dht runs the DHT while the Node holds a torrent or a metadata search
  // that may use it.
  bool dht = 8;
}

// Thresholds decide when a release counts as bad.
message Thresholds {
  int64 fault_stall_seconds = 1;
  int64 unregistered_gap_seconds = 2;
}

// Facts are the Node's client itself. They change rarely.
message Facts {
  string libtorrent = 1;
  string peer_id_prefix = 2;
  string user_agent = 3;
  // listen is the configured address and port.
  string listen = 4;
  reserved 5;
  // listen_error is why the client has no listener, empty while it has one.
  string listen_error = 6;
  // incoming_at_unix_ms is when a peer that proves the listen port
  // reachable first connected in to where the client listens now, 0 while
  // none has.
  int64 incoming_at_unix_ms = 7;
  // bound is the address and port the client listens on, empty while it
  // has no listener. An unspecified listen address binds the address the
  // host's default route leaves from, which can move.
  string bound = 10;
  // downloads is the downloads folder's volume as last sampled, absent
  // until the first sample.
  Volume downloads = 8;
}

message Volume {
  // mount is as the Node names it, as Storage names the same volume.
  string mount = 1;
  string name = 2;
  int64 total = 3;
  // free is what SlipStream may write.
  int64 free = 4;
  int64 sampled_at_unix_ms = 5;
}

// Report is one outbox entry: the torrents whose report changed, a totals
// batch, a removal's confirmation, an external client's poll state, a
// torrent an external client stopped listing, or an external client's raw
// counters.
message Report {
  oneof kind {
    Torrents torrents = 1;
    Totals totals = 2;
    Parted parted = 3;
    ClientPoll client = 4;
    Vanished vanished = 5;
    ClientTotals client_totals = 6;
  }
}

// ClientPoll is one external client's poll state as its Node judged it,
// sent when it changed and after every Check now.
message ClientPoll {
  bytes client_id = 1;
  // settings_version is the settings the poll ran under.
  int64 settings_version = 2;
  PollState state = 3;
  // since_unix_ms is when the state began: the first failure for not
  // responding, which shows only once it has lasted past the grace.
  int64 since_unix_ms = 4;
  // version is the product's version, read at the last sign-in.
  string version = 5;
  // problem is why the state isn't responding, absent while it is.
  Problem problem = 6;
  // check is the Check now token the poll answers, empty for none.
  bytes check = 7;
}

enum PollState {
  POLL_STATE_UNSPECIFIED = 0;
  POLL_STATE_RESPONDING = 1;
  POLL_STATE_NOT_RESPONDING = 2;
  POLL_STATE_SIGN_IN_REFUSED = 3;
  POLL_STATE_NEEDS_ATTENTION = 4;
}

// Problem is what went wrong with an external client, and the facts its
// sentence names.
message Problem {
  Cause cause = 1;
  // status is the HTTP status, for CAUSE_SERVER_ERROR.
  int32 status = 2;
  // version is the version reached, for CAUSE_VERSION_TOO_OLD.
  string version = 3;
  // folder is the folder tried as the Node sees it, and paired the client
  // folder it is paired with, empty for none.
  string folder = 4;
  string paired = 5;
  // host is the host name refused, for CAUSE_HOST_REFUSED.
  string host = 6;
  // missing is how many torrents the client no longer lists, for
  // CAUSE_MOST_MISSING.
  int32 missing = 7;
  // daemons are the daemons Deluge's web UI lists, for a Test that failed
  // with CAUSE_DAEMON_NEEDED or CAUSE_WRONG_DAEMON.
  repeated Daemon daemons = 8;
}

enum Cause {
  CAUSE_UNSPECIFIED = 0;
  CAUSE_NO_RESPONSE = 1;
  CAUSE_TIMED_OUT = 2;
  CAUSE_TLS_FAILED = 3;
  CAUSE_SERVER_ERROR = 4;
  CAUSE_WRONG_CREDENTIALS = 5;
  CAUSE_WRONG_API_KEY = 6;
  CAUSE_BANNED = 7;
  CAUSE_LOCKED_OUT = 8;
  CAUSE_VERSION_TOO_OLD = 9;
  CAUSE_LABEL_PLUGIN_OFF = 10;
  CAUSE_FOLDER_UNREADABLE = 11;
  CAUSE_FOLDER_IN_ROOT = 12;
  CAUSE_ADDRESS_REFUSED = 13;
  CAUSE_HOST_REFUSED = 14;
  CAUSE_DAEMON_NEEDED = 15;
  CAUSE_WRONG_DAEMON = 16;
  CAUSE_NOT_KEPT = 17;
  CAUSE_MOST_MISSING = 18;
}

// Vanished is a torrent an external client listed and then didn't list
// on two successful polls in a row.
message Vanished {
  bytes id = 1;
}

message ClientTotals {
  repeated ClientCounters rows = 1;
}

// ClientCounters are an external client's raw counters for one torrent,
// which can drop. The Controller counts their increase.
message ClientCounters {
  bytes id = 1;
  int64 uploaded = 2;
  int64 downloaded = 3;
  int64 active_seconds = 4;
  int64 seeding_seconds = 5;
  // done is the bytes done, sent only while incomplete.
  int64 done = 6;
}

message Torrents {
  repeated TorrentReport reports = 1;
}

// TorrentReport is the Node's whole word on one torrent: each one replaces
// the last.
message TorrentReport {
  bytes id = 1;
  int64 at_unix_ms = 2;
  EngineState engine = 3;
  Hold hold = 4;
  // until_unix_ms is when a window hold starts the torrent, 0 for none.
  int64 until_unix_ms = 5;
  bool complete = 6;
  bool stalled = 7;
  // error is the engine's error text while engine is failed.
  string error = 8;
  repeated TrackerLine trackers = 9;
  // completion is the files as they lie, once complete.
  Completion completion = 10;
  // fault is the release fault the Node recorded on the torrent, once it
  // has.
  Fault fault = 11;
  // save_folder is where the Node keeps the torrent, opaque to the
  // Controller.
  string save_folder = 12;
  int64 done = 13;
  int64 wanted = 14;
  // totals is the built-in client's counters. An external torrent's go in
  // ClientTotals.
  TotalsRow totals = 15;
  // origin is whether SlipStream added an external torrent or attached to
  // one already in the client, set from the Node's first sight of it.
  Origin origin = 16;
  // wanted_change is a pause or resume made in the external client.
  WantedChange wanted_change = 17;
  // run is what the external client means to do with the torrent.
  Wanted run = 18;
  // import_at_unix_ms is when a finished external torrent imports, set
  // while the Import delay runs.
  int64 import_at_unix_ms = 19;
  // queue_position is its place in its external client's queue, from 1, 0
  // for none.
  int32 queue_position = 20;
  // stopped_at_limit is an external torrent its client stopped at its
  // seeding limit.
  bool stopped_at_limit = 21;
  // retry_checked_unix_ms is the Retry whose check ended, 0 before one
  // did. done is what that check found.
  int64 retry_checked_unix_ms = 22;
}

enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_ADDED = 1;
  ORIGIN_ATTACHED = 2;
}

// WantedChange is the wanted state the Node saw change in the client,
// from the state it last applied.
message WantedChange {
  Wanted from = 1;
  Wanted to = 2;
}

enum EngineState {
  ENGINE_STATE_UNSPECIFIED = 0;
  ENGINE_STATE_CHECKING = 1;
  ENGINE_STATE_DOWNLOADING = 2;
  ENGINE_STATE_SEEDING = 3;
  ENGINE_STATE_FAILED = 4;
}

// Hold is why a torrent the Node could run doesn't.
enum Hold {
  HOLD_UNSPECIFIED = 0;
  HOLD_WANTED = 1;
  HOLD_WINDOW = 2;
  HOLD_DISK_FULL = 3;
  HOLD_SLOT = 4;
  HOLD_CHECK_SLOT = 5;
  HOLD_DISK_GUARD = 6;
  HOLD_DRAINING = 7;
  HOLD_CONTROLLER = 8;
  // HOLD_CLIENT_ERROR is a local error in an external client, with the
  // client's words in error.
  HOLD_CLIENT_ERROR = 9;
}

message TrackerLine {
  // index is into the metainfo's tracker list.
  int32 index = 1;
  TrackerStatus status = 2;
  // message is the tracker's failure reason or warning, verbatim.
  string message = 3;
  // retry_at_unix_ms is set while status is error or unregistered.
  int64 retry_at_unix_ms = 4;
}

enum TrackerStatus {
  TRACKER_STATUS_UNSPECIFIED = 0;
  TRACKER_STATUS_WORKING = 1;
  TRACKER_STATUS_UPDATING = 2;
  TRACKER_STATUS_ERROR = 3;
  TRACKER_STATUS_UNREGISTERED = 4;
  TRACKER_STATUS_NOT_CONTACTED = 5;
}

message Completion {
  repeated File files = 1;
}

message File {
  int32 index = 1;
  string path = 2;
  int64 size = 3;
}

// Fault is a release fault: the release itself looks bad.
message Fault {
  FaultKind kind = 1;
  // at_unix_ms is when the Node recorded it.
  int64 at_unix_ms = 2;
}

enum FaultKind {
  FAULT_KIND_UNSPECIFIED = 0;
  // FAULT_KIND_ENGINE_ERROR is an engine error the client blames on the
  // torrent rather than on the Node.
  FAULT_KIND_ENGINE_ERROR = 1;
  // FAULT_KIND_UNREGISTERED is a tracker calling the torrent unregistered
  // on two answers at least the unregistered gap apart.
  FAULT_KIND_UNREGISTERED = 2;
  // FAULT_KIND_NO_PAYLOAD is a download that received no payload in the
  // fault stall time it ran.
  FAULT_KIND_NO_PAYLOAD = 3;
}

message Totals {
  repeated TotalsRow rows = 1;
}

// TotalsRow is a torrent's all-time counters, which never go down.
message TotalsRow {
  bytes id = 1;
  int64 uploaded = 2;
  int64 downloaded = 3;
  int64 active_seconds = 4;
  int64 seeding_seconds = 5;
  // done is the bytes done, sent only while incomplete.
  int64 done = 6;
  // announced_seconds is the seed time the torrent's trackers credited it
  // by UNIT3D's rule, counted on the Node from its accepted announces. The
  // Node stores it in the Write that queues the row, so a restart counts
  // on from it.
  int64 announced_seconds = 7;
}

// Parted confirms a discard: the Node no longer holds the torrent.
message Parted {
  bytes id = 1;
  // freed is the bytes the delete freed.
  int64 freed = 2;
}

// DownloadingService is each downloading Node's client, as the Controller
// calls it.
service DownloadingService {
  option (slipstream.node.v1.served_by) = {role: "downloading"};
  // Watch answers after the Node's next live sample with the torrents whose
  // rates, progress or peers moved since sample after, or with every
  // torrent that moves when after is not the Node's last answer.
  rpc Watch(WatchRequest) returns (WatchResponse);
  // Inspect is one torrent's files with their progress and its trackers
  // as the announce policy sees them.
  rpc Inspect(InspectRequest) returns (InspectResponse);
  // Act announces or rechecks torrents, each through the announce policy.
  rpc Act(ActRequest) returns (ActResponse);
  // Frees is the bytes deleting each torrent's download copy would free:
  // its files that have no other link.
  rpc Frees(FreesRequest) returns (FreesResponse);
  // Sample samples the downloads volume now and answers once the Node has
  // set its facts with the sample.
  rpc Sample(SampleRequest) returns (SampleResponse);
  // Resolve answers a magnet link's info dictionary once a peer sent it,
  // how the search for it stands after a while, or why it ended. A second
  // call for the same info hash joins the first, and a found info
  // dictionary stays for a call whose answer was lost.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // TestClient tests a draft external client from this Node with its
  // secrets in the call, and changes nothing in the client.
  rpc TestClient(TestClientRequest) returns (TestClientResponse);
  // CheckClients polls each named external client now, ones whose sign-in
  // was refused too, and answers once each poll's report is in the outbox
  // with check.
  rpc CheckClients(CheckClientsRequest) returns (CheckClientsResponse);
}

message TestClientRequest {
  Client client = 1;
  Secrets secrets = 2;
}

message TestClientResponse {
  oneof answer {
    Passed passed = 1;
    Problem failed = 2;
  }
}

// Passed is what a passing Test learned.
message Passed {
  // product is the product's name as it answered.
  string product = 1;
  string version = 2;
  // node_folder is the download folder as the Node sees it, through the
  // Client folders.
  string node_folder = 3;
  repeated Warning warnings = 4;
  // daemons are the daemons Deluge's web UI lists, empty for other kinds.
  repeated Daemon daemons = 5;
}

enum Warning {
  WARNING_UNSPECIFIED = 0;
  WARNING_REMOVES_AT_LIMIT = 1;
  WARNING_MOVES_AFTER_FINISH = 2;
  WARNING_NO_MOVING_STATE = 3;
}

message CheckClientsRequest {
  repeated bytes ids = 1;
  // check is the Check now token each poll's report carries.
  bytes check = 2;
}

message CheckClientsResponse {}

message ResolveRequest {
  bytes info_hash = 1;
  // trackers are the magnet link's tr URLs in link order.
  repeated string trackers = 2;
  // name is the magnet link's dn, empty for none.
  string name = 3;
  // ends_at_unix_ms is when the search ends unless a peer has sent the
  // metadata: the Controller's deadline for it.
  int64 ends_at_unix_ms = 4;
}

message ResolveResponse {
  oneof answer {
    // info is the info dictionary a peer sent, whose SHA-1 is info_hash.
    bytes info = 1;
    Searching searching = 2;
    Unresolved unresolved = 3;
    Held held = 4;
    NotTaking not_taking = 5;
  }
}

// Searching is a metadata search still running.
message Searching {
  int64 since_unix_ms = 1;
  // peers are the peers connected now.
  int32 peers = 2;
}

// Unresolved is a metadata search that ended without the metadata.
message Unresolved {
  UnresolvedReason reason = 1;
  // most_peers is the most peers connected at once.
  int32 most_peers = 2;
  // tracker_message is the last failure reason a tracker responded with,
  // verbatim.
  string tracker_message = 3;
  // error is the engine's error text for UNRESOLVED_REASON_ENGINE_ERROR.
  string error = 4;
}

enum UnresolvedReason {
  UNRESOLVED_REASON_UNSPECIFIED = 0;
  // UNRESOLVED_REASON_TIMED_OUT: no peer sent the metadata by the
  // request's ends_at_unix_ms.
  UNRESOLVED_REASON_TIMED_OUT = 1;
  // UNRESOLVED_REASON_NO_PEER_SOURCE: the magnet link names no tracker and
  // the Node's DHT is off.
  UNRESOLVED_REASON_NO_PEER_SOURCE = 2;
  UNRESOLVED_REASON_ENGINE_ERROR = 3;
  // UNRESOLVED_REASON_INFO_TOO_LARGE: a peer sent a size for the info
  // dictionary over the largest .torrent SlipStream reads.
  UNRESOLVED_REASON_INFO_TOO_LARGE = 4;
}

// Held is a torrent of the info hash the Node already holds, whose
// .torrent the Controller has.
message Held {}

// NotTaking is a client that takes no new torrent now.
message NotTaking {}

message SampleRequest {}

message SampleResponse {
  int64 sampled_at_unix_ms = 1;
}

message WatchRequest {
  uint64 after = 1;
}

message WatchResponse {
  // sample is one past after when the rows are what moved since after;
  // any other number starts afresh.
  uint64 sample = 1;
  int64 at_unix_ms = 2;
  // down_bps and up_bps are the Node's payload bytes a second since its
  // previous sample.
  int64 down_bps = 3;
  int64 up_bps = 4;
  repeated Live rows = 5;
  // gone are the torrents the Node let go since sample after.
  repeated bytes gone = 6;
}

// Live is one torrent as the Node sampled it.
message Live {
  bytes id = 1;
  int64 down_bps = 2;
  int64 up_bps = 3;
  int64 done = 4;
  int64 wanted = 5;
  int32 peers = 6;
  int32 seeds = 7;
}

message InspectRequest {
  bytes id = 1;
}

message InspectResponse {
  // files are the torrent's files in its file order, empty until the
  // Node holds it in its engine.
  repeated FileProgress files = 1;
  repeated TrackerDetail trackers = 2;
  // announce_at_unix_ms is the earliest every tracker would accept an
  // announce.
  int64 announce_at_unix_ms = 3;
}

message FileProgress {
  int32 index = 1;
  int64 done = 2;
}

message TrackerDetail {
  int32 index = 1;
  TrackerStatus status = 2;
  // message is the tracker's failure reason or warning, verbatim.
  string message = 3;
  // answered_at_unix_ms is the tracker's last answer, 0 before one.
  int64 answered_at_unix_ms = 4;
  // next_announce_unix_ms is when the next announce to it is due, 0 while
  // none is.
  int64 next_announce_unix_ms = 5;
  // min_interval_seconds is the tracker's min interval as the announce
  // policy holds to it.
  int64 min_interval_seconds = 6;
  // accepts_at_unix_ms is the earliest the tracker would accept an
  // announce.
  int64 accepts_at_unix_ms = 7;
  // seeders and leechers are the counts the tracker's last announce
  // response carried, unset while none did. Only Inspect carries them, so
  // an announce changes no report.
  optional int32 seeders = 8;
  optional int32 leechers = 9;
}

message ActRequest {
  Act act = 1;
  repeated bytes ids = 2;
}

enum Act {
  ACT_UNSPECIFIED = 0;
  // ACT_ANNOUNCE announces a running torrent to every tracker now.
  ACT_ANNOUNCE = 1;
  // ACT_RECHECK checks a torrent's files, pausing it first and starting it
  // again through the announce policy once checked.
  ACT_RECHECK = 2;
}

message ActResponse {
  // results are one for each id asked, in the order asked.
  repeated ActResult results = 1;
}

message ActResult {
  bytes id = 1;
  Refusal refused = 2;
  // accepts_at_unix_ms is when an announce would be accepted, set when
  // refused for a window.
  int64 accepts_at_unix_ms = 3;
}

// Refusal is why the Node didn't act on a torrent.
enum Refusal {
  // REFUSAL_UNSPECIFIED is no refusal: the Node acted.
  REFUSAL_UNSPECIFIED = 0;
  // REFUSAL_NOT_HELD is a torrent the Node doesn't hold, or is letting go.
  REFUSAL_NOT_HELD = 1;
  // REFUSAL_NOT_RUNNING is an announce of a torrent that isn't running.
  REFUSAL_NOT_RUNNING = 2;
  // REFUSAL_WINDOW is an announce some tracker would reject until
  // accepts_at_unix_ms.
  REFUSAL_WINDOW = 3;
  // REFUSAL_FAILED is a recheck of a torrent the engine failed.
  REFUSAL_FAILED = 4;
  // REFUSAL_CLIENT_AWAY is a torrent of an external client whose polls
  // don't succeed now.
  REFUSAL_CLIENT_AWAY = 5;
}

message FreesRequest {
  repeated bytes ids = 1;
}

message FreesResponse {
  // freed are one for each id asked, in the order asked.
  repeated Freed freed = 1;
}

message Freed {
  bytes id = 1;
  // bytes are the bytes downloaded into its files that have no other link.
  int64 bytes = 2;
  // linked is some file also having another link, such as a library file
  // imported by hard link.
  bool linked = 3;
}

// DownloadingControlService is the Controller, as a downloading Node calls
// it.
service DownloadingControlService {
  option (slipstream.node.v1.served_by) = {controller: true};
  // Torrent is what a Node needs to add a torrent of its intent it holds
  // no data for. It answers only the Torrent's own Node, and NotFound for
  // a removed one.
  rpc Torrent(TorrentRequest) returns (TorrentResponse);
  // ClientSecrets is an external client's secrets at its current settings
  // version. It answers only the client's own Node, and NotFound for a
  // deleted client or another Node's.
  rpc ClientSecrets(ClientSecretsRequest) returns (ClientSecretsResponse);
}

message TorrentRequest {
  bytes id = 1;
}

message TorrentResponse {
  bytes metainfo = 1;
  // baseline is the totals the Controller recorded, which the Node's
  // counters start from.
  TotalsRow baseline = 2;
  // save_folder is the folder the Node reported, empty for a new torrent.
  string save_folder = 3;
  // content_type is the Content Type's name, for a new torrent's folder.
  string content_type = 4;
  // origin is an external torrent's origin as the Controller recorded it,
  // unspecified before the Node first reported it.
  Origin origin = 5;
}

message ClientSecretsRequest {
  bytes id = 1;
}

message ClientSecretsResponse {
  Secrets secrets = 1;
  // settings_version is the settings version the secrets belong to.
  int64 settings_version = 2;
}
