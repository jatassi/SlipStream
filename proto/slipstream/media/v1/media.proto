// MediaService probes a file where it lies, so the Controller never names a
// path on another machine.
syntax = "proto3";

package slipstream.media.v1;

import "slipstream/node/v1/options.proto";

service MediaService {
  option (slipstream.node.v1.served_by) = {every_node: true};
  // Probe reads a downloaded torrent file's media record with the bundled
  // ffprobe.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}

message ProbeRequest {
  bytes info_hash = 1;
  int32 file_index = 2;
}

message ProbeResponse {
  // record is media.Record as JSON, the shape files_file.probe keeps.
  bytes record = 1;
}
