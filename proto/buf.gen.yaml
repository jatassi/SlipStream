version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jatassi/slipstream/internal/pb
inputs:
  - directory: proto
plugins:
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-go]
    out: internal/pb
    opt: paths=source_relative
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-connect-go]
    out: internal/pb
    opt: paths=source_relative
  - local: [go, run, ./cmd/protoc-gen-slipstream]
    out: internal/pb
    opt: paths=source_relative
