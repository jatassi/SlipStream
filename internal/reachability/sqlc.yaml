version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        emit_pointers_for_null_types: true
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: reachability_settings.id
            go_type:
              type: Singleton
          - column: reachability_exposure.id
            go_type:
              import: github.com/jatassi/slipstream/internal/reachability/judge
              type: ExposureID
          - column: "*.exposure_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/reachability/judge
              type: ExposureID
          - column: "*.node_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: "*.*_node_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: "*.server_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/mediaserverlink/link
              type: ServerID
