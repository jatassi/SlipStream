version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        emit_pointers_for_null_types: true
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: notifications_event.at
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: "*.*_sealed"
            go_type:
              import: github.com/jatassi/slipstream/internal/secret
              type: Sealed
          - column: notifications_connection.id
            go_type:
              type: ConnectionID
          - column: "*.connection_id"
            go_type:
              type: ConnectionID
          - column: notifications_event.id
            go_type:
              type: EventID
          - column: "*.event_id"
            go_type:
              type: EventID
          - column: notifications_shown.seq
            go_type:
              type: Seq
          - column: notifications_seen.seq
            go_type:
              type: Seq
          - column: notifications_event.kind
            go_type:
              import: github.com/jatassi/slipstream/internal/history/entry
              type: Kind
          - column: "*.node_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: "*.account_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/identity
              type: AccountID
          - column: notifications_bell.id
            go_type:
              type: Singleton
          - column: notifications_settings.id
            go_type:
              type: Singleton
          - column: notifications_connection.is_on
            go_type: bool
          - column: notifications_connection.warnings
            go_type: bool
          - column: notifications_connection.posters
            go_type: bool
          - column: notifications_bell.warnings
            go_type: bool
