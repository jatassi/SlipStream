version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: indexers_indexer.id
            go_type:
              type: IndexerID
          - column: indexers_indexer.home_node_id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: "*.*_sealed"
            go_type:
              import: github.com/jatassi/slipstream/internal/secret
              type: Sealed
