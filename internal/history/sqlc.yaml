version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        emit_pointers_for_null_types: true
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: history_event.at
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: history_cleared.at
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: history_event.id
            go_type:
              type: EventID
          - column: "*.event_id"
            go_type:
              type: EventID
          - column: history_cleared.through
            go_type:
              type: EventID
          - column: history_event.kind
            go_type:
              import: github.com/jatassi/slipstream/internal/history/entry
              type: Kind
          - column: history_event.content_type
            go_type:
              import: github.com/jatassi/slipstream/internal/works
              type: TypeID
              pointer: true
          - column: "*.work_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/works
              type: WorkID
          - column: "*.grab_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: UUID
          - column: "*.import_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: UUID
          - column: history_settings.id
            go_type:
              type: Singleton
          - column: history_cleared.id
            go_type:
              type: Singleton
