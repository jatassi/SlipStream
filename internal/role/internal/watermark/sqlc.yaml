version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: role_watermark.node_id
            go_type:
              type: NodeID
          - column: role_watermark.epoch
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: UUID
