version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: nodes_node.id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: nodes_address.node_id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: nodes_role.node_id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: nodes_role.role
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: Name
          - column: nodes_forfeit.node_id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: nodes_forfeit.role
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: Name
          - column: nodes_join_code.used_by
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: nodes_settings.id
            go_type:
              type: Singleton
          - column: nodes_settings.join_code_lifetime_seconds
            go_type:
              type: int64
              pointer: true
          - column: nodes_settings.offline_grace_seconds
            go_type:
              type: int64
              pointer: true
