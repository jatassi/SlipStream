version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        emit_pointers_for_null_types: true
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: works_work.id
            go_type:
              type: WorkID
          - column: works_work.content_type
            go_type:
              type: TypeID
          - column: works_work.key
            go_type:
              type: Key
          - column: works_level.id
            go_type:
              type: LevelID
          - column: works_level.work_id
            go_type:
              type: WorkID
          - column: works_level.parent_id
            go_type:
              type: LevelID
          - column: works_level.key
            go_type:
              type: Key
          - column: works_item.id
            go_type:
              type: ItemID
          - column: works_item.work_id
            go_type:
              type: WorkID
          - column: works_item.level_id
            go_type:
              type: LevelID
          - column: works_item.key
            go_type:
              type: Key
          - column: works_item.monitored
            go_type: bool
          - column: works_item.aside
            go_type: bool
          - column: works_level.aside
            go_type: bool
          - column: works_work.monitor_new
            go_type: bool
          - column: works_work.monitor_asides
            go_type: bool
          - column: works_work.level_folders
            go_type: bool
          - column: works_work.added_by
            go_type:
              type: AddedBy
          - column: works_rating.work_id
            go_type:
              type: WorkID
          - column: works_rating.item_id
            go_type:
              type: ItemID
          - column: works_artwork.work_id
            go_type:
              type: WorkID
          - column: works_artwork.level_id
            go_type:
              type: LevelID
          - column: works_artwork.item_id
            go_type:
              type: ItemID
          - column: works_disabled_type.content_type
            go_type:
              type: TypeID
          - column: works_title.work_id
            go_type:
              type: WorkID
          - column: works_add_default.content_type
            go_type:
              type: TypeID
          - column: works_add_default.asides
            go_type:
              type: bool
              pointer: true
          - column: works_add_default.level_folders
            go_type:
              type: bool
              pointer: true
