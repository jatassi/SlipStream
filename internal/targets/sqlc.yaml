version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        emit_pointers_for_null_types: true
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: targets_target.id
            go_type:
              type: TargetID
          - column: targets_quality.target_id
            go_type:
              type: TargetID
          - column: targets_quality.quality
            go_type:
              import: github.com/jatassi/slipstream/internal/release
              type: Quality
          - column: targets_filter.target_id
            go_type:
              type: TargetID
          - column: targets_filter.attribute
            go_type:
              type: Attribute
          - column: targets_filter.mode
            go_type:
              type: Mode
          - column: targets_filter_value.target_id
            go_type:
              type: TargetID
          - column: targets_filter_value.attribute
            go_type:
              type: Attribute
          - column: targets_profile.id
            go_type:
              type: ProfileID
          - column: targets_profile.is_default
            go_type: bool
          - column: targets_profile.content_type
            go_type:
              import: github.com/jatassi/slipstream/internal/works
              type: TypeID
          - column: targets_profile_target.profile_id
            go_type:
              type: ProfileID
          - column: targets_profile_target.target_id
            go_type:
              type: TargetID
          - column: targets_profile_target.sourcing
            go_type:
              type: Sourcing
          - column: targets_starter.id
            go_type:
              type: Singleton
          - column: targets_starter.target_id
            go_type:
              type: TargetID
              pointer: true
          - column: targets_wants.work_id
            go_type:
              import: github.com/jatassi/slipstream/internal/works
              type: WorkID
          - column: targets_wants.profile_id
            go_type:
              type: ProfileID
