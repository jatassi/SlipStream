              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
              pointer: true
          - column: grabs_grab.sent_client_id
            go_type:
              import: github.com/jatassi/slipstream/internal/downloadclients
              type: ClientID
              pointer: true
          - column: "*.tracker_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/indexers
              type: TrackerID
          - column: grabs_search_indexer.node_id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: grabs_search_indexer.lapsed
            go_type:
              type: bool
              pointer: true
          - column: grabs_search_indexer.releases
            go_type:
              type: int64
              pointer: true
