version: "2"
sql:
  - engine: sqlite
    schema: schema
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        overrides:
          - column: "*.*_at"
            go_type:
              import: github.com/jatassi/slipstream/internal/storage
              type: Time
          - column: grabs_grab.id
            go_type:
              type: GrabID
          - column: "*.grab_id"
            go_type:
              type: GrabID
          - column: grabs_search.id
            go_type:
              type: SearchID
          - column: grabs_refusal.search_id
            go_type:
              type: SearchID
          - column: grabs_search_indexer.search_id
            go_type:
              type: SearchID
          - column: grabs_release.search_id
            go_type:
              type: SearchID
          - column: "*.query_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/indexers
              type: QueryID
          - column: "*.fetch_query_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/indexers
              type: QueryID
          - column: "*.tracker_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/indexers
              type: TrackerID
          - column: grabs_search_indexer.node_id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: grabs_search_indexer.lapsed
            go_type:
              type: bool
              pointer: true
          - column: grabs_search_indexer.releases
            go_type:
              type: int64
              pointer: true
          - column: grabs_search_indexer.outcome
            go_type:
              import: github.com/jatassi/slipstream/internal/indexers
              type: OutcomeKind
              pointer: true
          - column: grabs_search_indexer.cause
            go_type:
              import: github.com/jatassi/slipstream/internal/indexers
              type: Cause
              pointer: true
          - column: grabs_search_indexer.text
            go_type:
              type: string
              pointer: true
          - column: grabs_grab.release_magnet
            go_type:
              type: string
              pointer: true
          - column: "*.*_sealed"
            go_type:
              import: github.com/jatassi/slipstream/internal/secret
              type: Sealed
          - column: "*.work_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/works
              type: WorkID
          - column: "*.item_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/works
              type: ItemID
          - column: "*.indexer_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/indexers
              type: ID
          - column: grabs_grab.node_id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: grabs_grab.fetch_node_id
            go_type:
              import: github.com/jatassi/slipstream/internal/role
              type: NodeID
          - column: grabs_grab.edition
            go_type:
              import: github.com/jatassi/slipstream/internal/targets
              type: Edition
          - column: grabs_grab.unwanted
            go_type:
              import: github.com/jatassi/slipstream/internal/files
              type: Unwanted
              pointer: true
          - column: grabs_grab.torrent_id
            go_type:
              import: github.com/jatassi/slipstream/internal/downloadclients
              type: ID
          - column: grabs_grab.root_id
            go_type:
              import: github.com/jatassi/slipstream/internal/roots
              type: ID
          - column: "*.target_id"
            go_type:
              import: github.com/jatassi/slipstream/internal/targets
              type: TargetID
          - column: "*.stage"
            go_type:
              type: Stage
          - column: grabs_grab.failed_stage
            go_type:
              type: Stage
              pointer: true
          - column: grabs_grab.failure_code
            go_type:
              type: Code
              pointer: true
          - column: grabs_search.outcome
            go_type:
              type: Outcome
              pointer: true
          - column: grabs_grab.probe
            go_type:
              type: string
              pointer: true
          - column: grabs_grab.path
            go_type:
              type: string
              pointer: true
          - column: grabs_grab.failure_message
            go_type:
              type: string
              pointer: true
          - column: grabs_grab.file_index
            go_type:
              type: int64
              pointer: true
          - column: grabs_search.notes
            go_type:
              type: string
              pointer: true
          - column: grabs_grab.min_ratio
            go_type:
              type: float64
              pointer: true
          - column: grabs_grab.min_seed_seconds
            go_type:
              type: int64
              pointer: true
          - column: grabs_grab.download_factor
            go_type:
              type: float64
              pointer: true
          - column: grabs_grab.upload_factor
            go_type:
              type: float64
              pointer: true
