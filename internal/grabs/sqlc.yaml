          - column: grabs_target.forced
            go_type:
              type: bool
          - column: grabs_target.settled
            go_type:
              type: Settled
              pointer: true
          - column: "*.stage"
            go_type:
              type: Stage
          - column: grabs_grab.failed_stage
            go_type:
              type: Stage
              pointer: true
          - column: grabs_grab.failure_code
