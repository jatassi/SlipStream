source: synthetic
cases:
  - name: search
    call: {search: {mode: movie, text: "The Quiet Orchard 2021"}}
    exchanges:
      - request:
          method: POST
          path: /v1
          headers: {Accept: application/json, Content-Type: application/json}
          json: {order_by: date, order_direction: desc, from: 0, size: 100, hide_unsafe: true, search_type: "100%", search_field: title, query: The Quiet Orchard 2021}
        response:
          headers: {Content-Type: application/json; charset=utf-8}
          body: search.json
  - name: empty
    call: {search: {mode: search, text: Juniper Falls}}
    exchanges:
      - request: {method: POST, path: /v1, json: {query: Juniper Falls}}
        response: {headers: {Content-Type: application/json}, body: empty.json}
