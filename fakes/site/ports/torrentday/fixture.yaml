source: synthetic
settings:
  freeLeechOnly: "false"
session:
  cookie: "uid={{uid}}; pass={{pass}}"
  pasted: true
cases:
  - name: search
    call: {search: {mode: movie, ids: {imdbid: tt0000001}, text: The Quiet Orchard}}
    exchanges:
      - request:
          path: /t.json
          rawQuery: "25;96;11;5;103;3;21;22;13;44;48;1;24;104;32;31;33;46;82;14;26;7;34;2;10;4;18;8;9;17;27;23;41;16;29;42;20;102;30;95;47;43;45;28;12;19;6;15;q=tt0000001+The+Quiet+Orchard"
          headers: {Cookie: "uid={{uid}}; pass={{pass}}", Accept: "application/rss+xml, text/rss+xml, application/xml, text/xml"}
        response: {headers: {Content-Type: application/json}, body: search.json}
  - name: tv
    call: {search: {mode: tvsearch, text: Harbor Lights, season: 2, episode: "3"}}
    exchanges:
      - request: {path: /t.json, rawQuery: "25;96;11;5;103;3;21;22;13;44;48;1;24;104;32;31;33;46;82;14;26;7;34;2;10;4;18;8;9;17;27;23;41;16;29;42;20;102;30;95;47;43;45;28;12;19;6;15;q=Harbor+Lights+S02E03"}
        response: {headers: {Content-Type: application/json}, body: tv.json}
  - name: empty
    call: {search: {mode: search, text: Juniper Falls}}
    exchanges:
      - request: {path: /t.json, rawQuery: "25;96;11;5;103;3;21;22;13;44;48;1;24;104;32;31;33;46;82;14;26;7;34;2;10;4;18;8;9;17;27;23;41;16;29;42;20;102;30;95;47;43;45;28;12;19;6;15;q=Juniper+Falls"}
        response: {headers: {Content-Type: application/json}, body: empty.json}
  - name: recent
    call: {recent: {}}
    exchanges:
      - request: {path: /t.json, rawQuery: "25;96;11;5;103;3;21;22;13;44;48;1;24;104;32;31;33;46;82;14;26;7;34;2;10;4;18;8;9;17;27;23;41;16;29;42;20;102;30;95;47;43;45;28;12;19;6;15;q="}
        response: {headers: {Content-Type: application/json}, body: search.json}
  - name: test
    call: {test: {}}
    exchanges:
      - request: {path: /t.json}
        response: {headers: {Content-Type: application/json}, body: search.json}
  - name: auth
    call: {test: {}}
    session: {cookie: "uid={{uid}}; pass={{wrongPass}}", pasted: true}
    exchanges:
      - request: {path: /t.json, headers: {Cookie: "uid={{uid}}; pass={{wrongPass}}"}}
        response: {status: 302, headers: {Location: "/login.php?returnto=%2Ft.json"}}
      - request: {path: /login.php}
        response: {headers: {Content-Type: text/html}, body: login.html}
  - name: loggedout
    call: {search: {mode: search, text: The Quiet Orchard}}
    session: {cookie: "uid={{uid}}; pass={{expiredPass}}", pasted: true}
    exchanges:
      - request: {path: /t.json, headers: {Cookie: "uid={{uid}}; pass={{expiredPass}}"}}
        response: {status: 302, headers: {Location: "/login.php?returnto=%2Ft.json"}}
      - request: {path: /login.php}
        response: {headers: {Content-Type: text/html}, body: login.html}
  - name: unauthorized
    call: {recent: {}}
    exchanges:
      - request: {path: /t.json}
        response: {status: 401}
  - name: limit
    call: {recent: {}}
    exchanges:
      - request: {path: /t.json}
        response: {status: 429, headers: {Retry-After: "120"}}
  - name: grab
    call: {fetch: /download.php/1001/1001.torrent}
    exchanges:
      - request: {path: /download.php/1001/1001.torrent, headers: {Cookie: "uid={{uid}}; pass={{pass}}"}}
        response: {headers: {Content-Type: application/x-bittorrent}, body: orchard.torrent}
