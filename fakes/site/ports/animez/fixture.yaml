# Synthetic, written from AnimeZ.cs and AvistazBase. Prowlarr has no AnimeZ recording. The rows
# carry the format AnimeZ maps categories from, and a release title, which the parser prefers to
# the file name. The sign-in, error and maintenance bodies are AvistaZ's. grab answers the expired
# token with a 401, so the download signs in again and retries, as AnimeZ's Download does.
source: synthetic
settings:
  username: fixture-user
  password: "{{password}}"
  pid: "{{pid}}"
session: {token: "{{token}}"}
cases:
  - name: search
    call: {search: {mode: movie, text: The Quiet Orchard}}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{token}}", Accept: application/json}
          query: {limit: "50", search: The Quiet Orchard}
          noQuery: [in, type, imdb, freeleech, "format[]"]
        response: {headers: {Content-Type: application/json}, body: search.json}
  - name: tv
    call: {search: {mode: tvsearch, text: Harbor Lights, season: 2, episode: "3"}}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          query: {limit: "50", search: Harbor Lights S02E03}
        response: {headers: {Content-Type: application/json}, body: tv.json}
  - name: empty
    call: {search: {mode: search, text: Juniper Falls}}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          query: {limit: "50", search: Juniper Falls}
        response: {status: 404}
  - name: recent
    call: {recent: {}}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{token}}"}
          query: {limit: "50", search: ""}
        response: {headers: {Content-Type: application/json}, body: recent.json}
  - name: auth
    call: {recent: {}}
    session: {}
    exchanges:
      - request:
          method: POST
          path: /api/v1/jackett/auth
          headers: {Accept: application/json}
          form: {username: fixture-user, password: "{{password}}", pid: "{{pid}}"}
        response: {status: 401, headers: {Content-Type: application/json}, body: refused.json}
  - name: limit
    call: {recent: {}}
    exchanges:
      - request: {path: /api/v1/jackett/torrents}
        response: {status: 429, headers: {Retry-After: "60"}}
  - name: maintenance
    call: {recent: {}}
    exchanges:
      - request: {path: /api/v1/jackett/torrents}
        response: {headers: {Content-Type: text/html; charset=UTF-8}, body: maintenance.html}
  - name: loggedout
    call: {recent: {}}
    session: {token: "{{expiredToken}}"}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{expiredToken}}"}
        response: {status: 412, headers: {Content-Type: application/json}, body: signedout.json}
      - request:
          method: POST
          path: /api/v1/jackett/auth
          form: {username: fixture-user, password: "{{password}}", pid: "{{pid}}"}
        response: {headers: {Content-Type: application/json}, body: signedin.json}
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{token}}"}
          query: {search: ""}
        response: {headers: {Content-Type: application/json}, body: recent.json}
  - name: grab
    call: {fetch: "/rss/download/(removed)/(removed).torrent"}
    session: {token: "{{expiredToken}}"}
    exchanges:
      - request:
          path: "/rss/download/(removed)/(removed).torrent"
          headers: {Authorization: "Bearer {{expiredToken}}", Accept: application/json}
        response: {status: 401, headers: {Content-Type: application/json}, body: signedout.json}
      - request:
          method: POST
          path: /api/v1/jackett/auth
          form: {username: fixture-user, password: "{{password}}", pid: "{{pid}}"}
        response: {headers: {Content-Type: application/json}, body: signedin.json}
      - request:
          path: "/rss/download/(removed)/(removed).torrent"
          headers: {Authorization: "Bearer {{token}}", Accept: application/json}
        response: {headers: {Content-Type: application/x-bittorrent}, body: orchard.torrent}
  - name: test
    call: {test: {}}
    session: {}
    exchanges:
      - request:
          method: POST
          path: /api/v1/jackett/auth
          form: {username: fixture-user, password: "{{password}}", pid: "{{pid}}"}
        response: {headers: {Content-Type: application/json}, body: signedin.json}
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{token}}"}
          query: {search: ""}
        response: {headers: {Content-Type: application/json}, body: recent.json}
