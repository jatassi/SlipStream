source: synthetic
settings:
  username: fixture-user
  password: "{{password}}"
session:
  cookie: "PHPSESSID={{sid}}"
cases:
  - name: search
    call: {search: {mode: movie, ids: {imdbid: tt0000001}, text: The Quiet Orchard (2021)}}
    exchanges:
      - request:
          path: /torrents.php
          headers: {Cookie: "PHPSESSID={{sid}}", Accept: text/html}
          query: {search: tt0000001 The Quiet Orchard (2021), active: "0", options: "0"}
        response:
          headers: {Content-Type: text/html; charset=utf-8}
          body: search.html
  - name: tv
    call: {search: {mode: tvsearch, text: Harbor Lights, season: 2, episode: "3"}}
    exchanges:
      - request:
          path: /torrents.php
          query: {search: Harbor Lights S02E03, active: "0", options: "0"}
        response:
          headers: {Content-Type: text/html; charset=utf-8}
          body: tv.html
  - name: empty
    call: {search: {mode: search, text: Juniper Falls}}
    exchanges:
      - request:
          path: /torrents.php
          query: {search: Juniper Falls, active: "0", options: "0"}
        response:
          headers: {Content-Type: text/html; charset=utf-8}
          body: empty.html
  - name: recent
    call: {recent: {}}
    exchanges:
      - request:
          path: /torrents.php
          query: {search: "", active: "0", options: "0"}
        response:
          headers: {Content-Type: text/html; charset=utf-8}
          body: recent.html
  - name: auth
    call: {recent: {}}
    session: {}
    exchanges:
      - request:
          method: POST
          path: /login.php
          headers: {Referer: "https://hdtorrents.fixture-site.fake.localhost/login.php"}
          form: {pwd: "{{password}}"}
        response:
          headers: {Content-Type: text/html; charset=utf-8}
          body: loginfailed.html
  - name: limit
    call: {recent: {}}
    exchanges:
      - request: {path: /torrents.php}
        response: {status: 429, headers: {Retry-After: "60"}}
  - name: loggedout
    call: {recent: {}}
    session: {cookie: "PHPSESSID={{expiredSid}}"}
    exchanges:
      - request:
          path: /torrents.php
          headers: {Cookie: "PHPSESSID={{expiredSid}}"}
        response:
          headers: {Content-Type: text/html; charset=utf-8}
          body: notauthorized.html
      - request:
          method: POST
          path: /login.php
          form: {pwd: "{{password}}"}
        response:
          headers:
            Content-Type: text/html; charset=utf-8
            Set-Cookie: "PHPSESSID={{sid}}; expires=Sat, 07-Dec-2026 12:00:00 GMT; path=/"
          body: loggedin.html
      - request:
          path: /torrents.php
          headers: {Cookie: "PHPSESSID={{sid}}"}
        response:
          headers: {Content-Type: text/html; charset=utf-8}
          body: recent.html
