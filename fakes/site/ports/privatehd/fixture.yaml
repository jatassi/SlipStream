# recent.json is rows of Prowlarr's Files/Indexers/PrivateHD/recentfeed.json, one for each video
# quality and factor pair, rewritten by the record tool, with the details slugs and movie titles the
# rewrite missed made fictional by hand. search.json is one of those rows, and tv.json is a TV row
# written from the same shape. The sign-in, error and maintenance bodies are AvistaZ's, written
# from AvistazBase and its parser.
source: prowlarr
settings:
  username: fixture-user
  password: "{{password}}"
  pid: "{{pid}}"
session: {token: "{{token}}"}
cases:
  - name: search
    call: {search: {mode: movie, ids: {imdbid: tt1838520}}}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{token}}", Accept: application/json}
          query: {in: "1", type: "0", limit: "50", imdb: tt1838520}
          noQuery: [search, tmdb]
        response: {headers: {Content-Type: application/json}, body: search.json}
  - name: tv
    call: {search: {mode: tvsearch, text: Harbor Lights, season: 2, episode: "3"}}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          query: {in: "1", type: "0", limit: "50", search: Harbor Lights S02E03}
        response: {headers: {Content-Type: application/json}, body: tv.json}
  - name: empty
    call: {search: {mode: movie, ids: {imdbid: tt0000001}, text: The Quiet Orchard}}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          query: {in: "1", type: "0", limit: "50", imdb: tt0000001}
        response: {status: 404}
  - name: recent
    call: {recent: {}}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{token}}"}
          query: {in: "1", type: "0", limit: "50", search: ""}
        response: {headers: {Content-Type: application/json}, body: recent.json}
  - name: auth
    call: {recent: {}}
    session: {}
    exchanges:
      - request:
          method: POST
          path: /api/v1/jackett/auth
          headers: {Accept: application/json}
          form: {username: fixture-user, password: "{{password}}", pid: "{{pid}}"}
        response: {status: 401, headers: {Content-Type: application/json}, body: refused.json}
  - name: limit
    call: {recent: {}}
    exchanges:
      - request: {path: /api/v1/jackett/torrents}
        response: {status: 429, headers: {Retry-After: "60"}}
  - name: maintenance
    call: {recent: {}}
    exchanges:
      - request: {path: /api/v1/jackett/torrents}
        response: {headers: {Content-Type: text/html; charset=UTF-8}, body: maintenance.html}
  - name: loggedout
    call: {recent: {}}
    session: {token: "{{expiredToken}}"}
    exchanges:
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{expiredToken}}"}
        response: {status: 412, headers: {Content-Type: application/json}, body: signedout.json}
      - request:
          method: POST
          path: /api/v1/jackett/auth
          form: {username: fixture-user, password: "{{password}}", pid: "{{pid}}"}
        response: {headers: {Content-Type: application/json}, body: signedin.json}
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{token}}"}
          query: {search: ""}
        response: {headers: {Content-Type: application/json}, body: recent.json}
  - name: grab
    call: {fetch: "/rss/download/(removed)/(removed).torrent"}
    session: {token: "{{expiredToken}}"}
    exchanges:
      - request:
          path: "/rss/download/(removed)/(removed).torrent"
          headers: {Authorization: "Bearer {{expiredToken}}"}
        response: {status: 401, headers: {Content-Type: application/json}, body: signedout.json}
      - request:
          method: POST
          path: /api/v1/jackett/auth
          form: {username: fixture-user, password: "{{password}}", pid: "{{pid}}"}
        response: {headers: {Content-Type: application/json}, body: signedin.json}
      - request:
          path: "/rss/download/(removed)/(removed).torrent"
          headers: {Authorization: "Bearer {{token}}"}
        response: {headers: {Content-Type: application/x-bittorrent}, body: orchard.torrent}
  - name: test
    call: {test: {}}
    session: {}
    exchanges:
      - request:
          method: POST
          path: /api/v1/jackett/auth
          form: {username: fixture-user, password: "{{password}}", pid: "{{pid}}"}
        response: {headers: {Content-Type: application/json}, body: signedin.json}
      - request:
          path: /api/v1/jackett/torrents
          headers: {Authorization: "Bearer {{token}}"}
          query: {search: ""}
        response: {headers: {Content-Type: application/json}, body: recent.json}
