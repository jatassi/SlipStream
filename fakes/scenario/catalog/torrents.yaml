# yaml-language-server: $schema=../scenario.schema.json
description: >-
  One Node set up as the Controller, downloading from a tracker that plays
  UNIT3D's announce rules with a 2 minute min interval. The Quiet Orchard's
  release downloads from its seeders, Harbor Lights' release is unregistered
  at the tracker, and Salt Meadow's comes only from a bad peer that sends
  corrupt pieces. Harbor Lights has a backdrop and no poster.
seed: torrents
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
timings:
  node:
    stop_deadline: 5s
tmdb:
  movies:
    - id: 9000001
      imdb_id: tt9000001
      title: The Quiet Orchard
      released: 2021-04-16
      runtime: 104m
    - id: 9000002
      imdb_id: tt9000002
      title: Harbor Lights
      released: 2019-09-06
      runtime: 98m
      images:
        - {shape: backdrop, votes: 4}
    - id: 9000003
      imdb_id: tt9000003
      title: Salt Meadow
      released: 2020-02-14
      runtime: 91m
releases:
  - name: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 12
    seeded: true
    advertised_size: 8.2GiB
  - name: Harbor.Lights.2019.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000002
    video: {width: 1920, height: 1080, seconds: 5}
    seeders: 8
    seeded: false
    advertised_size: 7.6GiB
    unregistered: true
  - name: Salt.Meadow.2020.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000003
    video: {width: 1920, height: 1080, seconds: 5}
    seeders: 3
    seeded: false
    advertised_size: 7.1GiB
    bad_peer: corrupt
tracker:
  interval: 3m
  min_interval: 2m
  mode: unit3d
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: movie, folder: movies}]
  indexers: [{name: Fixture Site, kind: torznab, site: torznab}]
