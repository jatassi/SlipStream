      original_title: The Dark Knight
      original_language: en
      overview: Batman raises the stakes in his war on crime. With the help of Lt. Jim Gordon and District Attorney Harvey Dent, Batman sets out to dismantle the remaining criminal organizations that plague the streets. The partnership proves to be effective, but they soon find themselves prey to a reign of chaos unleashed by a rising criminal mastermind known to the terrified citizens of Gotham as the Joker.
      tagline: Welcome to a world without rules.
      genres: [Action, Thriller, Crime]
      status: Released
      titles:
        - {country: US, title: 'Batman: The Dark Knight'}
        - {country: FR, title: 'Batman, Le Chevalier Noir'}
        - {country: US, title: 'Batman II: The Dark Knight', kind: alternative title}
        - {country: US, title: 'The Dark Knight 2: The Dark Knight', kind: Full Formal}
        - {country: US, title: The Dark Knight}
      translations:
        - language: fr-FR
          title: 'The Dark Knight : Le Chevalier noir'
          overview: 'Batman aborde une phase décisive de sa guerre contre le crime à Gotham City. Avec l''aide du lieutenant de police Jim Gordon et du nouveau procureur Harvey Dent, il entreprend de démanteler les dernières organisations criminelles qui infestent les rues de la ville. L''association s''avère efficace, mais le trio se heurte bientôt à un nouveau génie du crime qui répand la terreur et le chaos dans Gotham : le Joker. On ne sait pas d''où il vient ni qui il est. Ce criminel possède une intelligence redoutable doublé d''un humour sordide et n''hésite pas à s''attaquer à la pègre locale dans le seul but de semer le chaos.'
        - language: de-DE
          overview: Gemeinsam mit Bezirksstaatsanwalt Harvey Dent und Lieutenant James Gordon versucht der im Fledermauskostüm agierende Milliardär Bruce Wayne dem Verbrechen in Gotham City Einhalt zu gebieten. Wie aus dem Nichts taucht plötzlich ein psychotischer Superverbrecher auf - der Joker. In seiner wahnhaften Vision möchte er die Stadt in Chaos und Anarchie stürzen und Batman scheint der einzige, der ihn stoppen kann. Bis es zum endgültigen Show-Down kommt, wird aber viel Blut fließen und auch Menschen die Bruce Wayne nahe stehen, könnten Opfer werden.
          tagline: Warum so ernst?
        - language: es-ES
          title: El caballero oscuro
          overview: Batman/Bruce Wayne regresa para continuar su guerra contra el crimen. Con la ayuda del teniente Jim Gordon y del Fiscal del Distrito Harvey Dent, Batman se propone destruir el crimen organizado en la ciudad de Gotham. El triunvirato demuestra su eficacia, pero, de repente, aparece Joker, un nuevo criminal que desencadena el caos y tiene aterrados a los ciudadanos.
          tagline: Algunos hombres sólo quieren ver el mundo arder.
