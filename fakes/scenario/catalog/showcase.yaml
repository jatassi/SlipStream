      original_title: Le Fabuleux Destin d'Amélie Poulain
      original_language: fr
      overview: At a tiny Parisian café, the adorable yet painfully shy Amélie accidentally discovers a gift for helping others. Soon Amelie is spending her days as a matchmaker, guardian angel, and all-around do-gooder. But when she bumps into a handsome stranger, will she find the courage to become the star of her very own love story?
      tagline: She’ll change your life.
      genres: [Comedy, Romance]
      status: Released
      titles:
        - {country: US, title: The Fabulous Destiny of Amelie Poulain}
        - {country: FR, title: Amélie Poulain}
        - {country: US, title: Amelie}
        - {country: GB, title: Amélie from Montmartre}
        - {country: GB, title: Amelie from Montmartre}
      translations:
        - language: fr-FR
          overview: 'Amélie, une jeune serveuse dans un bar de Montmartre, passe son temps à observer les gens et à laisser son imagination divaguer. Elle s''est fixée un but : faire le bien de ceux qui l''entourent. Elle invente alors des stratagèmes pour intervenir incognito dans leur existence. Le chemin d''Amélie est jalonné de rencontres: Georgette, la buraliste hypocondriaque, Lucien, le commis d''épicerie, Madeleine Wallace, la concierge portée sur le porto et les chiens empaillés, ou encore Raymond Dufayel alias « l''homme de verre », son voisin qui ne vit qu''à travers une reproduction d''un tableau de Renoir. Cette quête du bonheur amène Amélie à faire la connaissance de Nino Quincampoix, un étrange « prince charmant ». Celui-ci partage son temps entre un train fantôme et un sex-shop, et cherche à identifier un inconnu dont la photo réapparaît sans cesse dans plusieurs cabines de photomaton.'
          tagline: Une personne peut changer votre vie pour toujours.
        - language: de-DE
          title: Die fabelhafte Welt der Amélie
          overview: Im Herzen von Paris arbeitet die schüchterne Amélie als Kellnerin in einem kleinen Straßencafé. Eine Wendung nimmt das vergleichsweise ereignisarme, von kuriosen Alltagsbeobachtungen gewürzte Leben der jungen Frau, als sie eine Schachtel mit Kindheitserinnerungen eines Fremden entdeckt und dem ursprünglichen Besitzer damit große Freude bereitet. Fortan macht es sich Amélie zur Lebensaufgabe, helfend in das Schicksal ihrer Mitmenschen einzugreifen. Nur als es um das eigene Liebesglück geht, scheint ihr Talent zu versagen.
        - language: es-ES
          title: Amelie
          overview: Amélie Poulain (Audrey Tautou) es una joven camarera que vive en París y que tiene una imaginación desbordante. Un día, encuentra una caja con objetos antiguos que pertenecían al antiguo inquilino de su apartamento. Amélie decide devolver la caja a su dueño y ver su reacción. Al ver la felicidad que le provoca, Amélie se propone hacer felices a los demás con pequeños gestos. Así, ayuda a sus vecinos, a sus compañeros de trabajo y a su padre, mientras se divierte con sus ocurrencias. Pero en su búsqueda de la felicidad ajena, Amélie se olvida de la suya propia, hasta que conoce a Nino Quincampoix (Mathieu Kassovitz), un joven coleccionista de fotos que le roba el corazón.
          tagline: Una persona puede cambiar tu vida para siempre.
