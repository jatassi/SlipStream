      original_title: Everything Everywhere All at Once
      original_language: en
      overview: An aging Chinese immigrant is swept up in an insane adventure, where she alone can save what's important to her by connecting with the lives she could have led in other universes.
      tagline: The universe is so much bigger than you realize.
      genres: [Action, Adventure, Science Fiction]
      status: Released
      titles:
        - {country: FR, title: 'Tout, partout, tout à la fois'}
        - {country: US, title: EEAAO}
        - {country: US, title: EEAO}
      translations:
        - language: fr-FR
          overview: 'Evelyn Wang est à bout : elle ne comprend plus sa famille, son travail et croule sous les impôts… Soudain, elle se retrouve plongée dans le multivers, des mondes parallèles où elle explore toutes les vies qu’elle aurait pu mener. Face à des forces obscures, elle seule peut sauver le monde mais aussi préserver la chose la plus précieuse : sa famille.'
          tagline: L'univers est tellement plus grand que vous ne le pensez.
        - language: de-DE
          overview: Eine alternde chinesische Einwanderin wird in ein verrücktes Abenteuer hineingezogen, in dem nur sie das retten kann, was ihr wichtig ist, indem sie sich mit den Leben verbindet, die sie in anderen Universen hätte führen können.
          tagline: Das Universum ist so viel größer, als du denkst.
        - language: es-ES
          title: Todo a la vez en todas partes
          overview: Cuando una ruptura interdimensional altera la realidad, Evelyn, una inmigrante china en Estados Unidos, se ve envuelta en una aventura salvaje en la que sólo ella puede salvar el mundo. Perdida en los mundos infinitos del multiverso, esta heroína inesperada debe canalizar sus nuevos poderes para luchar contra los extraños y desconcertantes peligros del multiverso mientras el destino del mundo pende de un hilo.
          tagline: El universo es mucho más grande de lo que crees.
