# yaml-language-server: $schema=../scenario.schema.json
description: >-
  One Node set up as the Controller, with a Challenge solver, for Manual
  search. Films want 1080p, a Target of only the 1080p qualities, and HD,
  1080p down to 720p, in the Standard cut alone; both Targets refuse x265,
  take a 1080p WEB-DL of 10 to 150 MiB a minute and score the LQ group -5
  under a minimum of 0. The movies root's first scan adds The Quiet
  Orchard with a 720p WEB-DL, so its 1080p cell is missing and its HD cell
  can upgrade, and the tv root's adds The Lantern Keepers with S02E01 to
  S02E04, so E05 to E10 of season 2 are missing. Fixture Site lists most
  Releases, at priority 10. Heron answers each search 20 seconds late, with
  a freeleech WEB-DL, a copy of Fixture Site's 1080p WEB-DL and S02E08.
  Tamarack is off for automatic search and lists a 1080p Bluray. Cinder, a
  Cardigann site behind a challenge, lists FLUX's WEB-DL. The Orchard's
  Releases hit each refusal: another film's IMDb id, a title of 1987, a
  2160p, an x265, a size under and over, the LQ group, a repack of the
  720p from another group, a 720p WEBRip no better than the file, and the
  Extended cut. One is magnet only, one is unregistered at the tracker,
  and a repack of the 1080p WEB-DL waits for the fixture-site-list cue.
  The series' season pack covers more than one episode, a Release named
  S02E07 is listed under S02E05, and S02E10's is unregistered, so its Grab
  fails. A Blocklist entry needs a Grab first, so the Scenario has none.
seed: manual-search
