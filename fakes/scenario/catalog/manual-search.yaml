tracker:
  interval: 5s
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  folders:
    - folder: movies
      files:
        - path: The Quiet Orchard (2021) {tmdb-9000001}/The.Quiet.Orchard.2021.720p.WEB-DL.H264-FKW.mkv
          video: {width: 1280, height: 720, seconds: 2, hdr: sdr}
          audio: [{codec: aac, channels: 2, language: eng, default: true}]
    - folder: tv
      files:
        - path: The Lantern Keepers [tvdbid-1001]/Season 02/The.Lantern.Keepers.S02E01.1080p.WEB-DL.H264-FKW.mkv
          video: {width: 1920, height: 1080, seconds: 1, hdr: sdr}
          audio: [{codec: aac, channels: 2, language: eng, default: true}]
        - path: The Lantern Keepers [tvdbid-1001]/Season 02/The.Lantern.Keepers.S02E02.1080p.WEB-DL.H264-FKW.mkv
          video: {width: 1920, height: 1080, seconds: 1, hdr: sdr}
          audio: [{codec: aac, channels: 2, language: eng, default: true}]
        - path: The Lantern Keepers [tvdbid-1001]/Season 02/The.Lantern.Keepers.S02E03.1080p.WEB-DL.H264-FKW.mkv
          video: {width: 1920, height: 1080, seconds: 1, hdr: sdr}
          audio: [{codec: aac, channels: 2, language: eng, default: true}]
        - path: The Lantern Keepers [tvdbid-1001]/Season 02/The.Lantern.Keepers.S02E04.1080p.WEB-DL.H264-FKW.mkv
          video: {width: 1920, height: 1080, seconds: 1, hdr: sdr}
          audio: [{codec: aac, channels: 2, language: eng, default: true}]
  roots: [{content_type: movie, folder: movies}, {content_type: series, folder: tv}]
  formats:
    - {name: LQ, group: ^LQ$}
  targets:
    - name: 1080p
      tiers: [[bluray-1080p, remux-1080p], [webdl-1080p, webrip-1080p, hdtv-1080p]]
      cutoff: webdl-1080p
      filters: [{attribute: video_codec, mode: not, values: [x265]}]
      sizes: [{quality: webdl-1080p, min: 10, max: 150}]
      scores: {formats: {LQ: -5}}
    - name: HD
      tiers: [[webdl-1080p, webrip-1080p, hdtv-1080p], [webdl-720p, webrip-720p, hdtv-720p]]
      cutoff: webdl-1080p
      filters: [{attribute: video_codec, mode: not, values: [x265]}]
      sizes: [{quality: webdl-1080p, min: 10, max: 150}]
      scores: {formats: {LQ: -5}}
  profiles: [{name: Films, content_type: movie, targets: [1080p, HD], default: true, cuts: [standard]}]
  indexers:
    - {name: Fixture Site, kind: torznab, site: torznab, priority: 10}
    - {name: Heron, kind: torznab, site: heron}
    - {name: Tamarack, kind: torznab, site: tamarack, automatic_search: false}
    - {name: Cinder, kind: catalog, site: cinder}
faults:
  - {id: heron-answers-late, target: fixture-site, route: heron.api, fault: delay=20s}
