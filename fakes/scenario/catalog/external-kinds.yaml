# yaml-language-server: $schema=../scenario.schema.json
description: >-
  One Node set up as the Controller with one external client of each kind:
  qBittorrent 5.2, Transmission 4.1, Deluge 2.1 and rTorrent 0.16. qBittorrent
  calls its download folder D:\Torrents, Transmission and Deluge /downloads,
  and rTorrent /srv/torrents, and the world pairs each with the folder as the
  Node sees it. The Node's New Grabs go to qBittorrent until an Admin changes
  them. No seeder serves the release, so only a client can download it.
seed: external-kinds
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    download_clients:
      - kind: qbittorrent
        version: "5.2"
        username: ada
        password: quiet-orchard
        folder: D:\Torrents
        pair: true
        grabs_to: true
      - kind: transmission
        version: "4.1"
        username: ada
        password: quiet-orchard
        folder: /downloads
        pair: true
      - kind: deluge
        version: "2.1"
        password: quiet-orchard
        folder: /downloads
        pair: true
      - kind: rtorrent
        version: "0.16"
        username: ada
        password: quiet-orchard
        folder: /srv/torrents
        pair: true
timings:
  node:
    stop_deadline: 5s
tmdb:
  movies:
    - id: 9000001
      imdb_id: tt9000001
      title: The Quiet Orchard
      released: 2021-04-16
      runtime: 104m
releases:
  - name: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 12
    advertised_size: 8.2GiB
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: movie, folder: movies}]
  indexers: [{name: Fixture Site, kind: torznab, site: torznab}]
