# yaml-language-server: $schema=../scenario.schema.json
description: >-
  home's two Nodes with a metadata catalog to read: The Salt Road carries every
  part of a movie's record, from its French original title and dates in three
  countries to cast, crew, artwork, a TMDB rating and OMDb's ratings and
  awards, and The Quiet Orchard carries only the essentials. A missed image is
  tried again after five seconds.
seed: movies
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    roles: [storage, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: seedbox
    setup: join
    roles: [searching, downloading]
timings:
  node:
    stop_deadline: 5s
  metadata:
    artwork_retry: 5s
