# yaml-language-server: $schema=../scenario.schema.json
description: >-
  Two Nodes. The Controller home holds Searching and Downloading and keeps
  its Backups in backups in its data dir. The Worker vps holds Storage
  with the Movies root, so a Grab downloaded on home reaches vps through a
  Normal Transfer on the same pair as a copy of a Backup to vps. A run
  makes a folder in vps's data dir a Backup destination, stops vps, takes
  a Backup, and starts vps again, so the copy that waited for it arrives
  once it is back. The release is a 60 second video of about 36 MB, so
  its Transfer spans nine chunks.
seed: offline-destination
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    roles: [searching, downloading, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: vps
    setup: join
    roles: [storage]
timings:
  node:
    stop_deadline: 15s
tmdb:
  movies:
    - id: 9000001
      imdb_id: tt9000001
      title: The Quiet Orchard
      released: 2021-04-16
      runtime: 104m
releases:
  - name: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1920, height: 1080, seconds: 60}
    seeders: 12
    seeded: true
    advertised_size: 8.2GiB
tracker:
  interval: 5s
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: movie, folder: movies, node: vps}]
  indexers: [{name: Fixture Site, kind: torznab, site: torznab}]
