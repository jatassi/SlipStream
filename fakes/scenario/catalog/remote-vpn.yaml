# yaml-language-server: $schema=../scenario.schema.json
description: >-
  S51 (Reachability diagnostic) with a VPN. The Controller atlas sends its
  traffic to the internet through the tunnel wg0, behind a router at
  203.0.113.9 that forwards nothing. atlas runs Plex at plex.vpn.localhost.
  The Worker seedbox at 192.0.2.44 tests from outside.
seed: remote-vpn
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: atlas
    setup: controller
    site: home
    firewall: [{service: plex, family: ipv4, policy: allows}]
    tunnel: true
    media_servers:
      - kind: plex
        name: Plex
        runs_on: atlas
        remote: true
        custom: ["http://plex.vpn.localhost"]
  - name: seedbox
    setup: join
    site: ams
network:
  sites:
    - {name: home, wan: public, address: 203.0.113.9, mapping: [upnp]}
    - {name: ams, wan: none, address: 192.0.2.44}
  dns:
    - {name: plex.vpn.localhost, a: [203.0.113.9]}
timings:
  node:
    stop_deadline: 15s
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: movie, folder: movies}]
