# yaml-language-server: $schema=../scenario.schema.json
description: >-
  home's two Nodes with releases that are folders of files, for importing
  packs. The Copper Coast's episodes and both movies run a minute, so the
  library's Importing settings, a 1MiB smallest video file and samples
  under 5% of the runtime, leave out the 2-second samples and keep the
  8-second videos in both worlds. The site lists a season 1 pack with a
  sample and an nfo, a pack of episodes 1 to 6, a pack of both seasons in
  season folders, a season 2 pack of bare-numbered files, an S01E02E03
  release, a release of The Glass Meridian at 1080p and at 2160p in HDR10,
  Long Division in two parts, and releases of The Glass Meridian that are
  only a sample, an unreadable file, a 1080p video named 2160p, and rar
  parts.
seed: packs
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    roles: [storage, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: seedbox
    setup: join
    roles: [searching, downloading]
