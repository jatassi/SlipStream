# yaml-language-server: $schema=../scenario.schema.json
description: >-
  One Node set up as the Controller with ten wanted movies and two Torznab
  Indexers, for the spec's limited tracker. Fixture Site has no search
  limit. Heron allows 2 searches an hour, and RSS sync keeps one of them
  for Heron's feed, so Backlog search and Search all get the other and
  then wait for Heron, while the Admin's Search skips Heron at its limit
  and Manual search goes first. No site lists a Release, so every
  search finds nothing and the movies stay wanted. Each movie is added
  monitored with no search on add, and Backlog search and RSS sync are on
  as the product ships them.
seed: limited-tracker
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
