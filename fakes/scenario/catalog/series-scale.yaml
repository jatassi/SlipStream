# yaml-language-server: $schema=../scenario.schema.json
description: >-
  One Node set up as the Controller, and fake-tvdb generating two long
  series from the seed: one of 1,200 episodes in 12 seasons and one of
  10,000 episodes in 40 seasons, so its episodes read as 3 and 20 pages.
  TVDB takes a request every millisecond. The library has a TV root, and
  the world sets an Admin TVDB key.
seed: series-scale
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
timings:
  node:
    stop_deadline: 5s
  tvdb:
    interval: 1ms
    burst: 100
tvdb:
  generated:
    - {count: 1, seasons: 12, episodes: 100, seed: series-scale}
    - {count: 1, seasons: 40, episodes: 250, seed: series-scale}
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: series, folder: tv}]
