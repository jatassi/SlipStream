# yaml-language-server: $schema=../scenario.schema.json
description: >-
  One Node set up as the Controller, and fake-tvdb generating one series of
  8 seasons of 30 episodes from the seed. The library's TV root holds a
  file for each of its 240 episodes, which a library scan adds, so the Work
  page's Files section lists 240 files folded per season. The world sets an
  Admin TVDB key.
seed: series-files-scale
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
timings:
  node:
    stop_deadline: 15s
  tvdb:
    interval: 1ms
    burst: 100
tvdb:
  generated:
    - {count: 1, seasons: 8, episodes: 30, seed: series-files-scale}
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: series, folder: tv}]
  folders:
    - folder: tv
      files:
        - {path: "Long Series [tvdbid-60000001]/Season 01/Long Series - S01E01.mkv", video: {width: 640, height: 360, seconds: 1, hdr: sdr}, audio: [{codec: aac, channels: 2, language: eng}]}
