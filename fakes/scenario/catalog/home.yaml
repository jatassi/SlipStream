# yaml-language-server: $schema=../scenario.schema.json
description: >-
  Two Nodes. The Controller home holds every Role but Acquire and Relaying.
  The Worker seedbox pairs by Join Code and holds Searching and Downloading.
  A leecher from outside connects in to the seedbox once it runs the 1080p
  release, so the seedbox's listen port reads reachable.
  Grace joins as a Member by Signup link, and fakes/smtp is the email setting.
seed: home
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
members:
  - email: grace@example.test
    display_name: Grace Hopper
    pin: "1357"
mail: true
nodes:
  - name: home
    setup: controller
    roles: [storage, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: seedbox
    setup: join
    roles: [searching, downloading]
timings:
  node:
    stop_deadline: 5s
  downloading:
    totals_report: 2s
tmdb:
  movies:
    - id: 9000001
      imdb_id: tt9000001
      title: The Quiet Orchard
      released: 2021-04-16
      runtime: 104m
releases:
  - name: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 12
    seeded: true
    advertised_size: 8.2GiB
  - name: The.Quiet.Orchard.2021.720p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1280, height: 720, seconds: 6}
    seeders: 40
    seeded: false
    advertised_size: 4.4GiB
tracker:
  interval: 5s
leecher:
  node: seedbox
  release: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
library:
  roots: [{content_type: movie, folder: movies}]
  indexers: [{name: Fixture Site, site: fixture-site}]
