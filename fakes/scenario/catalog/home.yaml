# yaml-language-server: $schema=../scenario.schema.json
description: >-
  Two Nodes. The Controller home holds every Role but Acquire and Relaying.
  The Worker seedbox pairs by Join Code and holds Searching and Downloading.
seed: home
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    roles: [storage, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: seedbox
    setup: join
    roles: [searching, downloading]
timings:
  node:
    stop_deadline: 5s
tmdb:
  movies:
    - id: 9000001
      imdb_id: tt9000001
      title: The Quiet Orchard
      released: 2021-04-16
      runtime: 104m
releases:
  - name: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 12
    seeded: true
  - name: The.Quiet.Orchard.2021.720p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1280, height: 720, seconds: 6}
    seeders: 40
    seeded: false
tracker:
  interval: 5s
library:
  roots: [{content_type: movie, folder: movies}]
  targets: [{name: 1080p, resolutions: [1080p]}]
  profiles: [{name: Standard, content_type: movie, targets: [1080p]}]
  indexers: [{name: Fixture Site, site: fixture-site}]
