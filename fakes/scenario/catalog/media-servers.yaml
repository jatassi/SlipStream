# yaml-language-server: $schema=../scenario.schema.json
description: >-
  Two Nodes, each with a movie root and a series root, and one Media Server
  of each kind. The Controller home reaches Living room Plex, which holds
  home's roots: the world signs in with Plex through a plex.tv PIN it
  approves on fake-plex-tv, then picks the server's connection through
  home's front. The Worker den holds Storage and Media Server link and
  reaches Den Jellyfin and Den Emby, which hold den's roots. Jellyfin signs
  in with the key fake-jellyfin holds, Emby as its administrator, so
  SlipStream creates its key. Each den server's fallback address is the
  Controller's front. The world saves every server's Path mappings, each
  root the server doesn't hold as not shown. Every library starts empty, so
  the first import into each root starts a full scan first. Every server is
  shown to Members, and fakes/smtp is the email setting. Lin is offered
  Living room Plex and Den Jellyfin and has done nothing yet. Mae signed in
  to Plex and waits for Ada's share. Ravi's Plex share waits for his
  accept, since he signed SlipStream out on plex.tv first, and he made his
  Den Emby user. Tomas accepted his Plex share by signing in and made his
  Den Jellyfin user. Una's Den Jellyfin user was removed. plex.tv also
  holds noor, an account no Member has signed in with.
seed: media-servers
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
mail: true
members:
  - email: lin@example.test
    display_name: Lin Park
    pin: "1122"
    access:
      - {server: Living room Plex, state: offered}
      - {server: Den Jellyfin, state: offered}
  - email: mae@example.test
    display_name: Mae Carter
    pin: "3344"
    plex: {username: mae-plex, email: mae@example.test}
    access:
      - {server: Living room Plex, state: waiting}
  - email: ravi@example.test
    display_name: Ravi Menon
    pin: "5566"
    plex: {username: ravi-plex, email: ravi@example.test}
    access:
      - {server: Living room Plex, state: shared}
      - {server: Den Emby, state: active}
  - email: tomas@example.test
    display_name: Tomas Reyes
    pin: "7788"
    plex: {username: tomas-plex, email: tomas@example.test}
    access:
      - {server: Living room Plex, state: active}
      - {server: Den Jellyfin, state: active}
  - email: una@example.test
    display_name: Una Byrne
    pin: "9900"
    access:
      - {server: Den Jellyfin, state: removed}
plex_accounts:
  - {username: noor, email: noor@example.test}
nodes:
  - name: home
    setup: controller
    roles: [storage, searching, downloading, converting, subtitles, metadata, media-server-link, notifying, serving]
    media_servers:
      - kind: plex
        name: Living room Plex
        show_to_members: true
  - name: den
    setup: join
    roles: [storage, media-server-link]
    media_servers:
      - kind: jellyfin
        name: Den Jellyfin
        show_to_members: true
        users: [grace]
      - kind: emby
        name: Den Emby
        sign_in: admin
        show_to_members: true
timings:
  node:
    stop_deadline: 15s
tmdb:
  movies:
    - id: 9000001
      imdb_id: tt9000001
      title: The Quiet Orchard
      released: 2021-04-16
      runtime: 104m
tvdb:
  series:
    - id: 9100201
      name: The Tin Signal
      status: continuing
      seasons:
        - number: 1
          episodes:
            - {id: 9120101, number: 1, name: Static, aired: 2019-01-07}
            - {id: 9120102, number: 2, name: Carrier Wave, aired: 2019-01-14}
releases:
  - name: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 12
    seeded: true
    advertised_size: 8.2GiB
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots:
    - {content_type: movie, folder: movies}
    - {content_type: series, folder: series}
    - {content_type: movie, folder: den-movies, node: den}
    - {content_type: series, folder: den-series, node: den}
  indexers: [{name: Fixture Site, kind: torznab, site: torznab}]
