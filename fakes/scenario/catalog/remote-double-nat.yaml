# yaml-language-server: $schema=../scenario.schema.json
description: >-
  S51 (Reachability diagnostic) behind two routers. The Controller atlas's
  router answers 192.168.0.5 as its internet side and forwards Plex to
  atlas, and the outer router at 203.0.113.9 forwards nothing. atlas runs
  Plex at plex.double.localhost. The Worker seedbox at 192.0.2.44 tests
  from outside.
seed: remote-double-nat
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: atlas
    setup: controller
    site: home
    firewall: [{service: plex, family: ipv4, policy: allows}]
    media_servers:
      - kind: plex
        name: Plex
        runs_on: atlas
        remote: true
        custom: ["http://plex.double.localhost"]
  - name: seedbox
    setup: join
    site: ams
network:
  sites:
    - name: home
      wan: private
      address: 203.0.113.9
      gateway: 192.168.0.5
      mapping: [upnp]
      upstream: closed
      forwards: [{node: atlas, service: plex}]
    - {name: ams, wan: none, address: 192.0.2.44}
  dns:
    - {name: plex.double.localhost, a: [203.0.113.9]}
timings:
  node:
    stop_deadline: 15s
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: movie, folder: movies}]
