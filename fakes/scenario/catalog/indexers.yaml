tracker:
  interval: 5s
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: movie, folder: movies}]
  indexers:
    - {name: Quarry, kind: catalog, site: quarry, home: seedbox}
    - {name: Larkspur, kind: catalog, site: larkspur, home: seedbox}
    - {name: Marsh, kind: catalog, site: marsh, home: seedbox}
    - {name: Cinder, kind: catalog, site: cinder, home: seedbox}
    - {name: Fixture Site, kind: torznab, site: torznab, home: home}
    - {name: Brook, kind: rss, site: brook, home: home, tracker: Brook, media: [movie]}
