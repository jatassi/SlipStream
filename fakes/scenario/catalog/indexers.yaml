# yaml-language-server: $schema=../scenario.schema.json
description: >-
  Two Nodes that hold Searching. The Controller home holds every Role but
  Relaying, and the Worker seedbox pairs by Join Code and holds Searching.
  On seedbox, Quarry signs in with an API key and keeps no session,
  Larkspur signs in with a form and a captcha, Marsh signs in by POST, and
  Cinder takes a pasted cookie behind a browser challenge cleared for
  seedbox only. On home, Fixture Site is a Torznab feed and Brook an RSS
  feed. Four movies each have one release, so each search can grab.
seed: indexers
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    roles: [storage, searching, downloading, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: seedbox
    setup: join
    roles: [searching]
timings:
  node:
    stop_deadline: 5s
tmdb:
  movies:
    - id: 9000001
      imdb_id: tt9000001
      title: The Quiet Orchard
      released: 2021-04-16
      runtime: 104m
    - id: 9000002
      imdb_id: tt9000002
      title: Harbor Lights
      released: 2019-09-06
      runtime: 98m
    - id: 9000003
      imdb_id: tt9000003
      title: Salt Meadow
      released: 2020-02-14
      runtime: 91m
    - id: 9000004
      imdb_id: tt9000004
      title: Cedar Hollow
      released: 2018-10-12
      runtime: 95m
releases:
  - name: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000001
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 12
    seeded: true
    advertised_size: 8.2GiB
  - name: Harbor.Lights.2019.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000002
    video: {width: 1920, height: 1080, seconds: 5}
    seeders: 8
    seeded: true
    advertised_size: 7.6GiB
  - name: Salt.Meadow.2020.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000003
    video: {width: 1920, height: 1080, seconds: 5}
    seeders: 3
    seeded: true
    advertised_size: 7.1GiB
  - name: Cedar.Hollow.2018.1080p.WEB-DL.H264-FKW
    tmdb_id: 9000004
    video: {width: 1920, height: 1080, seconds: 5}
    seeders: 5
