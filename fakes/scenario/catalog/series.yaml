# yaml-language-server: $schema=../scenario.schema.json
description: >-
  home's two Nodes with fake-tvdb's fictional series catalog. The Lantern
  Keepers has specials, all three orders, a special that moves into season 3
  on the tvdb-move-episode cue and an episode tvdb-remove-episode drops.
  Harbor Nights is ended, findable by its alternative title, and returns on
  tvdb-add-season. Signal Nine has no TMDB id and an episode announced with
  no date. The Shell Forest's own name is Japanese. Harbor Lights is a
  series only TMDB lists, and The Quiet Orchard is a movie beside them. The
  library has a TV root and a Movies root, and the world sets an Admin TVDB
  key.
seed: series
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    roles: [storage, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: seedbox
    setup: join
    roles: [searching, downloading]
timings:
  node:
    stop_deadline: 5s
tvdb:
  series:
    - id: 1001
      name: The Lantern Keepers
      status: continuing
      network: Lantern One
      imdb: tt1001001
      tmdb: 7001
      seasons:
        - number: 0
          episodes:
            - {id: 100101, number: 1, name: The Keepers Before, aired: 2019-12-20, runtime: 30}
            - {id: 100102, number: 2, name: A Winter Light, aired: 2021-12-24, runtime: 44}
        - number: 1
          episodes:
            - {id: 100111, number: 1, name: First Flame, aired: 2020-01-10, runtime: 52}
            - {id: 100112, number: 2, name: The Tide Book, aired: 2020-01-17, runtime: 50}
            - {id: 100113, number: 3, name: Salt and Oil, aired: 2020-01-24, runtime: 51}
        - number: 2
