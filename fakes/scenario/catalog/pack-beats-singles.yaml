# yaml-language-server: $schema=../scenario.schema.json
description: >-
  One Node set up as the Controller, for a season search that fills its
  empty cells with the fewest Releases. fake-tvdb lists The Copper Coast,
  one season of ten one-minute episodes. Fixture Site lists a 1080p WEB-DL
  pack of episodes 1 to 9 and a 1080p Bluray single of every episode, each
  better than the pack's copy. The search takes the pack, which fills nine
  cells with one Release, and the single of episode 10, which the pack
  leaves empty. The library's Importing settings keep the 8-second videos.
  The library has a TV root, and no Work until a test adds one.
seed: pack-beats-singles
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
timings:
  node:
    stop_deadline: 15s
tvdb:
  series:
    - id: 1101
      name: The Copper Coast
      status: ended
      network: Coastline
      imdb: tt1101001
      seasons:
        - number: 1
          episodes:
            - {id: 110111, number: 1, name: Low Tide, aired: 2022-03-04, runtime: 1}
            - {id: 110112, number: 2, name: The Wreckers, aired: 2022-03-11, runtime: 1}
            - {id: 110113, number: 3, name: Signal Fires, aired: 2022-03-18, runtime: 1}
            - {id: 110114, number: 4, name: Brass and Salt, aired: 2022-03-25, runtime: 1}
            - {id: 110115, number: 5, name: The Harbor Master, aired: 2022-04-01, runtime: 1}
            - {id: 110116, number: 6, name: Undertow, aired: 2022-04-08, runtime: 1}
            - {id: 110117, number: 7, name: Copper Bells, aired: 2022-04-15, runtime: 1}
            - {id: 110118, number: 8, name: A Ship in Fog, aired: 2022-04-22, runtime: 1}
            - {id: 110119, number: 9, name: The Long Pier, aired: 2022-04-29, runtime: 1}
            - {id: 110120, number: 10, name: High Water, aired: 2022-05-06, runtime: 1}
