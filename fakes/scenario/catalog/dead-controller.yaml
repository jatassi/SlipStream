# yaml-language-server: $schema=../scenario.schema.json
description: >-
  home's two Nodes and the Unclaimed Node spare, for restoring a dead
  Controller on another machine. home holds every Role but Searching,
  Downloading, Acquire and Relaying, and the Worker seedbox holds Searching
  and Downloading. The site lists one seeded 1080p release of each of two
  movies, so two Grabs leave seedbox seeding two torrents. A run takes a
  Backup on home, kills home, and restores the Backup on spare with
  slipstream restore --old-controller-off, so spare starts as the
  Controller and begins Reconciling.
seed: dead-controller
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    roles: [storage, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: seedbox
    setup: join
    roles: [searching, downloading]
  - name: spare
    setup: none
timings:
  node:
    stop_deadline: 15s
tmdb:
  movies:
    - id: 9300001
      imdb_id: tt9300001
      title: The Quiet Orchard
      released: 2000-05-01
      runtime: 95m
    - id: 9300002
      imdb_id: tt9300002
      title: The Quiet Harbor
      released: 2001-05-02
      runtime: 95m
releases:
  - name: The.Quiet.Orchard.2000.1080p.WEB-DL.H264-FKW
    tmdb_id: 9300001
    video: {width: 1920, height: 1080, seconds: 1}
    seeders: 12
    seeded: true
    advertised_size: 2.1GiB
  - name: The.Quiet.Harbor.2001.1080p.WEB-DL.H264-FKW
    tmdb_id: 9300002
    video: {width: 1920, height: 1080, seconds: 1}
    seeders: 12
    seeded: true
    advertised_size: 2.1GiB
tracker:
  interval: 5s
library:
  storage_levels: {warn_below: 0B, error_below: 0B}
  roots: [{content_type: movie, folder: movies}]
  indexers: [{name: Fixture Site, kind: torznab, site: torznab}]
