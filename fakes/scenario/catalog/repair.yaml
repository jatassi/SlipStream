# yaml-language-server: $schema=../scenario.schema.json
description: >-
  home's two Nodes and the Unclaimed Node office, for pairing a Worker that
  already seeds with a new Controller. home holds every Role but Searching,
  Downloading, Acquire and Relaying, and the Worker seedbox holds Searching
  and Downloading. The site lists one seeded 1080p release of each of 40
  movies, so 40 Grabs leave seedbox seeding 40 torrents. office is claimed
  as a second Controller, and seedbox joins it with office's Join Code.
seed: repair
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
    roles: [storage, converting, subtitles, metadata, media-server-link, notifying, serving]
  - name: seedbox
    setup: join
    roles: [searching, downloading]
  - name: office
    setup: none
timings:
  node:
    stop_deadline: 15s
