# yaml-language-server: $schema=../scenario.schema.json
description: >-
  One Node set up as the Controller, with Backlog search and RSS sync on as
  the product ships them, for Automatic search. fake-tvdb lists The Lantern
  Keepers, two seasons of three episodes, and Harbor Nights, two seasons of
  two, and fake-tmdb lists The Quiet Orchard, The Salt Road and Meadowlark.
  Fixture Site lists a season pack of The Lantern Keepers' season 1, Harbor
  Nights' S01E01 and S01E02, a 1080p WEB-DL of The Quiet Orchard and one of
  Meadowlark. Nothing lists season 2 of either series or The Salt Road, so
  their searches find nothing. Heron lists the same Releases and allows two
  searches a day, one of which RSS sync keeps, so once one search spends
  the other, Backlog search and Search all wait for Heron while a press
  skips it. The library has a TV root
  and a Movies root, and no Work until a test adds one.
seed: auto-search
admin:
  email: ada@example.test
  display_name: Ada Okafor
  pin: "2468"
nodes:
  - name: home
    setup: controller
timings:
  node:
    stop_deadline: 15s
tvdb:
