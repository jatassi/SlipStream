    tvdb: {series: 1001, season: 1}
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 40
    seeded: true
    advertised_size: 12.2GiB
  - name: Harbor.Nights.S01E01.1080p.WEB-DL.H264-FKW
    tvdb: {series: 1002, season: 1, episode: 1}
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 9
    seeded: true
    advertised_size: 3.9GiB
  - name: Harbor.Nights.S01E02.1080p.WEB-DL.H264-FKW
    tvdb: {series: 1002, season: 1, episode: 2}
    video: {width: 1920, height: 1080, seconds: 6}
    seeders: 8
    seeded: true
    advertised_size: 3.8GiB
  - name: The.Quiet.Orchard.2021.1080p.WEB-DL.H264-FKW
